    const outer = span.road.length ? (P === 'A' ? Math.min(outer0, ...span.road.map((x) => x.y0)) : Math.max(outer0, ...span.road.map((x) => x.y1))) : outer0; // and the parking lane if it's in the work area
    const inner = P === 'A' ? lane.y1 : lane.y0; // the dividing line
    const sgn = P === 'A' ? 1 : -1;
    if (bikeNext) notes.push(`The ${dirName(P)} bike lane closes with the traffic lane. Cyclists are held and released with the traffic.`);
    const vApp = Math.min(posted, RULES.tcMaxSpeed);
    taper = use('taper', RULES.taperTC, vApp, 'Traffic control taper');
    taperLabel = 'Traffic control taper';
    endTaper = use('end', RULES.shuttleExit, vApp, 'End of work to the far station');
    const workY = [outer, inner - sgn * clr];
    area('buffer', -buffer, 0, workY[0], workY[1], `BUFFER ${buffer} m`);
    area('work', 0, L, workY[0], workY[1], `WORK AREA ${L} m`, `cones ${coneW} m apart`);
    conesLine(-buffer - taper, outer, -buffer, inner, RULES.coneTC, { label: `TAPER ${taper} m`, labelSide: P, section: 'Traffic control taper' });
    hazardMarkers(-buffer - taper, outer, -buffer, inner);
    conesLine(-buffer, inner, L, inner, coneW, { section: 'Along the buffer and work area', joins: true });
    conesLine(L, inner, L + endTaper, outer, RULES.coneTC, { section: 'Return to the kerb', joins: true });
    const tcP = -buffer - taper - RULES.tcFromTaper;
    const tcO = L + endTaper + RULES.tcFromTaper;
    const tcY = (side) => {
      if (method === 'pts') { const ln = zs.filter((x) => x.kind === 'lane'); const edge = side === 'A' ? ln[0].y0 : ln[ln.length - 1].y1; return side === 'A' ? edge - RULES.ptsFromLane * 0.8 : edge + RULES.ptsFromLane * 0.8; }
      const k = kerbY(side); return side === 'A' ? k - 0.9 : k + 0.9;
    };
    if (method === 'stopslow') {
      items.push({ t: 'tc', id: 'tc1', s: S(tcP), y: tcY(P), side: P, label: 'TC 1' }, { t: 'tc', id: 'tc2', s: S(tcO), y: tcY(O), side: O, label: 'TC 2' });
    } else {
      items.push({ t: 'pts', id: 'pt1', s: S(tcP), y: tcY(P), side: P }, { t: 'pts', id: 'pt2', s: S(tcO), y: tcY(O), side: O });
    }
    // queue estimate (Table 4.3): metres per vehicle counted in 5 minutes, for the stop time T
    shuttle = Math.round(tcO - tcP); // between the two stations (Part 3 s5.4.4)
    shuttleLimit = shuttleMax(vph);
    const T = shuttle <= 250 ? 2 : shuttle <= 500 ? 5 : 10; // assumed maximum hold in minutes; shown on the TGS for the designer to change (Part 3 s4.8.1, s7.3)
    const h = RULES.heavyShare[d.road.heavy || 'low'];
    const per5 = vph / 2 / 12;
    queue = Math.max(RULES.queueMin, Math.ceil(per5 * (1 - h) * RULES.queue.car * T + per5 * h * RULES.queue.heavy * T));
    vals.queue = { v: queue, c: 'A', sp: posted, label: `Queue for a ${T} minute stop`, T, per5: Math.round(per5) };
    const sd = use('sight', RULES.sight, posted, 'Sight distance to the end of the queue');
    const rwaGap = use('rwaPrep', RULES.rwaToPrep, posted, 'ROADWORK AHEAD to PREPARE TO STOP');
    let target = tempSpeed;
    if (posted > RULES.tcMaxSpeed) target = Math.min(target || 999, RULES.tcMaxSpeed); // 60 km/h at most on the approach to a controller
    const steps = speedSteps(posted, target);
    stepsUsed = steps;
    const stationKey = method === 'stopslow' ? 'STOPHERE' : 'STOPRED';
    const prepKey = method === 'stopslow' ? 'TCPREP' : 'SIGPREP';
    const approach = (X, tcU) => {
      const up = X === P ? -1 : 1;
      const U = (dist) => tcU + up * dist;
      const before = (u) => (X === P ? -u : u - L);
      const key = X === P ? 'P' : 'O';
      const place = (code, u, extra = {}) => { sign(code, u, X, before(u), 'before the work', X, extra); sched[key].push(code); };
      place(stationKey, U(RULES.stopHere), { station: true });
      conesLine(U(RULES.stopHere), inner, U(RULES.stopHere + RULES.coneTC * 3), inner, RULES.coneTC, { section: X === P ? 'Centreline at TC 1' : 'Centreline at TC 2' });
      const qy = X === 'A' ? kerbY('A') + 0.4 : kerbY('B') - 0.4;
      items.push({ t: 'queue', id: 'q' + X, s: S(U(RULES.stopHere + queue)), y: qy, side: X, len: queue });
      const dPrep = RULES.stopHere + queue + sd;
      place(prepKey, U(dPrep));
      if (dPrep > 240) place('PREP', U(120));
      if (dPrep > 300) { const gap = at(RULES.rwaToPrep, Math.min(posted, target || posted)); for (let x = 120 + gap; x < dPrep - 20; x += gap) { place('PREP', U(x)); prepRep++; } }
      let uFirst = null;
      if (steps.length) {
        const uFinal = U(dPrep + D);
        place(steps[steps.length - 1] === tempSpeed ? workerSign(steps[steps.length - 1]) : 'SPEED' + steps[steps.length - 1], uFinal, { reg: true });
        uFirst = steps.length > 1 ? placeStepsDir(up, steps, uFinal, (c, u) => place(c, u, { reg: true })) : uFinal;
      }
      const dRwa = Math.max(dPrep + rwaGap, uFirst != null ? Math.abs(uFirst - tcU) + D : 0);
      place('RWA', U(dRwa));
      return { uRwa: U(dRwa), uFinal: steps.length ? U(dPrep + D) : null };
    };
    // step-downs in either direction: upstream is -u for P and +u for O
    const placeStepsDir = (up, steps, uFinal, placeFn) => {
      let prev = uFinal;
      for (let i = steps.length - 2; i >= 0; i--) { const u = prev + up * (RULES.stepZone[steps[i]] || 200); placeFn('SPEED' + steps[i], u); prev = u; }
      return prev;
    };
    const aP = approach(P, tcP);
    const aO = approach(O, tcO);
    firstP = aP.uRwa; firstO = aO.uRwa; uFinalP = aP.uFinal; uFinalO = aO.uFinal;
    laneLeft = r1(lw - ec); laneLeftOK = laneLeft >= RULES.laneShuttle;
    items.push({ t: 'plant', s: S(L / 2), y: (workY[0] + workY[1]) / 2, len: Math.min(L * 0.6, 10) });
    notes.push(
      method === 'stopslow'
        ? 'TC 1 and TC 2 keep radio contact and never release both ends at once. Confirm the last vehicle is through before releasing the other end.'
        : `Set the all-red time so the last vehicle clears the ${shuttle} m single lane before the other end goes green.`,
      `Put a cone on the shoulder at the predicted end of the queue (about ${queue} m back from the STOP HERE sign). If the queue passes it twice or stays past it, the controller tells the supervisor, and someone other than the controller moves PREPARE TO STOP back and extends the speed zone.`,
      `Each controller needs a clear view of approaching traffic for at least ${at(RULES.sight, vApp)} m at the ${vApp} km/h approach${method === 'pts' ? `, and the signals ${RULES.sightPTSS} m in automatic mode` : ''}.`,
      'Hazard markers (T5-7) or narrow KEEP LEFT signs may go at the start and end of the four centreline cones at each station to show drivers their path (Part 3 s4.8).',
    );
  }

  /* --- Lane closure with a merge (two or more lanes in P's direction) --- */
  if (method === 'merge') {
    const lanes = zs.filter((x) => x.kind === 'lane' && x.dir === z.dir);
    const nL = Math.max(...lanes.map((x) => x.idx));
    const leftOf = (x) => (P === 'A' ? x.y0 : x.y1);
    const rightOf = (x) => (P === 'A' ? x.y1 : x.y0);
    // several lanes closed: one merge at a time, each taper the Table 5.8 distance after the last (Part 3 s5.9.1.3).
    // The closure runs from the kerb (left) lane, or from the median or right lane when that's where the work is.
    const shut = span.lanes.length ? span.lanes.filter((x) => x.dir === z.dir) : [z];
    const kerbLane = shut.some((x) => x.idx === 1) || !shut.some((x) => x.idx === nL);
    const closedLanes = [...shut].sort((a2, b2) => (kerbLane ? a2.idx - b2.idx : b2.idx - a2.idx));
    const lane = closedLanes[0], nC = closedLanes.length;
    let outer = kerbLane ? leftOf(lane) : rightOf(lane);
    const edges = [outer, ...closedLanes.map((x) => (kerbLane ? rightOf(x) : leftOf(x)))];
    const inner = edges[nC];
    const sgn = inner > outer ? 1 : -1;
    // a bike lane beside the closed kerb lane closes with it; the work area may take the parking lane too
    const bikeBeside = zs.find((x) => x.kind === 'bike' && (sgn === 1 ? Math.abs(x.y1 - outer) < 0.01 : Math.abs(x.y0 - outer) < 0.01));
    if (bikeBeside) { outer = sgn === 1 ? bikeBeside.y0 : bikeBeside.y1; notes.push(`The ${dirName(P)} bike lane beside the closed lane closes too: cyclists merge with traffic before the taper.`); }
    if (span.road.length) outer = sgn === 1 ? Math.min(outer, ...span.road.map((x) => x.y0)) : Math.max(outer, ...span.road.map((x) => x.y1));
    edges[0] = outer;
    const steps = speedSteps(posted, tempSpeed);
    stepsUsed = steps;
    // Where offset speed zones are allowed, the worker limit starts where workers are exposed, at the start of the buffer,
    // and traffic merges in the zone before it (Part 3 s5.5.1.3; Part 9 Layout 42). Where they aren't, both directions
    // share one zone, so the limit starts one sign spacing before the taper and the other direction's END faces it.
    const lateLimit = steps.length > 0 && offsetOK;
    // Taper speed (Figure 2.2): the limit drivers are under at the taper, or the higher one in the first 200 m of a new zone,
    // which in both layouts is the limit before the worker limit
    const vTaper = steps.length >= 2 ? steps[steps.length - 2] : posted;
    taper = use('taper', RULES.taperMerge, vTaper, 'Merge taper');
    taperLabel = 'Merge taper';
    endTaper = use('end', RULES.termination, posted, 'End taper');
    const coneT = use('coneT', RULES.coneTaper, workSpeed, 'Cones in the taper');
    const workY = [outer, inner - sgn * clr];
    hasArrow = d.control.arrow || d.control.tma || posted >= RULES.arrowBoardFrom;
    if (d.control.tma && buffer < RULES.tma.clear) { buffer = RULES.tma.clear; vals.buffer.v = buffer; vals.buffer.c = 'A'; vals.buffer.label = 'Safety buffer (40 m clear in front of the TMA)'; }
    awa = d.control.tma ? RULES.awa.tma : hasArrow ? RULES.awa.arrow : 0; // Part 3 s5.8: devices go between the taper and the buffer
    if (awa && posted >= RULES.awaHigh.from) { awa = RULES.awaHigh.v; vals.awa = { v: awa, c: 'I', sp: posted, label: 'Additional warning area' }; }
    else if (awa) vals.awa = { v: awa, c: 'U', sp: posted, label: 'Additional warning area' };
    area('buffer', -buffer, 0, workY[0], workY[1], `BUFFER ${buffer} m`);
    area('work', 0, L, workY[0], workY[1], `WORK AREA ${L} m`, `cones ${coneW} m apart`);
    const ts = -buffer - awa - taper; // the last (or only) taper starts here
    const gapT = nC > 1 ? use('taperGap', RULES.taperGap, vTaper, 'Between the merge tapers') : 0;
    const tStart = (k) => ts - (nC - 1 - k) * (gapT + taper); // taper k starts here; the first lane to close tapers first
    const ts1 = tStart(0);
    firstTaperU = ts1;
    conesLine(ts1 - RULES.leadIn.length, outer, ts1, outer, RULES.leadIn.length / (RULES.leadIn.cones - 1), { section: 'Lead-in' });
    const ORD = ['1ST', '2ND', '3RD', '4TH', '5TH'], ORDW = ['First', 'Second', 'Third', 'Fourth', 'Fifth'];
    for (let k = 0; k < nC; k++) {
      const a = tStart(k);
      conesLine(a, edges[k], a + taper, edges[k + 1], coneT, { label: `${nC > 1 ? ORD[k] + ' ' : ''}MERGE TAPER ${taper} m`, labelSide: kerbLane ? P : O, section: nC > 1 ? `${ORDW[k]} merge taper` : 'Merge taper', joins: true });
      hazardMarkers(a, edges[k], a + taper, edges[k + 1]);
      if (k < nC - 1) conesLine(a + taper, edges[k + 1], tStart(k + 1), edges[k + 1], coneW, { section: nC > 2 ? `Between the ${ORDW[k].toLowerCase()} and ${ORDW[k + 1].toLowerCase()} tapers` : 'Between the tapers', joins: true });
    }
    conesLine(ts + taper, inner, L, inner, coneW, { section: 'Along the buffer and work area', joins: true });
    conesLine(L, inner, L + endTaper, outer, coneT, { section: 'End taper', joins: true });
    const lastLane = closedLanes[nC - 1];
    const yLane = (lastLane.y0 + lastLane.y1) / 2;
    if (d.control.tma) items.push({ t: 'tma', id: 'tma', s: S(-buffer - 2), y: yLane, dir: P }); // in the additional warning area with its arrow board, 40 m clear in front
    else if (hasArrow) items.push({ t: 'arrowboard', id: 'ab', s: S(-buffer - awa / 2), y: yLane, dir: P }); // between the taper and the buffer
    if (hasArrow) for (let k = 0; k < nC - 1; k++) items.push({ t: 'arrowboard', id: 'ab' + (k + 1), s: S(tStart(k) + taper + Math.min(gapT, 20) / 2), y: (closedLanes[k].y0 + closedLanes[k].y1) / 2, dir: P }); // one for each earlier merge too
    const placeP = (code, u, extra = {}) => { sign(code, u, P, -u, 'before the work', P, extra); sched.P.push(code); };
    let u = ts1, uFinal = null;
    if (steps.length && !lateLimit) { u -= D; uFinal = u; placeP(workerSign(steps[steps.length - 1]), u, { reg: true }); }
    if (lateLimit) { uFinal = -buffer; placeP(workerSign(steps[steps.length - 1]), uFinal, { reg: true }); }
    u -= D;
    const lsU = u;
    placeP(kerbLane ? 'LCL' : 'RCL', lsU); // lane status sign at least one D before the taper
    let firstStep = lsU;
    if (!lateLimit) firstStep = steps.length > 1 ? placeSteps(steps, uFinal, lsU - D, (c, uu) => placeP(c, uu, { reg: true })) : lsU;
    else if (steps.length > 1) {
      const uInt = Math.min(lsU - D, ts1 - 200); // the taper starts at least 200 m into the intermediate zone, so its speed applies
      placeP('SPEED' + steps[steps.length - 2], uInt, { reg: true });
      firstStep = steps.length > 2 ? placeSteps(steps.slice(0, -1), uInt, uInt, (c, uu) => placeP(c, uu, { reg: true })) : uInt;
    }
    const rwaU = Math.min(firstStep, lsU) - D;
    placeP('RWA', rwaU);
    firstP = rwaU; uFinalP = uFinal;
    if (deferO) firstO = null;
    else if (two && !divided) {
      const uo = L + endTaper + single(D);
      sign('RWA', uo, O, uo - L, 'before the work', O); sched.O.push('RWA'); firstO = uo;
    } else firstO = L + endTaper + D;
    const left = Math.max(0, lanes.length - closedLanes.length);
    if (nC > 1) notes.push(`${cap(numWord(nC))} lanes close one at a time: the ${kerbLane ? (d.road.layout === '1W' ? 'left' : 'kerb') : d.road.layout === 'DIV' ? 'median' : d.road.layout === '1W' ? 'right' : 'centre'} lane first, then each next lane ${gapT} m further on, each with its own taper${hasArrow ? ' and arrow board' : ''} (AGTTM Part 3 Table 5.8).`);
    if (d.work.midLane) notes.push('A middle lane can\'t close on its own, so the lanes between it and the kerb close with it (AGTTM Part 3 Figure 5.16).');
    const perLane = (d.road.signals || d.road.intersection ? RULES.laneCapacity.nearIntersection : RULES.laneCapacity.midblock) * (d.road.heavy === 'high' ? 0.8 : 1);
    const perDir = two ? Math.round(vph / 2) : vph;
    capacity = { left, perDir, cap: Math.round(left * perLane) };
    laneLeft = r1(lw - ec); laneLeftOK = laneLeft >= laneMinV;
    items.push({ t: 'plant', s: S(L / 2), y: (workY[0] + workY[1]) / 2, len: Math.min(L * 0.6, 10) });
    notes.push(
      d.control.tma ? `The TMA parks between the taper and the buffer with its arrow board flashing, at least ${RULES.tma.clear} m before the work area; nobody, no plant and no materials in front of it.` : 'Stand the arrow board between the end of the merge taper and the buffer, flashing before the crew walks into the lane.',
      multilane ? 'Every sign goes on both sides of the road (the median side too) where it can be mounted safely.' : `${cap(dirName(O))} traffic gets a single ROADWORK AHEAD${posted > 55 ? ' at twice the sign spacing' : ''}.`,
      'Keep the merge taper straight and the cones evenly spaced; a ragged taper is the most common set-out fault.',
    );
  }

  /* --- Parking lane, bike lane or shoulder closure --- */
  if (method === 'shoulder') {
    const roadSel = span.road.length ? span.road : [z];
    const strip = { ...z, y0: Math.min(...roadSel.map((x) => x.y0)), y1: Math.max(...roadSel.map((x) => x.y1)) };
    strip.w = strip.y1 - strip.y0;
    const bikeIn = roadSel.some((x) => x.kind === 'bike'), parkIn = roadSel.some((x) => x.kind === 'park');
    stripName = bikeIn && parkIn ? 'parking lane and bike lane' : bikeIn ? 'bike lane' : 'parking lane';
    const outer = strip.side === 'A' ? strip.y0 : strip.y1;
    const inner = strip.side === 'A' ? strip.y1 : strip.y0;
    const sgn = inner > outer ? 1 : -1;
    taper = Math.max(2, Math.round(strip.w)); // short 45 degree taper: a Queensland rule (QGTTM), not in AGTTM Edition 1.2
    vals.taper = { v: taper, c: 'S', sp: posted, label: 'Shoulder taper (45°)' };
    taperLabel = bikeIn && parkIn ? 'Parking and bike lane taper' : bikeIn ? 'Bike lane taper' : 'Shoulder taper';
    endTaper = taper;
    const workY = [outer, inner - sgn * Math.min(clr, strip.w * 0.25)];
    area('buffer', -buffer, 0, workY[0], workY[1], `BUFFER ${buffer} m`);
    area('work', 0, L, workY[0], workY[1], `WORK AREA ${L} m`, `cones ${coneW} m apart`);
    conesLine(-buffer - taper, outer, -buffer, inner, Math.max(1, taper / 2), { label: `TAPER ${taper} m`, labelSide: P, section: taperLabel });
    hazardMarkers(-buffer - taper, outer, -buffer, inner, 1); // one at the start of the taper across the shoulder (Part 3 Figure 5.6)
    conesLine(-buffer, inner, L, inner, coneW, { section: 'Along the buffer and work area', joins: true });
    conesLine(L, inner, L + endTaper, outer, Math.max(1, endTaper / 2), { section: 'End taper', joins: true });
    const ts = -buffer - taper;
    const steps = speedSteps(posted, tempSpeed);
    stepsUsed = steps;
    const placeP = (code, u, extra = {}) => { sign(code, u, P, -u, 'before the work', P, extra); sched.P.push(code); };
    let u = ts, uFinal = null;
    if (bikeIn) { u -= Math.max(D, at(RULES.sight, posted)); placeP('BIKE', u); } // merging-cyclist sign at stopping distance (Part 3 s3.10.2; Table 2.3 used as the nearest figure)
    if (steps.length) { u -= D; uFinal = u; placeP(workerSign(steps[steps.length - 1]), u, { reg: true }); }
    else if (nearTraffic(d)) { u -= D; placeP('WKR', u); }
    const firstStep = steps.length > 1 ? placeSteps(steps, uFinal, u - D, (c, uu) => placeP(c, uu, { reg: true })) : u;
    const rwaU = Math.min(firstStep, u) - D;
    placeP('RWA', rwaU);
    firstP = rwaU; uFinalP = uFinal;
    if (deferO) firstO = null;
    else if (two) {
      const uo = L + endTaper + single(D);
      sign('RWA', uo, O, uo - L, 'before the work', O); sched.O.push('RWA'); firstO = uo;
    } else firstO = L + endTaper + D;
    const next = zs.find((x) => x.kind === 'lane' && Math.abs((strip.side === 'A' ? x.y0 : x.y1) - inner) < 0.01);
    laneLeft = r1((next ? next.w : lw) - ec); laneLeftOK = laneLeft >= laneMinV;
    items.push({ t: 'plant', s: S(L / 2), y: (workY[0] + workY[1]) / 2, len: Math.min(L * 0.5, 10) });
    notes.push(
      bikeIn ? 'Cyclists merge into the traffic lane past the work; the bike lane sign goes one sign spacing before the taper so they see it early.' : 'Ask owners to move parked cars before the taper goes out, and mark the cleared length on the site copy.',
      d.road.wires ? 'Check EWP clearance to the overhead wires before the boom goes up, and keep the approach distance for the voltage.' : 'Keep the plant\'s swing inside the work area.',
    );
    if (parkIn && bikeIn) notes.push('Ask owners to move parked cars before the taper goes out, and mark the cleared length on the site copy.');
  }

  /* --- The footpath as part of a bigger work area: people are sent to the other side --- */
  if (span.foot && method !== 'footpath') {
    const f = span.foot;
    const back = f.side === 'A' ? f.y0 : f.y1, kerb = f.side === 'A' ? f.y1 : f.y0;
    const fy0 = Math.min(back, kerb), fy1 = Math.max(back, kerb), a0 = S(-0.8), a1 = S(L + 0.8);
    area('work', 0, L, fy0, fy1, '');
    items.push({ t: 'barrier', kind: 'fence', s0: a0, s1: a1, y0: back, y1: back }, { t: 'barrier', kind: 'fence', s0: a0, s1: a0, y0: fy0, y1: fy1 }, { t: 'barrier', kind: 'fence', s0: a1, s1: a1, y0: fy0, y1: fy1 });
    sign('FP-CLOSED', -12, f.side, 12, 'before the work', P, { ped: true });
    sign('FP-CLOSED', L + 12, f.side, 12, 'past the work', P, { ped: true });
    sched.ped.push('FP-CLOSED', 'FP-CLOSED');
    notes.push('The footpath is part of the work area: fence it off and send people to the other footpath at a safe crossing point before the closure, not at the fence line.');
  }

  /* --- Footpath closure --- */
  if (method === 'footpath') {
    const f = z;
    let peds = d.control.peds;
    const kerbSide = f.side === 'A' ? f.y1 : f.y0; // the footpath edge next to the road
    const back = f.side === 'A' ? f.y0 : f.y1;
    const fenceBox = (y0, y1) => {
      const a0 = S(-0.8), a1 = S(L + 0.8);
      items.push({ t: 'barrier', kind: 'fence', s0: a0, s1: a1, y0, y1: y0 }, { t: 'barrier', kind: 'fence', s0: a0, s1: a1, y0: y1, y1 },
        { t: 'barrier', kind: 'fence', s0: a0, s1: a0, y0, y1 }, { t: 'barrier', kind: 'fence', s0: a1, s1: a1, y0, y1 });
    };
    if (peds === 'open') {
      const pw = Math.max(RULES.ped.absolute, Math.min(RULES.ped.desirable, f.w - 0.8));
      if (f.w - pw >= 0.6) {
        const wy = f.side === 'A' ? [kerbSide - (f.w - pw), kerbSide] : [kerbSide, kerbSide + (f.w - pw)];
        area('work', 0, L, wy[0], wy[1], `WORK ${L} m`);
        const py = f.side === 'A' ? [back, wy[0]] : [wy[1], back];
        area('ped', -8, L + 8, py[0], py[1], `PATH ${pw.toFixed(1)} m`);
        fenceBox(wy[0], wy[1]);
        pedRoute = true; pathWidth = pw;
      } else peds = 'divert';
    }
    if (peds !== 'open') {
      area('work', 0, L, Math.min(back, kerbSide), Math.max(back, kerbSide), `WORK ${L} m`);
      fenceBox(Math.min(back, kerbSide), Math.max(back, kerbSide));
      if (peds === 'path' && d.road.parking) {
        const pk = zs.find((x) => x.kind === 'park' && x.side === f.side);
        pathWidth = Math.min(pk.w, 2.0);
        area('ped', -10, L + 10, pk.y0, pk.y1, `PATH ${pathWidth.toFixed(1)} m`);
        const by = f.side === 'A' ? pk.y1 : pk.y0;
        items.push({ t: 'barrier', kind: 'barrier', s0: S(-10), s1: S(L + 10), y0: by, y1: by });
        pedRoute = true; pedOnRoad = true;
      }
    }
    const pedSign = peds === 'divert' ? 'FP-CLOSED' : peds === 'path' ? 'FP-DETOUR' : 'FP-NARROW';
    sign(pedSign, -12, f.side, 12, 'before the work', P, { ped: true });
    sign(pedSign, L + 12, f.side, 12, 'past the work', P, { ped: true });
    sched.ped.push(pedSign, pedSign);
    const bothWays = two && !divided; // Part 3 s5.11: two-way roads get advance warning in both directions
    if (bothWays || d.work.plant.some((p) => p !== 'ute') || peds === 'path') {
      const u = -single(D);
      sign('RWA', u, P, -u, 'before the work', P); sched.P.push('RWA'); firstP = u;
    } else firstP = -D;
    if (bothWays) { const uo = L + single(D); sign('RWA', uo, O, uo - L, 'before the work', O); sched.O.push('RWA'); firstO = uo; } else firstO = L + D;
    taper = 0; laneLeft = lw;
    notes.push(
      peds === 'divert' ? 'Send people to the other footpath at a safe crossing point before the closure, not at the fence line.' : `Keep the path at least ${RULES.ped.desirable} m wide where you can (never under ${RULES.ped.absolute} m), firm and level, with a kerb ramp where it meets the road.`,
      'Fence any open excavation with continuous fencing, and cover or backfill it before anyone leaves the site.',
      'Walk the route with a pram or wheelchair in mind before opening it. A sign on the footpath gets a cone at its base.',
    );
    const parkSide = zs.find((x) => x.kind === 'park' && x.side === f.side);
    if (parkSide && peds !== 'path') items.push({ t: 'plant', s: S(L / 2), y: (parkSide.y0 + parkSide.y1) / 2, len: 8, parked: true });
  }

  // END ROADWORK a Table 3.2 distance past the last point affected (Part 3 s3.9), restoring the permanent limit. Where a
  // temporary limit applies and offset zones aren't allowed, each direction's END lines up with the other's limit sign.
  const through = method === 'stopslow' || method === 'pts';
  const eS = at(RULES.endSpacing, posted);
  const workStart = firstTaperU != null ? firstTaperU : -(taper + buffer + awa);
  let endP, endO;
  if (through) {
    const reachP = L + endTaper + RULES.tcFromTaper + RULES.stopHere + (queue || 0); // far end of the other direction's queue
    const reachO = workStart - RULES.tcFromTaper - RULES.stopHere - (queue || 0);
    endP = uFinalO != null ? Math.max(uFinalO, reachP + 5) : reachP + eS;
    endO = uFinalP != null ? Math.min(uFinalP, reachO - 5) : reachO - eS;
  } else {
    endP = L + endTaper + eS;
    endO = workStart - eS;
    if (deferO) {
      // the other direction gets the same limit over the same stretch: its limit sign opposite P's END, its END opposite P's limit sign
      const stepsO = speedSteps(posted, tempSpeed);
      const placeO = (code, u, extra = {}) => { sign(code, u, O, u - L, 'before the work', O, extra); sched.O.push(code); };
      placeO(workerSign(tempSpeed), endP, { reg: true });
      let prev = endP;
      for (let i = stepsO.length - 2; i >= 0; i--) { const u = prev + (RULES.stepZone[stepsO[i]] || 150); placeO('SPEED' + stepsO[i], u, { reg: true }); prev = u; }
      const uR = prev + D; placeO('RWA', uR); firstO = uR;
      uFinalO = endP;
      if (uFinalP != null) endO = Math.min(endO, uFinalP);
      notes.push(`${cap(dirName(O))} traffic gets the same ${tempSpeed} km/h limit over the same stretch: on this road AGTTM doesn't allow a different limit for each direction (Part 3 s5.5.1.5).`);
    }
  }
  const hadSpeed = (list) => list.some((k) => /^(SPEED|SPW)\d/.test(k));
  if (sched.P.length) sign(hadSpeed(sched.P) ? 'END' + posted : 'END', endP, P, endP - L, 'past the work', P, { end: true });
  if (sched.O.length) sign(hadSpeed(sched.O) ? 'END' + posted : 'END', endO, O, -endO, 'past the work', O, { end: true });

  // every temporary speed zone, both directions: from its sign to the next speed sign or END (Table 5.5)
  const zones = speedZonesOf(items, P, O, dirName, tempSpeed);
  const endGap = Math.round(through ? endP - (L + endTaper + RULES.tcFromTaper + RULES.stopHere + (queue || 0)) : endP - (L + endTaper));
  // length of the lowest speed zone for P's traffic, from its sign to END ROADWORK
  let zoneLen = null;
  if (tempSpeed) {
    const zs0 = items.find((it) => it.t === 'sign' && it.dir === P && (it.code === 'SPEED' + tempSpeed || it.code === 'SPW' + tempSpeed));
    const zs1 = items.find((it) => it.t === 'sign' && it.dir === P && it.end);
    if (zs0 && zs1) zoneLen = Math.round(Math.abs(zs1.s - zs0.s));
  }

  const side = [];
  if (d.road.intersection) side.push({ s: S(L + 40), side: O, name: d.site.crossA || 'Side street' });

  const all = items.flatMap((it) => (it.t === 'cones' ? it.pts.map((p) => p[0]) : it.t === 'area' ? [it.s0, it.s1] : it.t === 'barrier' ? [it.s0, it.s1] : [it.s]));
  const pad = method === 'footpath' ? 12 : 22;
  const extent = { min: Math.min(...all) - pad, max: Math.max(...all) + pad };

  // clearance to moving traffic from the work area's edge, and whether the TGS relies on keeping people further back
  const clearance = workClearance(d, method);
  const gi = (g) => GAPS.findIndex((x) => x[0] === g);
  const gapWider = !!clearance && gi(d.work.gap || '0-1.2') > gi(clearance.band);
  const gapMin = { '0-1.2': 0, '1.2-3': 1.2, '3-6': 3, '6-9': 6, '9+': 9 }[d.work.gap || '0-1.2'];
  notes.push(gapWider
    ? `The work area is marked at least ${gapMin} m from moving traffic with cones, fencing or barrier, and everyone and everything stays inside it. If anyone has to go closer, slow or stop the traffic first.`
    : 'Everyone and everything stays inside the marked work area. If anyone has to go closer to moving traffic, slow or stop the traffic first.');

  const geo = { strips: zs.map((x) => ({ ...x })), total, tram: d.road.tram, side, northRot: { eastbound: 90, westbound: -90, southbound: 180 }[d.site.headA || d.site.dirA] || 0 };
  const category = ttmCategory(d);
  const s = {
    category, vals,
    speed: posted, approachSpeed: posted, tempSpeed, workSpeed, method, methodName: METHOD_NAMES[method][0], methodShort: METHOD_NAMES[method][1],
    D, taper, taperLabel, buffer, endTaper, laneLeft, laneLeftOK, laneMin: laneMinV, clr, hasArrow, pedRoute, pathWidth,
    queue, shuttle, shuttleLimit, capacity, steps: stepsUsed, zoneLen, vph, hazardMarkers: items.filter((i) => i.t === 'hm').length,
    speedSrc: 'From speed zone data: check the sign',
    refD: RULES.cite.spacing, refTaper: RULES.cite.taper, refBuffer: RULES.cite.buffer,
    work: { length: L }, items, extent, geo, notes, P, O, dirName, z,
    cones: coneSections.reduce((t, c) => t + c.count, 0), coneSections, coneW, coneT: vals.coneT?.v ?? RULES.coneTC,
    ec, multilane, zones, endGap, offsetFixed: deferO, pedOnRoad, prepRepeaters: prepRep, awa, span, clearance, gapWider, gapMin, stripName,
    dupCount: items.filter((it) => it.t === 'sign' && it.dup).length,
    tcSight: method === 'pts' ? RULES.sightPTSS : at(RULES.sight, Math.min(posted, RULES.tcMaxSpeed)),
  };
  s.sched = sched;
  return s;
}
/* Lists, hazards, checks and the set-out order for the finished scheme */
function finishScheme(s, d, job) {
  s.siteRisk = siteRiskRating(s.speed, s.category.cat, d.work.gap || '0-1.2');
  s.schedule = buildSchedule(s, d, s.sched);
  s.load = buildLoad(s, d);
  // hazards from every work area (a footpath closure beside a lane closure brings its own), highest rating kept
  if (s.parts) {
    const byId = new Map();
    s.parts.forEach((pt) => buildHazards(pt, blockInput(d, pt.span?.sel?.length ? pt.span.sel : [pt.z], false)).forEach((h) => { const o = byId.get(h.id); if (!o || h.band > o.band) byId.set(h.id, h); }));
    s.hazards = [...byId.values()];
  } else s.hazards = buildHazards(s, d);
  // AGTTM Part 10 s2.4.4 (after Table 2.5): any risk rated Medium or above revises the site risk rating to High, and the
  // designer revisits the traffic management options. Uses the ratings before controls (step 3 comes before step 4).
  const raised = s.hazards.filter((h) => h.band >= RISK.bands.indexOf('Medium'));
  s.siteRiskBase = s.siteRisk;
  if (s.siteRisk !== 'High' && raised.length) s.siteRisk = 'High';
  s.siteRiskWhy = s.siteRisk !== s.siteRiskBase ? `Raised from ${s.siteRiskBase} (Figure 2.3) because ${plural(raised.length, 'hazard')} ${raised.length === 1 ? 'is' : 'are'} rated Medium or above before controls` : '';
  s.checks = buildChecks(s, d, job);
  s.options = optionsConsidered(s, d);
  s.setout = buildSteps(s, d);
  return s;
}

/* ---------- Sign list, grouped the way the crew sets it out ---------- */
function buildSchedule(s, d, sched) {
  const signs = s.items.filter((it) => it.t === 'sign');
  const groups = [];
  const nameDir = (x) => cap(s.dirName(x));
  const mk = (title, short, icon, list) => { if (list.length) groups.push({ title, short, icon, items: list }); };
  const toItem = (sg) => ({
    key: sg.code, code: SIGNS[sg.code]?.code || '', name: SIGNS[sg.code]?.name || sg.code, dist: sg.dist, distLabel: sg.distLabel,
    where: sg.ped ? 'On the footpath, facing people walking, with a cone at its base' : `${sg.dup ? 'Both sides of the road' : 'Left side'}, facing ${s.dirName(sg.dir)} traffic${sg.station ? '; the controller stands 6 m past it' : ''}`,
    qty: sg.dup ? 2 : 1, dup: !!sg.dup,
  });
  const order = (a, b) => (b.dist ?? 0) - (a.dist ?? 0);
  mk(`${nameDir(s.P)} traffic`, s.dirName(s.P), 'road', signs.filter((x) => x.dir === s.P && !x.ped && !x.end).sort(order).map(toItem).concat(signs.filter((x) => x.dir === s.P && x.end && !x.ped).map(toItem)));
  mk(`${nameDir(s.O)} traffic`, s.dirName(s.O), 'road', signs.filter((x) => x.dir === s.O && !x.ped && !x.end).sort(order).map(toItem).concat(signs.filter((x) => x.dir === s.O && x.end).map(toItem)));
  mk('People walking', 'Footpath', 'walk', signs.filter((x) => x.ped).map(toItem));
  if (s.coneSections.length) mk('Cones', 'Cones', 'cone', s.coneSections.map((c) => ({ key: 'CONE', code: '', name: `${c.name}, ${c.length} m`, where: `${c.gap} m apart (guide maximum ${c.max} m)`, dist: null, qty: c.count })));
  const dev = [];
  if (s.items.some((i) => i.t === 'queue')) dev.push({ key: 'CONE', code: '', name: 'End-of-queue marker cones', where: `On the shoulder about ${s.queue} m back from each STOP HERE sign`, dist: null, qty: s.items.filter((i) => i.t === 'queue').length });
  if (s.hazardMarkers) dev.push({ key: 'HM', code: 'T5-5', name: 'Temporary hazard markers', where: s.method === 'shoulder' ? 'At the start of the taper, pointing traffic past' : 'Start, middle and end of the taper, pointing traffic past, 1 m clear of the open lane', dist: null, qty: s.hazardMarkers });
  if (s.items.some((i) => i.t === 'arrowboard')) dev.push({ key: 'AB', code: '', name: 'Arrow board', where: 'Between the end of the merge taper and the buffer, in the closed lane', dist: null, qty: 1 });
  if (s.items.some((i) => i.t === 'tc')) dev.push({ key: 'BAT', code: 'R6-8B / T7-1B', name: 'Stop/Slow bats and UHF radios with a back-up channel', where: 'One per traffic controller, plus the relief controller', dist: null, qty: 2 });
  if (s.items.some((i) => i.t === 'pts')) dev.push({ key: 'PTS', code: '', name: 'Portable traffic signals', where: 'At each end of the single lane, on the left of each approach', dist: null, qty: 2 });
  const fence = s.items.filter((i) => i.t === 'barrier');
  if (fence.length) dev.push({ key: 'FENCE', code: '', name: 'Pedestrian fencing panels', where: 'Around the work area and along the route', dist: null, qty: Math.max(4, Math.ceil(fence.reduce((a, b) => a + Math.hypot(b.s1 - b.s0, (b.y1 ?? 0) - (b.y0 ?? 0)), 0) / 2.4)) });
  if (s.items.some((i) => i.t === 'tma')) dev.push({ key: 'TMA', code: '', name: 'Truck mounted attenuator with arrow board', where: `Between the taper and the buffer, at least ${RULES.tma.clear} m before the work area; nobody in front of it`, dist: null, qty: 1 });
  mk('Devices', 'Devices', 'cone', dev);
  return { groups, total: signs.reduce((t, sg) => t + (sg.dup ? 2 : 1), 0) };
}

function buildLoad(s, d) {
  const signs = s.items.filter((it) => it.t === 'sign');
  const byCode = {};
  signs.forEach((sg) => { byCode[sg.code] = (byCode[sg.code] || 0) + (sg.dup ? 2 : 1); });
  const faces = signs.reduce((t, sg) => t + (sg.dup ? 2 : 1), 0);
  const load = Object.entries(byCode).map(([code, qty]) => ({ qty, name: SIGNS[code]?.name || code, glyph: signFaceSVG(code, 34, 34) }));
  const coneSVG = `<svg viewBox="0 0 34 34"><path d="M13 5h8l7 23H6z" fill="#FF6A13"/><path d="M10.4 14.5h13.2l1.2 4H9.2z" fill="#fff"/><rect x="4" y="27" width="26" height="4" rx="1.5" fill="#C8500E"/></svg>`;
  const markers = s.items.filter((i) => i.t === 'queue').length;
  if (s.cones || markers) load.push({ qty: Math.ceil((s.cones + markers) * 1.1), name: 'Cones (10% spare)', glyph: coneSVG });
  if (s.hazardMarkers) load.push({ qty: s.hazardMarkers, name: 'Temporary hazard markers', glyph: signFaceSVG('HM', 34, 34) });
  load.push({ qty: faces * 2, name: 'Sandbags for sign stands', glyph: `<svg viewBox="0 0 34 34"><rect x="6" y="12" width="22" height="14" rx="6" fill="#C8B38A" stroke="#8A7650"/></svg>` });
  load.push({ qty: faces, name: 'Sign stands or MMS frames', glyph: `<svg viewBox="0 0 34 34"><path d="M17 4v18M17 22l-9 8M17 22l9 8" stroke="#6B7580" stroke-width="3" fill="none" stroke-linecap="round"/></svg>` });
  if (d.work.night) load.push({ qty: Math.ceil(s.cones / 3) + 4, name: 'Lamps for cones and signs', glyph: `<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="9" fill="#FFD200"/><circle cx="17" cy="17" r="13" fill="none" stroke="#FFD200" stroke-width="2" stroke-dasharray="3 4"/></svg>` });
  return load;
}

  const val = (x) => (typeof x === 'function' ? x(ctx) : x);
  return HAZARDS.filter((h) => h.when(ctx)).map((h) => {
    const L = val(h.L), C = val(h.C), rL = val(h.rL), rC = val(h.rC);
    return { id: h.id, always: !!h.always, name: h.name, short: h.short, who: h.who, why: val(h.why), L, C, score: L * C, band: riskBand(L, C), rL, rC, rScore: rL * rC, rBand: riskBand(rL, rC), controls: h.controls(ctx).filter(Boolean), np: h.notPracticable ? h.notPracticable(ctx) : [], owner: HAZARD_OWNER[h.id] || 'TMI' };
  }).sort((a, b) => b.rBand - a.rBand || b.band - a.band || b.score - a.score);
}

/* AGTTM Part 2 s2.4, Part 3 s2.2.2 and s4.1; Part 1 Table 3.1 for the 6 m test. "Through" means traffic passes the work
   area during pauses in the work; a shuttle, where traffic passes the work in the remaining lane one direction at a
   time, is a "past" layout (Part 3 s5.4.4, s5.10; Part 9 Table 3.3). "Past" has to be justified: workers are more exposed. */
function optionsConsidered(s, d) {
  const shuttle = s.method === 'stopslow' || s.method === 'pts';
  const clear6 = ['6-9', '9+'].includes(d.work.gap || '0-1.2');
  const pastWhy = shuttle
    ? `traffic passes the work in the remaining lane, one direction at a time, under ${s.method === 'pts' ? 'portable signals' : 'traffic controllers (with the reason recorded)'}.`
    : s.method === 'merge'
      ? `one lane is closed and traffic merges over a ${s.taper} m taper, with a ${s.buffer} m buffer${s.tempSpeed ? ` and ${s.tempSpeed} km/h past the work` : ''}.`
      : s.method === 'shoulder'
        ? `traffic keeps its lane; the ${s.stripName || 'parking lane'} is closed with a buffer and the cone line${s.tempSpeed ? `, and ${s.tempSpeed} km/h past the work` : ''}.`
        : `traffic is not affected; people walking get ${s.pathWidth ? `a fenced ${s.pathWidth.toFixed(1)} m path` : 'a route on the other side'}.`;
  return [
    { lvl: 'Around', name: 'Detour, sidetrack, or the whole work area 6 m or more from traffic', chosen: clear6,
      why: clear6 ? 'Chosen: the work area, including vehicles and plant, stays at least 6 m from the nearest traffic lane.'
        : 'Not chosen: a detour or sidetrack was considered; the work fits within one lane or path, and a detour needs its own TGS and road authority approval. The designer records the reason on the TMP.' },
    { lvl: 'Through', name: 'Traffic held, then released across the work area during pauses in the work', chosen: false,
      why: 'Not chosen: the work occupies its lane or path for the whole shift, so it is never cleared for traffic to pass through.' },
    { lvl: 'Past', name: 'Traffic keeps moving past the work area', chosen: !clear6,
      why: !clear6 ? `Chosen because ${pastWhy} AGTTM asks the plan to justify this option because workers are more exposed.` : 'Not needed: the work is 6 m or more from traffic.' },
    { lvl: 'Short term', name: 'Short term, low impact methods (AGTTM Part 5)', chosen: false,
      why: 'Not used: the work needs a static worksite for its duration and extent.' },
  ];
}

/* AGTTM Part 6 s6.3 to 6.4 (set-out) and s8.3 to 8.4 (pack-up), Figures 6.1 and 8.1: set out the works-side END
   ROADWORK first, then the other direction from the first sign its drivers see, then the works direction; controllers
   hold both directions while the taper goes out. Pack up the work area and taper first, then collect the signs in one
   loop driving with the traffic. */
/* Every step has a key, so progress survives a change in the list. The day starts and ends with the crew's timesheets,
   and the MOA (or the consent or permit that stands in for it) is activated before the first device goes out. */
function moaStep(d) {
  if (d.road.privateProp) return { title: 'Owner\'s permission in hand', text: `Works on private property: check the written permission from ${d.road.privateAuth || 'the owner or manager'} and their site rules before the first sign goes out.` };
  // DTP roads: the MOA impact is switched to TM on in RAPP at or after its start time, and TM off when the devices are in
  // (DTP RAPP FAQ; DTP Transport Operations Centre, 1300 107 757, for impacts with signal TRIMS or LUMS)
  if (d.site.authority === 'dtp') return {
    title: 'Activate the MOA (TM on)', text: `At or after the MOA start time, and before the first sign goes out, switch the impact${d.permit ? ` for ${d.permit}` : ''} to TM on in RAPP and take a screenshot. Call the TOC on 1300 107 757 instead if the impact has signal TRIMS or LUMS.`,
    off: d.work.multiDay
      ? { title: 'Set the MOA for aftercare', text: 'Before the crew leaves, switch the shift impact off and deal with the MOA\'s aftercare impact as the MOA sets out, and screenshot them.' }
      : { title: 'Deactivate the MOA (TM off)', text: 'When the last device is off the road, and no later than the MOA end time, switch the impact to TM off in RAPP and take a screenshot. Call the TOC on 1300 107 757 if the TOC turned it on.' },
  };
  return { title: 'Consent for works in hand', text: `Check the ${d.site.lga || 'council'} consent or permit${d.permit ? ` (${d.permit})` : ''} and its conditions before the first sign goes out.` };
}
function buildSteps(s, d) {
  const inst = [], rem = [];
  const through = s.method === 'stopslow' || s.method === 'pts';
  const sideTxt = (sg) => (sg.ped ? 'on the footpath' : `${sg.dup ? 'on both sides of the road' : 'on the left'} for ${s.dirName(sg.dir)} traffic`);
  const ppe = ppeNeeds(d).filter((x) => x.on).map((x) => x.short);
  inst.push({ key: 'ts-start', act: 'tsStart', title: 'Start timesheets', text: 'Start today\'s timesheet for everyone on site before the pre-start. Tapping this starts them at the current time.' });
  inst.push({ key: 'prestart', title: 'Pre-start with the crew', text: `Go through this TGS, the SWMS and the ${s.hazards.length} hazards. Do a 5-minute traffic count against the TGS.${through ? ' For controllers: escape paths, radio channel and back-up channel, warning signal, break and relief plan, queue trigger and incident procedure.' : ''} Check PPE: ${andList(ppe)}. Everyone signs on.` });
  const moa = moaStep(d);
  inst.push({ key: 'moa', title: moa.title, text: moa.text });
  const byDir = (dir) => s.items.filter((it) => it.t === 'sign' && it.dir === dir && !it.end && !it.ped).sort((a, b) => (b.dist ?? 0) - (a.dist ?? 0));
  const endOf = (dir) => s.items.find((it) => it.t === 'sign' && it.end && it.dir === dir);
  const coverTxt = (sg) => (sg.reg ? ' Cover it whenever workers leave.' : /PREP|TCA|WKR/.test(sg.code) ? ' Cover it whenever controllers or workers leave.' : '');
  const addSign = (sg) => sg && inst.push({ key: 'sign:' + sg.id, title: SIGNS[sg.code]?.name || sg.code, text: `${sg.dist} m ${sg.distLabel}, ${sideTxt(sg)}.${sg.station ? ' The controller stands 6 m past it.' : ''}${coverTxt(sg)}`, code: sg.code, ref: sg.id, who: sg.station || /PREP|TCA/.test(sg.code) ? 'Controller or TMI' : 'TMI or crew' });
  const cones = (name) => s.coneSections.find((c) => c.name === name);
  const textFor = (x) => {
    if (x.name === 'Lead-in') return 'Along the edge of the lane being closed, just before the taper.';
    if (/^Between/.test(x.name)) return 'Along the lane line from the end of one merge taper to the start of the next.';
    if (/taper/i.test(x.name) && !/End|Return/.test(x.name)) return `${x.length} m long. Start at the kerb end and step each cone ${x.gap} m along and across towards the lane line, facing the traffic and placing them in the direction of traffic. ${s.method === 'shoulder' ? 'A hazard marker at the start of the taper' : 'Hazard markers at the start, middle and end'}, pointing traffic past.`;
    if (x.name === 'End taper' || x.name === 'Return to the kerb') return `${x.length} m back to the kerb, so drivers see where the lane opens again.`;
    if (/Centreline/.test(x.name)) return 'Four cones on the centreline starting at the STOP HERE sign, so stopped drivers hold their line.';
    return `On the line between the work area and the open lane, ${s.ec} m clear of it, from the end of the taper to the end of the work area.`;
  };
  const addCones = (x) => x && inst.push({ key: 'cones:' + x.id, title: `${x.name}: ${plural(x.count, 'cone')}, ${x.gap} m apart`, text: textFor(x), code: 'CONE', ref: x.id });
  // 1. END ROADWORK for the works direction, placed as the crew leaves the work area
  addSign(endOf(s.P));
  if (endOf(s.O) || byDir(s.O).length) inst.push({ key: 'turn1', title: 'Turn safely', text: 'Use the road network: forward travel and legal turns only.' });
  // 2. the other direction, from the first sign its drivers see, then its END ROADWORK
  byDir(s.O).forEach(addSign);
  addCones(cones('Centreline at TC 2'));
  addSign(endOf(s.O));
  if (byDir(s.O).length || endOf(s.O)) inst.push({ key: 'turn2', title: 'Turn safely', text: 'Back to the works direction the same way.' });
  // 3. the works direction, from the first sign its drivers see
  byDir(s.P).forEach(addSign);
  addCones(cones('Centreline at TC 1'));
  s.items.filter((it) => it.t === 'sign' && it.ped).forEach((sg) => inst.push({ key: 'sign:' + sg.id, title: SIGNS[sg.code]?.name || sg.code, text: `${sg.dist} m ${sg.distLabel}, ${sideTxt(sg)}, with a cone at its base.`, code: sg.code, ref: sg.id }));
  if (s.items.some((i) => i.t === 'queue')) inst.push({ key: 'queue', title: 'End-of-queue marker cones', text: `One on the shoulder about ${s.queue} m back from each STOP HERE sign. If the queue passes it twice or stays past it, the controller tells the supervisor.`, code: 'CONE', ref: s.items.find((i) => i.t === 'queue').id });
  // 4. controllers or signals hold both directions while the taper goes out
  if (s.items.some((i) => i.t === 'tc')) inst.push({ key: 'tc', title: 'Traffic controllers in position', text: 'Each on the left of the traffic they control, off the road, 6 m in front of the taper, with bats and radios. They hold both directions briefly while the taper and cones go out.' });
  if (s.items.some((i) => i.t === 'pts')) inst.push({ key: 'pts', title: 'Portable signals on and tested', text: `Both heads on red, within ${RULES.ptsFromLane} m of the lane; run one full cycle, then hold both directions while the taper and cones go out.` });
  if (s.items.some((i) => i.t === 'tma')) inst.push({ key: 'tma', title: 'TMA in position', text: `Between the taper and the buffer with its arrow board flashing, at least ${RULES.tma.clear} m before the work area, before the crew walks into the lane.` });
  else if (s.items.some((i) => i.t === 'arrowboard')) inst.push({ key: 'arrow', title: 'Arrow board on', text: 'Between the end of the merge taper and the buffer, in the closed lane, flashing before the taper goes out.' });
  // 5. taper and cones in the direction of traffic
  s.coneSections.filter((x) => !/Centreline/.test(x.name)).forEach(addCones);
  if (s.method === 'footpath' || s.items.some((i) => i.t === 'barrier' && i.kind === 'fence')) inst.push({ key: 'fence', title: 'Fence the work area', text: `Continuous fencing around the work${s.pedRoute ? ' and along the pedestrian route' : ''}; the path stays at least ${RULES.ped.desirable} m wide where you can.` });
  inst.push({ key: 'plant-in', title: 'Plant into the work area', text: 'Only once every device is out. Plant stays inside the cones.' });
  inst.push({ key: 'drive', title: 'Drive-through check', text: 'Drive each approach as a driver would and fix anything hard to see. Take a photo from each approach for the record. Signs and tapers may be 10% short or 25% long of the TGS distance; anything more is the designer\'s call.' });
  // pack-up
  rem.push({ key: 'plant-out', title: 'Plant out of the work area', text: 'Clear the work area and make any excavation safe before touching the devices.' });
  if (through) rem.push({ key: 'hold', title: 'Hold both directions', text: s.method === 'pts' ? 'Signals on all-red while the cones come in.' : 'Controllers hold both directions while the cones come in.' });
  if (s.method !== 'footpath') rem.push({ key: 'cones-in', title: 'Cones in, from the far end back', text: 'Work area cones from the far end back to the taper, then the taper from the centreline to the kerb, lead-in last.' });
  else rem.push({ key: 'fence-down', title: 'Fencing down', text: 'Only after the footpath is safe to walk on again.' });
  if (s.items.some((i) => i.t === 'tma' || i.t === 'arrowboard')) rem.push({ key: 'arrow-out', title: 'Arrow board or TMA out', text: 'After the taper is in, protecting the crew while it comes in.' });
  if (through) rem.push({ key: 'open-lane', title: 'Open the single lane', text: 'Traffic control ends with both directions open; pick up the four centreline cones at each station.' });
  rem.push({ key: 'signs-in', title: 'Signs in, one loop with the traffic', text: 'Start with END ROADWORK on the works side; turn; collect the other direction from the first sign its drivers see through to its END sign; turn; then the works direction from its first sign. Uncover any permanent signs.' });
  if (moa.off) rem.push({ key: 'moa-off', title: moa.off.title, text: moa.off.text });
  rem.push({ key: 'close', title: 'Close the site in My TGS', text: 'Final drive-through, then record the pack-up time and a photo from each approach.' });
  rem.push({ key: 'ts-end', act: 'tsEnd', title: 'End timesheets', text: 'End today\'s timesheet for everyone on site. Tapping this ends them at the current time; add any breaks on the Timesheet page.' });
  return { install: inst, remove: rem };
}

/* PPE for the job, shown on the Work page and at the pre-start. Anyone within 3 m of plant or equipment wears a hard
   hat (company rule, S); the rest follows the SWMS. */
function ppeNeeds(d) {
  const plant = d.work.plant || [];
  const machines = plant.length > 0 || hasType(d, 'dig', 'pit', 'asphalt', 'lift', 'tree', 'delivery') || !!d.control.tma;
  return [
    { key: 'hivis', short: d.work.night ? 'night-rated hi-vis' : 'hi-vis', label: d.work.night ? 'Hi-vis rated for night' : 'Hi-vis', why: 'Everyone on site', on: true },
    { key: 'boots', short: 'safety boots', label: 'Safety boots', why: 'Everyone on site', on: true },
    { key: 'hat', short: 'a hard hat within 3 m of plant or equipment', label: 'Hard hat', why: 'Anyone within 3 m of plant or equipment', on: machines || !!d.road.wires, alert: machines },
    { key: 'glasses', short: 'safety glasses', label: 'Safety glasses', why: 'Digging, cutting or asphalt', on: hasType(d, 'dig', 'asphalt') },
    { key: 'ears', short: 'hearing protection', label: 'Hearing protection', why: 'Near an excavator, vacuum truck or saw', on: plant.some((x) => ['exc', 'vac'].includes(x)) || hasType(d, 'asphalt') },
    { key: 'gloves', short: 'gloves', label: 'Gloves', why: 'Handling signs, stands and cones', on: true },
    { key: 'sun', short: 'sun protection', label: 'Sun protection', why: 'Hat, sunscreen and long sleeves', on: !d.work.night },
  ];
}

/* Gear My TGS suggests from the earlier answers: the road's TTM category, the speed and traffic, the method and the
   work. The toggles follow these until the user changes one. */
function gearAdvice(d) {
  const cat = ttmCategory(d).cat, v = d.site.speed, aadt = Number(d.site.aadt) || 0;
  const lane = d.control.method === 'merge';
  const pedRoad = d.control.peds === 'path' && v >= RULES.ped.barrierFrom;
  const open = hasType(d, 'dig', 'pit');
  const tma = !lane ? { on: false, why: 'Used behind a lane closure; this job doesn\'t close a lane' }
    : cat >= RULES.tma.shouldCat ? { on: true, why: `Category ${cat} lane closure: AGTTM says a TMA should be used (Part 3 s5.8.1)` }
      : cat === RULES.tma.considerCat && v >= RULES.tma.considerFrom ? { on: true, why: `Category 2 at ${v} km/h: AGTTM says to consider a TMA (Part 3 s5.8.1)` }
        : { on: false, why: `Not expected on a Category ${cat} road at ${v} km/h; add one if the risk assessment calls for it` };
  const arrow = !lane ? { on: false, why: 'Used for lane closures' }
    : v >= RULES.arrowBoardFrom ? { on: true, why: `Lane closure at ${v} km/h (AGTTM Part 3 s5.8)` } : { on: false, why: `Optional below ${RULES.arrowBoardFrom} km/h; add one where drivers need more warning of the merge` };
  const vmsWhy = d.work.multiDay ? 'Aftercare: drivers get notice of works that stay in place' : cat >= 3 ? `Category ${cat} road` : v >= 80 ? `${v} km/h approach` : aadt >= 20000 ? `About ${aadt.toLocaleString('en-AU')} vehicles a day` : '';
  const vms = vmsWhy ? { on: true, why: `${vmsWhy}; AGTTM leaves it to the risk assessment (Part 3 s6.10)` } : { on: false, why: 'Not needed on this road unless the risk assessment calls for one' };
  const barWhy = pedRoad ? `People walking in the road at ${v} km/h need a barrier (AGTTM Part 3 s3.10.1)` : d.work.multiDay && open ? 'An excavation left in place for aftercare' : v >= 80 && nearTraffic(d) ? `Work area within 3 m of ${v} km/h traffic` : '';
  const barrier = barWhy ? { on: true, why: barWhy } : { on: false, why: 'Cones and a buffer protect the work here' };
  return { tma, arrow, vms, barrier };
}

/* ============================================================
   Crew tickets and the SWMS
   ============================================================ */
/* What each person on the job needs for this road category: TMI at or above the category for the
   supervisor, TC1 for Category 1 and TC2 for busier roads for traffic controllers, a White Card for everyone */
function crewStatus(d, s) {
  const cat = s.category.cat;
  const through = s.method === 'stopslow' || s.method === 'pts';
  return (d.people.crew || []).map((id) => {
    const p = TEAM.find((x) => x.id === id);
    if (!p) return null;
    const role = id === d.people.supervisor ? 'implement' : 'tc';
    const need = role === 'implement' ? cat : Math.min(cat, 2);
    const held = holdsFor(p, role, cat);
    const any = p.quals.filter((x) => x.role === role).sort((a2, b2) => (b2.level || 0) - (a2.level || 0));
    const q = held || any[0] || null;
    const white = p.quals.find((x) => x.role === 'induction');
    const problems = [];
    if (!q) problems.push(`No ${role === 'implement' ? 'TMI' : 'TC'} skill set`);
    else if (!held && qualState(q) === 'exp') problems.push(`${q.short} expired ${fmtDate(q.expires, { day: 'numeric', month: 'short', year: 'numeric' })}`);
    else if (!held) problems.push(`${q.short} doesn't cover Category ${cat}; this site needs ${role === 'implement' ? 'TMI' : 'TC'}${need}`);
    if (role === 'tc' && cat === 3 && through) problems.push('Controllers on a Category 3 road only where the TMP shows it is the only reasonably practicable way, with TC2 and at least 250 hours on Category 2 roads (AGTTM Part 8 s5.5.4.2)');
    if (!white) problems.push('No construction induction card');
    const label = role === 'implement' ? 'Site supervisor' : through ? 'Traffic controller' : 'Traffic management crew';
    return { p, role, label, q, need, needLabel: `${role === 'implement' ? 'TMI' : 'TC'}${need}`, ok: !problems.length, problems, firstAid: p.quals.some((x) => x.role === 'firstaid' && qualState(x) !== 'exp') };
  }).filter(Boolean);
}

/* ============================================================
   Drawing: sign faces, scheme plans, thumbnails, sample photos
   Everything is SVG built from the scheme the engine returns.
   ============================================================ */
const r1 = (n) => Math.round(n * 10) / 10;

/* ---------- Speed numbers ----------
   Overpass digits carry more ink on the left than the right, so a number anchored
   at its centre looks shifted left. INK_DX is each number's measured offset as a
   fraction of the font size; the ink's vertical centre sits 0.35 em above the baseline. */
const INK_DX = { 30: 0.0125, 40: 0.0295, 50: 0.007, 60: 0.0045, 70: 0.0245, 80: 0.0045, 90: 0.012, 100: 0.0195, 110: 0.0195 };
function speedText(v, cx, cy, fs, fill = '#111') {
  const x = cx + (INK_DX[v] || 0) * fs;
  return `<text x="${r1(x * 100) / 100}" y="${r1(cy * 100) / 100}" dy="0.35em" text-anchor="middle" font-family="Overpass, Arial Narrow, sans-serif" font-weight="900" font-size="${r1(fs * 100) / 100}" fill="${fill}">${esc(v)}</text>`;
}

/* Any short text centred by its ink rather than its font box. Overpass sits high in its line
   box and its figures have uneven side bearings, so CSS centring leaves numbers and initials
   off-centre in round badges. The canvas measures the ink once the font has loaded (the app
   redraws when it arrives); until then the default suits capitals and figures. */
const INK = {};
function inkMetrics(txt, weight = 900, family = 'Overpass') {
  const key = `${weight}|${family}|${txt}`;
  if (INK[key]) return INK[key];
  let r = { dx: 0, dy: 0.35 };
  try {
    const spec = `${weight} 100px ${family}`;
    const ready = !document.fonts || document.fonts.check(spec);
    const ctx = inkMetrics.ctx || (inkMetrics.ctx = document.createElement('canvas').getContext('2d'));
    ctx.font = spec; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const m = ctx.measureText(txt);
    if (m.actualBoundingBoxAscent != null && ready) {
      r = { dx: (m.actualBoundingBoxLeft - m.actualBoundingBoxRight) / 200, dy: (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 200 };
      INK[key] = r;
    }
  } catch (e) { /* no canvas: keep the default */ }
  return r;
}
function inkText(txt, cx, cy, fs, attrs = '', weight = 900, family = 'Overpass') {
  const m = inkMetrics(String(txt), weight, family);
  return `<text x="${(cx + m.dx * fs).toFixed(2)}" y="${(cy + m.dy * fs).toFixed(2)}" text-anchor="middle" font-family="${family}, Arial Narrow, sans-serif" font-weight="${weight}" font-size="${fs}" ${attrs}>${esc(txt)}</text>`;
}
/* A square SVG that fills its (round) container with the text dead centre */
function inkBadge(txt, fs = 0.5, cls = 'ink') {
  return `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true">${inkText(txt, 50, 50, fs * 100, 'fill="currentColor"')}</svg>`;
}

/* ---------- Sign faces (64 x 48 box) ---------- */
function signFaceSVG(code, w = 64, h = 48, cls = '') {
  const sg = SIGNS[code] || SIGNS._generic;
  if (sg.pair) return `<svg class="${cls}" viewBox="0 -8 64 48" width="${w}" height="${h}" role="img" aria-label="${esc(sg.name)}">${pairInner(sg)}</svg>`;
  return `<svg class="${cls}" viewBox="0 0 64 48" width="${w}" height="${h}" role="img" aria-label="${esc(sg.name)}">${signFaceInner(sg)}</svg>`;
}
/* One 600 x 600 panel of a multi-message sign, drawn in a 30 x 30 box at (x, y) */
function panelSVG(pn, x, y) {
  const s = 30;
  if (pn.speed) return `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="2" fill="#fff" stroke="#111" stroke-width=".8"/><circle cx="${x + 15}" cy="${y + 15}" r="12" fill="#fff" stroke="#D6211B" stroke-width="3.2"/>${speedText(pn.speed, x + 15, y + 15, pn.speed >= 100 ? 9.6 : 12)}`;
  const bg = pn.bg || '#FFD200', fg = pn.fg || '#111';
  let inner = '';
  if (pn.symbol) inner = symbolSVG(pn.symbol, x + 15, y + 15.5, fg, 0.78);
  else inner = signText(pn.lines, x + 15, y + 3, y + s - 3, fg, s - 5);
  return `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="2" fill="${bg}" stroke="#111" stroke-width=".8"/>${inner}`;
}
/* A frame holding two panels side by side, in a 64 x 32 box */
function pairInner(sg) {
  return `<rect x="0.5" y="0.5" width="63" height="31" rx="2.5" fill="#1E232A"/>${panelSVG(sg.pair[0], 1.5, 1)}${panelSVG(sg.pair[1], 32.5, 1)}`;
}
function faceMarkup(code) {
  const sg = SIGNS[code] || SIGNS._generic;
  return sg.pair ? { svg: pairInner(sg), w: 64, h: 32, wide: true } : { svg: signFaceInner(sg), w: 64, h: 48, wide: false };
}
function signText(lines, cx, top, bottom, fg, maxW) {
  const n = lines.length;
  const avail = bottom - top;
  const longest = Math.max(...lines.map((l) => l.length));
  let fs = Math.min(avail / (n * 1.08), (maxW / (longest * 0.72)));
  fs = Math.max(5.2, Math.min(fs, 13));
  const lh = fs * 1.05;
  const y0 = top + (avail - lh * n) / 2 + fs * 0.84;

/* ============================================================

   The engine gives chainages in metres along the road (0 = start of the work
   area, direction A travels towards +s) and lateral positions in metres from
   the left-hand (direction A's left) boundary. Lateral widths are exaggerated
   so every lane stays readable; distances along the road are to scale.

  const PW = compact
    ? { foot: 9, park: 11, bike: 7, lane: many ? 12 : 17, median: 8 }

      : hero ? { foot: 18, park: 22, bike: 13, lane: lots ? 22 : many ? 26 : 32, median: 12 }
        : { foot: 24, park: 28, bike: 16, lane: many ? 32 : 40, median: 18 };
