<html lang="en-AU">
<head>

<script src="config.js"></script>
</head>
<body>
<title>My TGS</title>
<meta name="description" content="My TGS: a site-to-scheme app that drafts a Traffic Guidance Scheme and hazard assessment from an on-site form, photos and GPS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700;800&family=Overpass:wght@600;700;800;900&family=Overpass+Mono:wght@500;600;700&display=swap">
<style>/* ============================================================
   Taper mockup: tokens
   Cool "kerb concrete" neutrals with hi-vis orange and signal amber.
   ============================================================ */
:root {
  color-scheme: light;
  --bg: #ECEFF2;
  --surface: #FFFFFF;
  --surface-2: #F3F5F7;
  --surface-3: #E6EAEE;
  --glass: rgba(255, 255, 255, .74);
  --glass-line: rgba(17, 24, 32, .09);
  --glass-hi: rgba(255, 255, 255, .85);
  --ink: #111820;
  --ink-2: #354050;
  --muted: #5E6A79;
  --line: #D9DFE5;
  --line-strong: #B7C0CA;
  --hv: #F05A00;
  --hv-ink: #B24100;
  --hv-soft: #FFE8D8;
  --amber: #FFB400;
  --grad: linear-gradient(135deg, #FF4E12 0%, #FF8A00 55%, #FFC400 100%);
  --grad-sm: linear-gradient(135deg, #FF5A14, #FF9800);
  --grad-text: linear-gradient(90deg, #E2470A, #F28300 60%, #D99A00);
  --glow: 255, 106, 19;
  --glow-b: 255, 190, 0;
  --glow-c: 70, 150, 255;
  --focus: #1F6FEB;
  --good: #147A45; --good-soft: #DCF3E5; --good-line: #9FD8B8;
  --warn: #8F5400; --warn-soft: #FFF0C7; --warn-line: #F0CB73;
  --bad: #C4271D; --bad-soft: #FDE3E0; --bad-line: #F2A59E;
  --info: #1F5FD1; --info-soft: #E1EAFF; --info-line: #A9C2F5;
  --risk-0: #2BB673; --risk-1: #F2C230; --risk-2: #F57C1F; --risk-3: #D9302A;
  --risk-ink-0: #0B3D22; --risk-ink-1: #3D2F00; --risk-ink-2: #3F1A00; --risk-ink-3: #FFFFFF;
  --shadow: 0 1px 2px rgba(17, 24, 32, .06), 0 12px 30px -14px rgba(17, 24, 32, .28);
  --shadow-lg: 0 24px 60px -20px rgba(17, 24, 32, .45);
  --grid-line: rgba(17, 24, 32, .035);

  /* TGS drawing */
  --d-bg: #F6F7F8;
  --d-asphalt: #3B4249;
  --d-lane-line: #FFFFFF;
  --d-edge: #E9EDF0;
  --d-kerb: #8E98A3;
  --d-foot: #D3D8DD;
  --d-nature: #B9DB9E;
  --d-ink: #111820;
  --d-dim: #5E6A79;
  --d-dimline: #7C8794;
  --d-work: #F05A00;
  --d-buffer: #FFC400;
  --d-label-bg: rgba(255, 255, 255, .92);
  --sign-yellow: #FFD200;
  --sign-ink: #111111;

  --font-display: "Overpass", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-ui: "Barlow Semi Condensed", "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Overpass Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 18px;
  --radius-sm: 12px;
  --nav-h: 66px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0A0D11; --surface: #12171D; --surface-2: #182028; --surface-3: #202933;
    --glass: rgba(21, 27, 34, .68); --glass-line: rgba(255, 255, 255, .08); --glass-hi: rgba(255, 255, 255, .05);
    --ink: #EEF2F6; --ink-2: #C3CCD6; --muted: #8E9AA8; --line: #232C35; --line-strong: #35424F;
    --hv: #FF7A29; --hv-ink: #FF9D5E; --hv-soft: #3A1E0E;
    --grad-text: linear-gradient(90deg, #FF6A2A, #FF9E2C 60%, #FFC83D);
    --good: #45D68E; --good-soft: #0F2C1E; --good-line: #1F6B45;
    --warn: #FFC260; --warn-soft: #31250C; --warn-line: #7A5A14;
    --bad: #FF7A6E; --bad-soft: #391614; --bad-line: #7F2B25;
    --info: #86B4FF; --info-soft: #13223D; --info-line: #2B4C85;
    --focus: #86B4FF;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 14px 38px -16px rgba(0, 0, 0, .85);
    --shadow-lg: 0 30px 70px -20px rgba(0, 0, 0, .9);
    --grid-line: rgba(255, 255, 255, .028);
    --d-bg: #0F1419; --d-asphalt: #2B3137; --d-edge: #C9D0D6; --d-kerb: #66717C; --d-foot: #3A424A; --d-nature: #26391D;
    --d-ink: #EEF2F6; --d-dim: #9AA6B2; --d-dimline: #7D8995; --d-label-bg: rgba(18, 23, 29, .92);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0A0D11; --surface: #12171D; --surface-2: #182028; --surface-3: #202933;
  --glass: rgba(21, 27, 34, .68); --glass-line: rgba(255, 255, 255, .08); --glass-hi: rgba(255, 255, 255, .05);
  --ink: #EEF2F6; --ink-2: #C3CCD6; --muted: #8E9AA8; --line: #232C35; --line-strong: #35424F;
  --hv: #FF7A29; --hv-ink: #FF9D5E; --hv-soft: #3A1E0E;
  --grad-text: linear-gradient(90deg, #FF6A2A, #FF9E2C 60%, #FFC83D);
  --good: #45D68E; --good-soft: #0F2C1E; --good-line: #1F6B45;
  --warn: #FFC260; --warn-soft: #31250C; --warn-line: #7A5A14;
  --bad: #FF7A6E; --bad-soft: #391614; --bad-line: #7F2B25;
  --info: #86B4FF; --info-soft: #13223D; --info-line: #2B4C85;
  --focus: #86B4FF;
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 14px 38px -16px rgba(0, 0, 0, .85);
  --shadow-lg: 0 30px 70px -20px rgba(0, 0, 0, .9);
  --grid-line: rgba(255, 255, 255, .028);
  --d-bg: #0F1419; --d-asphalt: #2B3137; --d-edge: #C9D0D6; --d-kerb: #66717C; --d-foot: #3A424A; --d-nature: #26391D;
  --d-ink: #EEF2F6; --d-dim: #9AA6B2; --d-dimline: #7D8995; --d-label-bg: rgba(18, 23, 29, .92);
}

/* ============================================================
   Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
*, *::before, *::after { background-origin: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100%;
  background-color: var(--bg);
  background-image:
    radial-gradient(42% 36% at 0% 0%, rgba(var(--glow), .20), transparent 70%),
    radial-gradient(36% 32% at 100% 4%, rgba(var(--glow-b), .15), transparent 70%),
    radial-gradient(60% 45% at 50% 108%, rgba(var(--glow-c), .10), transparent 70%),
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: auto, auto, auto, 40px 40px, 40px 40px;
  background-attachment: fixed;
  color: var(--ink);
  font: 400 16px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 800; line-height: 1.1; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-weight: 600; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }

.wrap { width: 100%; max-width: 1180px; margin-inline: auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 760px) { .wrap { padding-inline: 28px; } }

/* ============================================================
   Header and navigation
   ============================================================ */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: color-mix(in oklab, var(--bg) 78%, transparent);
  -webkit-backdrop-filter: saturate(1.3) blur(16px); backdrop-filter: saturate(1.3) blur(16px);
  border-bottom: 1px solid var(--glass-line);
}
.topbar-in { display: flex; align-items: center; gap: 14px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; appearance: none; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; }
.brand-mark { width: 27.8px; height: 48px; flex: none; }  /* viewBox 23.15 x 40, see tools/brand_ring.py */
.brand-words { display: grid; min-width: 0; }
.brand-name { font-family: var(--font-display); font-weight: 900; font-size: 23px; line-height: 1; letter-spacing: -.01em; color: var(--hv); width: fit-content; display: flex; gap: .22em; }
.brand-name .bn-my { color: var(--ink); font-weight: 700; }
.brand-mark circle { fill: var(--brand-dot); }
/* the traffic light on the ring */
.brand-mark circle.tl-r { fill: #E3262B; }
.brand-mark circle.tl-a { fill: #F5A300; }
.brand-mark circle.tl-g { fill: #1FA55B; }
.brand-co { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48vw; }
.toptabs { display: none; gap: 4px; margin-left: 18px; }
.toptab {
  appearance: none; border: 0; background: none; cursor: pointer; padding: 8px 14px; border-radius: 999px;
  color: var(--muted); font-weight: 700; font-size: 15px; letter-spacing: .02em;
}
.toptab:hover { color: var(--ink); background: var(--surface-2); }
.toptab[aria-current="page"] { color: var(--ink); background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-line); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.icon-btn {
  appearance: none; display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid var(--glass-line); background: var(--glass); color: var(--ink-2); cursor: pointer;
}
.icon-btn:hover { color: var(--ink); }
.topbar .btn-new-top { display: none; }
@media (min-width: 900px) {
  .toptabs { display: flex; }
  .topbar .btn-new-top { display: inline-flex; }
}

.botnav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end;
  padding: 4px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  background: color-mix(in oklab, var(--bg) 84%, transparent);
  -webkit-backdrop-filter: saturate(1.3) blur(16px); backdrop-filter: saturate(1.3) blur(16px);
  border-top: 1px solid var(--glass-line);
}
.bn-item {
  appearance: none; display: grid; justify-items: center; align-content: start; gap: 3px; min-height: 56px; padding: 8px 0 2px; border: 0; background: none; cursor: pointer;
  color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .01em; white-space: nowrap;
}
.bn-item .icon { width: 24px; height: 24px; }
/* every label gets room for two lines, so the icons and the first lines line up across the bar */
.bn-l { display: block; min-height: 2.3em; line-height: 1.15; text-align: center; white-space: nowrap; }
.bn-item[aria-current="page"] { color: var(--ink); }
.bn-item[aria-current="page"] .icon { color: var(--hv); }
/* the label clears the disc's outer ring by about 7px and sits on the same line as the other labels */
.bn-new { display: grid; justify-items: center; gap: 8px; appearance: none; border: 0; background: none; cursor: pointer; padding: 0 0 2px; color: var(--ink); font-size: 11.5px; font-weight: 800; white-space: nowrap; }
.bn-new-disc {
  display: grid; place-items: center; width: 60px; height: 60px; margin-top: -21px; border-radius: 50%;
  background: var(--grad); color: #fff; box-shadow: 0 10px 26px -8px rgba(var(--glow), .85), inset 0 -3px 0 rgba(0, 0, 0, .12);
  position: relative;
}
.bn-new-disc::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid color-mix(in oklab, var(--hv) 35%, transparent); }
.bn-new-disc .icon { width: 28px; height: 28px; stroke-width: 2.6; }
.bn-new[aria-current="page"] .bn-new-disc { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px rgba(var(--glow), .55); }
main { padding-block: 18px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) {
  .botnav { display: none; }
  main { padding-block: 26px 60px; }
}
body.in-wizard .botnav { display: none; }
body.in-wizard main { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }

/* ============================================================
   Buttons, chips, pills
   ============================================================ */
.btn {
  appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px;
  border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer;
  font-weight: 700; font-size: 16.5px; letter-spacing: .01em; text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--ink-2); }
.btn .icon { width: 19px; height: 19px; }
.btn-primary { border: 0; background: var(--grad); color: #fff; box-shadow: 0 10px 24px -12px rgba(var(--glow), .9), inset 0 -2px 0 rgba(0, 0, 0, .12); text-shadow: 0 1px 1px rgba(120, 40, 0, .35); }
.btn-primary:hover { filter: saturate(1.1) brightness(1.03); }
.btn-dark { border: 0; background: var(--ink); color: var(--bg); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); border-color: transparent; }
.btn-good { border: 0; background: var(--good); color: #fff; }
.btn-sm { min-height: 38px; padding: 0 14px; border-radius: 11px; font-size: 15px; }
.btn-lg { min-height: 56px; padding: 0 26px; font-size: 18px; border-radius: 16px; }
.btn-block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.pill {
  display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px; border-radius: 999px;
  font-size: 13px; font-weight: 700; letter-spacing: .03em; white-space: nowrap; border: 1px solid transparent;
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.pill-draft { background: var(--info-soft); color: var(--info); border-color: var(--info-line); }
.pill-review { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
.pill-approved { background: var(--good-soft); color: var(--good); border-color: var(--good-line); }
.pill-live { background: var(--hv-soft); color: var(--hv-ink); border-color: color-mix(in oklab, var(--hv) 45%, transparent); }
.pill-live .dot { animation: pulse 1.6s ease-in-out infinite; }
.pill-closed { background: var(--surface-3); color: var(--muted); }
.pill-plain { background: var(--surface-2); color: var(--ink-2); border-color: var(--line); }
.pill-auth { background: var(--surface); color: var(--ink-2); border-color: var(--line-strong); }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }

.speed-badge { display: block; flex: none; width: 38px; height: 38px; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, .25)); }
.speed-badge.sm { width: 30px; height: 30px; }
.speed-badge.lg { width: 58px; height: 58px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  appearance: none; display: inline-flex; align-items: center; gap: 7px; min-height: 42px; padding: 0 15px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); cursor: pointer; font-weight: 700; font-size: 15.5px;
}
.chip .icon { width: 18px; height: 18px; }
.chip:hover { border-color: var(--ink-2); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--grad-sm); border-color: transparent; color: #fff; box-shadow: 0 6px 16px -8px rgba(var(--glow), .9); }
.chip .count { font-weight: 600; opacity: .75; }
.chip-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -16px; padding-inline: 16px; }
.chip-scroll::-webkit-scrollbar { display: none; }
.chip-scroll .chip { flex: none; }

.tag {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 8px; font-size: 13px; font-weight: 700;
  background: rgba(10, 14, 18, .72); color: #fff; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.tag .icon { width: 13px; height: 13px; }
.tag-ai { background: linear-gradient(135deg, rgba(255, 78, 18, .92), rgba(255, 150, 0, .92)); }

/* ============================================================
   Panels and cards
   ============================================================ */
.panel {
  background: var(--glass); border: 1px solid var(--glass-line); border-radius: var(--radius);
  -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2);
  box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow);
}
.panel-pad { padding: 18px; }
@media (min-width: 760px) { .panel-pad { padding: 22px; } }
.eyebrow { font-size: 12.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--hv-ink); }
.label { font-size: 12px; font-weight: 800; letter-spacing: .11em; text-transform: uppercase; color: var(--muted); }
.section-title { font-size: clamp(26px, 6vw, 34px); }
.section-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 16px; margin-bottom: 14px; }
.section-head p { color: var(--muted); font-size: 15.5px; margin-top: 4px; }
.stack { display: grid; gap: 14px; }
.stack-lg { display: grid; gap: 22px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spacer { flex: 1; }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }

/* Jobs page */
.hello { display: grid; gap: 4px; margin-bottom: 16px; }
.hello h1 { font-size: clamp(30px, 8vw, 44px); }
.hello p { color: var(--muted); font-size: 16px; }
.today { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
.today-tile { appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--glass); border: 1px solid var(--glass-line); box-shadow: inset 0 1px 0 var(--glass-hi); display: grid; gap: 2px; align-content: start; transition: border-color .15s ease; }
.today-tile:hover { border-color: var(--line-strong); }
.today-tile[aria-pressed="true"] { border-color: var(--hv); box-shadow: inset 0 0 0 1px var(--hv); }
.today-tile.t-ready b { color: var(--good); }
.today-tile.t-draft b { color: var(--info); }
.today-tile b { font-family: var(--font-display); font-size: 28px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.today-tile span { font-size: 13.5px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.today-tile.t-live b { color: var(--hv); }
.today-tile.t-review b { color: var(--warn); }

.feature { overflow: hidden; margin-bottom: 22px; cursor: pointer; transition: transform .15s ease; }
.feature:hover { transform: translateY(-2px); }
.feature-art { position: relative; background: var(--d-bg); border-bottom: 1px solid var(--glass-line); }
.feature-art svg { display: block; width: 100%; height: auto; }
.feature-art .tag { position: absolute; left: 12px; top: 12px; }
.feature-body { display: grid; gap: 10px; padding: 16px 18px 18px; }
.feature-top { display: flex; align-items: flex-start; gap: 12px; }
.feature-top h2 { font-size: clamp(22px, 5.4vw, 28px); }
.feature-top .sub { color: var(--muted); font-size: 15px; margin-top: 3px; }
.feature-meta { display: flex; flex-wrap: wrap; gap: 6px; }

.jobs { display: grid; gap: 12px; }
@media (min-width: 760px) { .jobs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .jobs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.job { display: grid; grid-template-rows: auto 1fr; overflow: hidden; cursor: pointer; text-align: left; appearance: none; padding: 0; color: inherit; font: inherit; transition: transform .15s ease; }
.job:hover { transform: translateY(-2px); }
.job-art { background: var(--d-bg); border-bottom: 1px solid var(--glass-line); }

.keyfact span { font-size: 13.5px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.keyfact .src { font-size: 11.5px; font-weight: 600; color: var(--muted); }

.sched { display: grid; gap: 10px; }
.sched-group h3 { font-size: 18px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.sched-list { display: grid; gap: 8px; }
.sched-item { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.sched-item svg { width: 64px; height: 48px; display: block; }
.sched-item b { display: block; font-size: 16px; line-height: 1.2; }
.sched-item small { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.3; margin-top: 2px; }
.sched-item .code { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--hv-ink); letter-spacing: 0; }
.sched-item .dist { text-align: right; font-family: var(--font-display); font-weight: 900; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sched-item .dist small { font-family: var(--font-ui); font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 3px; }
.loadlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.load { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.load b { font-family: var(--font-display); font-weight: 900; font-size: 20px; line-height: 1; }
.load span { display: block; font-size: 13.5px; color: var(--muted); font-weight: 600; line-height: 1.2; }
.load svg { width: 34px; height: 34px; }

.checks { display: grid; gap: 8px; }
.check-item { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.check-item .ci { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; }
.check-item .ci .icon { width: 19px; height: 19px; stroke-width: 2.6; }
.check-item.pass .ci { background: var(--good-soft); color: var(--good); }
.check-item.warn .ci { background: var(--warn-soft); color: var(--warn); }
.check-item.fail .ci { background: var(--bad-soft); color: var(--bad); }
.check-item.todo .ci { background: var(--info-soft); color: var(--info); }
.check-item b { display: block; font-size: 16px; line-height: 1.25; }
.check-item p { color: var(--ink-2); font-size: 14.5px; line-height: 1.4; margin-top: 3px; }
.check-item .ref { display: inline-block; margin-top: 6px; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; color: var(--muted); }
.check-item .confirm { margin-top: 8px; }
.check-sum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.check-sum div { padding: 10px; border-radius: 12px; text-align: center; border: 1px solid var(--line); background: var(--surface); }
.check-sum b { display: block; font-family: var(--font-display); font-size: 24px; font-weight: 900; line-height: 1; }
.check-sum span { font-size: 12.5px; font-weight: 700; color: var(--muted); }
.check-sum .s-pass b { color: var(--good); }
.check-sum .s-warn b { color: var(--warn); }
.check-sum .s-todo b { color: var(--info); }
.check-sum .s-fail b { color: var(--bad); }

.risk-top { display: grid; gap: 14px; }
@media (min-width: 760px) { .risk-top { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.matrix { overflow-x: auto; }
.matrix svg { display: block; width: 100%; max-width: 440px; height: auto; }
.risk-bands { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.risk-band { padding: 8px 6px; border-radius: 10px; text-align: center; font-weight: 800; font-size: 12.5px; line-height: 1.1; }
.risk-band b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 900; }
.rb-0 { background: var(--risk-0); color: var(--risk-ink-0); }
.rb-1 { background: var(--risk-1); color: var(--risk-ink-1); }
.rb-2 { background: var(--risk-2); color: var(--risk-ink-2); }
.rb-3 { background: var(--risk-3); color: var(--risk-ink-3); }
.hazards { display: grid; gap: 10px; }
.hz { border-radius: 16px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.hz > summary { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 13px 14px; cursor: pointer; }
.hz > summary::-webkit-details-marker { display: none; }
.hz-name b { display: block; font-size: 16.5px; line-height: 1.25; }
.hz-name small { display: block; font-size: 13.5px; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.hz-risk { display: flex; align-items: center; gap: 5px; }
.rchip { display: inline-grid; place-items: center; min-width: 44px; height: 30px; padding: 0 8px; border-radius: 8px; font-family: var(--font-display); font-weight: 900; font-size: 12.5px; letter-spacing: -.01em; white-space: nowrap; }
.rchip.r0 { background: var(--risk-0); color: var(--risk-ink-0); }
.rchip.r1 { background: var(--risk-1); color: var(--risk-ink-1); }
.rchip.r2 { background: var(--risk-2); color: var(--risk-ink-2); }
.rchip.r3 { background: var(--risk-3); color: var(--risk-ink-3); }
.hz-arrow { color: var(--muted); }
.hz-arrow .icon { width: 16px; height: 16px; }
.hz-body { display: grid; gap: 10px; padding: 0 14px 14px; }
.hz-why { font-size: 14px; color: var(--ink-2); padding: 9px 11px; border-radius: 10px; background: var(--surface-2); }
.hz-why b { font-weight: 800; }
.ctl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ctl-list li { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 14.5px; line-height: 1.35; }
.ctl-lvl { display: inline-flex; justify-content: center; padding: 3px 6px; border-radius: 7px; font-size: 11.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; background: var(--surface-3); color: var(--ink-2); }
.ctl-lvl.l-eliminate { background: #1E7F4F; color: #fff; }
.ctl-lvl.l-substitute { background: #2E9A62; color: #fff; }
.ctl-lvl.l-isolate { background: #2F6FD6; color: #fff; }
.ctl-lvl.l-engineer { background: #5A61D6; color: #fff; }
.ctl-lvl.l-admin { background: #B7791F; color: #fff; }
.ctl-lvl.l-ppe { background: #7A6B5D; color: #fff; }
.hz-foot { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); font-weight: 700; }

.setup { display: grid; gap: 10px; counter-reset: s; }
.setup-phase { display: flex; align-items: center; gap: 10px; margin: 8px 0 2px; }
.setup-phase h3 { font-size: 19px; }
.setup-step {
  appearance: none; display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; text-align: left;
  border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink); width: 100%;
}
.setup-step .n { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px; background: var(--surface-2); font-family: var(--font-display); font-weight: 900; font-size: 20px; color: var(--ink-2); }
.setup-step b { display: block; font-size: 16.5px; line-height: 1.25; }
.setup-step small { display: block; font-size: 14px; color: var(--ink-2); line-height: 1.35; margin-top: 3px; }
.setup-step svg.sf { width: 54px; height: 40px; }
.setup-step.done { border-color: var(--good-line); background: color-mix(in oklab, var(--good-soft) 55%, var(--surface)); }
.setup-step.done .n { background: var(--good); color: #fff; }
.setup-step.current { border-color: var(--hv); box-shadow: 0 0 0 3px color-mix(in oklab, var(--hv) 22%, transparent); }
.setup-step.current .n { background: var(--grad); color: #fff; }
.setup-progress { display: grid; gap: 8px; }

.notes { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.notes li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 14.5px; line-height: 1.4; color: var(--ink-2); }
.notes li::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--hv); margin: 7px 0 0 6px; transform: rotate(45deg); }

.sign-off { display: grid; gap: 10px; }
.sig-pad { width: 100%; height: 150px; border-radius: 14px; border: 1.5px dashed var(--line-strong); background: var(--surface); touch-action: none; display: block; }
.stamp { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 10px; border: 2px solid var(--good); color: var(--good); font-family: var(--font-display); font-weight: 900; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; transform: rotate(-2deg); }

/* Company */
.co-grid { display: grid; gap: 16px; }
@media (min-width: 900px) { .co-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.team { display: grid; gap: 8px; }
.member { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.member b { display: block; font-size: 16px; line-height: 1.2; }
.member small { display: block; font-size: 13.5px; color: var(--muted); line-height: 1.3; }
.quals { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.qual { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 7px; font-size: 12.5px; font-weight: 700; border: 1px solid; }
.qual.ok { background: var(--good-soft); color: var(--good); border-color: var(--good-line); }
.qual.soon { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
.qual.exp { background: var(--bad-soft); color: var(--bad); border-color: var(--bad-line); }
.plan-card { position: relative; overflow: hidden; }
.plan-card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 6px; background: repeating-linear-gradient(-45deg, #FF5A14 0 14px, #FFFFFF 14px 28px); opacity: .95; }
.rulepacks { display: grid; gap: 8px; }
.rulepack { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.rulepack .st { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); font-family: var(--font-display); font-weight: 900; font-size: 13px; color: var(--ink-2); }
.rulepack.on .st { background: var(--grad); color: #fff; }
.rulepack b { display: block; font-size: 15.5px; }
.rulepack small { display: block; font-size: 13px; color: var(--muted); line-height: 1.3; }

/* Dialogs */
dialog.sheet {
  width: min(100% - 24px, 720px); max-height: calc(100% - 40px); padding: 0; border: 1px solid var(--glass-line); border-radius: 22px;
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow-lg);
}
dialog.sheet.wide { width: min(100% - 24px, 1240px); }
dialog.sheet::backdrop { background: rgba(6, 9, 12, .55); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
.sheet-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 20px; margin-right: auto; }
.sheet-body { padding: 16px; display: grid; gap: 14px; }
.a3-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); background: #D9DDE1; padding: 14px; }
.a3 { width: 100%; height: auto; display: block; background: #fff; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .35); }
.a3-wrap.zoom .a3 { width: 1190px; max-width: none; }
.a3-wrap { padding: 10px; }

.toast {
  position: fixed; left: 16px; right: 16px; margin-inline: auto; width: fit-content; bottom: calc(var(--nav-h) + 26px + env(safe-area-inset-bottom, 0px)); z-index: 120; transform: translateY(16px);
  display: flex; align-items: center; gap: 10px; max-width: 560px; padding: 12px 16px; border-radius: 14px;
  background: var(--ink); color: var(--bg); font-weight: 700; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast .icon { color: var(--good); }
@media (min-width: 900px) { .toast { bottom: 30px; } }

.demo-note { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; margin-top: 26px; border-radius: 14px; border: 1px dashed var(--line-strong); color: var(--muted); font-size: 14px; line-height: 1.4; }
.demo-note .icon { flex: none; margin-top: 1px; }

/* Diagram SVG text */
.dg text { font-family: var(--font-ui); }
.dg .t-code { font-family: var(--font-mono); font-weight: 700; }
.dg .t-dist { font-family: var(--font-display); font-weight: 900; }
.dg .hl { animation: hl 1.2s ease-in-out infinite; }
@keyframes hl { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

/* Cone panel on the gear tab */
.cone-panel h3 { font-size: 20px; }
.cone-total { font-size: 15px; color: var(--muted); font-weight: 700; }
.cone-total b { font-family: var(--font-display); font-size: 20px; font-weight: 900; color: var(--hv-ink); }
.cone-rows { display: grid; gap: 10px; }
.cone-row { display: grid; gap: 6px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.cr-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.cr-top b { font-size: 16px; }
.cr-top span { font-size: 13.5px; color: var(--muted); font-weight: 700; }
.cr-strip { overflow-x: auto; }
.cr-nums { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--ink-2); }
.cr-nums b { font-family: var(--font-display); font-weight: 900; font-size: 18px; color: var(--ink); }

/* Set-out map: where the next item goes */
.setup-map { display: grid; gap: 6px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--d-bg); }
.setup-map svg { display: block; width: 100%; height: auto; }
.setup-map-cap { display: flex; align-items: baseline; gap: 8px; padding: 9px 12px 0; }
.setup-map-cap b { font-size: 15px; }
.dg .pulse { transform-box: fill-box; transform-origin: center; animation: ping 1.3s ease-out infinite; }
@keyframes ping { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }

/* Hazard screen additions */
.risk-band { padding: 8px 4px; }
.risk-band b { font-size: 20px; }
.site-rating { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
.site-rating .big { display: grid; place-items: center; min-width: 86px; height: 58px; padding: 0 12px; border-radius: 14px; font-family: var(--font-display); font-weight: 900; font-size: 20px; }
.site-rating.r-High .big { background: var(--risk-2); color: var(--risk-ink-2); }
.site-rating.r-Medium .big { background: var(--risk-1); color: var(--risk-ink-1); }
.site-rating.r-Low .big { background: var(--risk-0); color: var(--risk-ink-0); }
.site-rating p { font-size: 14.5px; color: var(--ink-2); line-height: 1.4; }
.options { display: grid; gap: 8px; }
.option { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: start; padding: 11px 13px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.option .lvl { display: inline-flex; justify-content: center; padding: 5px 8px; border-radius: 9px; font-weight: 800; font-size: 13px; background: var(--surface-3); color: var(--ink-2); }
.option.chosen { border-color: var(--good-line); background: color-mix(in oklab, var(--good-soft) 50%, var(--surface)); }
.option.chosen .lvl { background: var(--good); color: #fff; }
.option b { display: block; font-size: 15.5px; line-height: 1.25; }
.option small { display: block; font-size: 14px; color: var(--ink-2); line-height: 1.35; margin-top: 3px; }
.ctl-cols { display: grid; gap: 8px; }
@media (min-width: 760px) { .ctl-cols { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.ctl-col { display: grid; gap: 6px; align-content: start; padding: 10px 11px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.ctl-col h5 { margin: 0; font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ctl-col ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.ctl-col li { font-size: 14px; line-height: 1.35; }
.ctl-col .none { font-size: 13.5px; color: var(--muted); font-style: italic; }
.treat { font-size: 13.5px; font-weight: 700; padding: 8px 10px; border-radius: 10px; }
.treat.t-1 { background: color-mix(in oklab, var(--risk-1) 26%, var(--surface)); color: var(--ink); }
.ctl-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.ctl-list li { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 9px; align-items: start; font-size: 14.5px; line-height: 1.38; }
.code { display: inline-grid; place-items: center; height: 22px; border-radius: 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .02em; color: #fff; margin-top: 1px; }
.code.c-eliminate { background: #0B6E4F; } .code.c-substitute { background: #2E8B57; } .code.c-isolate { background: #0E7490; }
.code.c-engineer { background: #1F5FBF; } .code.c-admin { background: #8F5400; } .code.c-ppe { background: #5E6A79; }
.band-acts { display: grid; gap: 6px; }
.band-act { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 10px; align-items: center; }
.band-act .rchip { width: 100%; }
.band-act b { display: block; font-size: 13.5px; line-height: 1.3; font-weight: 700; }
.band-act small { display: block; font-size: 12.5px; color: var(--muted); }
.treat.t-3 { background: color-mix(in oklab, var(--risk-3) 22%, var(--surface)); color: var(--ink); }
.treat.t-2 { background: color-mix(in oklab, var(--risk-2) 22%, var(--surface)); color: var(--ink); }
.always { display: inline-flex; margin-left: 6px; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: .04em; background: var(--surface-3); color: var(--muted); vertical-align: 2px; }

/* ---------- Form steps: done (tick), still to fill in (orange ?), not started (number) ---------- */
:root { --todo: #FF9A1F; --todo-ink: #2A1500; --todo-text: #7A3E00; --todo-soft: #FFF1DE; --todo-line: #F5B45C; --map-lot: #E4E8EC; --map-house: #C9D0D7; --brand-dot: #5A626B; }
:root[data-theme="dark"] { --todo-text: #FFC27A; --todo-soft: #3A2508; --todo-line: #8A5A14; --map-lot: #1C232A; --map-house: #2C353E; --brand-dot: #8A939E; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --todo-text: #FFC27A; --todo-soft: #3A2508; --todo-line: #8A5A14; --map-lot: #1C232A; --map-house: #2C353E; --brand-dot: #8A939E; } }
.step b { overflow: hidden; }
.step b .ink { display: block; width: 100%; height: 100%; }
.step b .icon.sm { width: 16px; height: 16px; stroke-width: 3.2; }
.step.st-done b { background: var(--good); color: #fff; }
.step.st-todo b { background: var(--todo); color: var(--todo-ink); }
.step.st-todo { border-color: var(--todo-line); }
.step[aria-current="step"].st-done b { background: var(--good); color: #fff; box-shadow: 0 0 0 2px var(--bg); }
.step[aria-current="step"].st-todo b { background: var(--todo); color: var(--todo-ink); box-shadow: 0 0 0 2px var(--bg); }
.btn-todo { border: 0; background: var(--todo); color: var(--todo-ink); }
.need { display: inline-flex; align-items: center; margin-left: 8px; padding: 1px 8px; border-radius: 99px; font-family: var(--font-ui); font-size: 11.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; background: var(--todo-soft); color: var(--todo-ink); border: 1px solid var(--todo-line); vertical-align: 2px; }
:root[data-theme="dark"] .need, :root[data-theme="dark"] .need-tag { color: var(--todo); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .need, :root:not([data-theme="light"]) .need-tag { color: var(--todo); } }
.field:has(.in[data-req]:not(:placeholder-shown)) .need { display: none; }
.show-missing .in[data-req]:placeholder-shown { border-color: var(--todo); box-shadow: 0 0 0 3px color-mix(in oklab, var(--todo) 28%, transparent); }
.show-missing .shot.needed { border-color: var(--todo); }
.need-inline { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-weight: 700; }
.need-inline .icon { width: 18px; height: 18px; padding: 2px; border-radius: 50%; background: var(--todo); color: var(--todo-ink); stroke-width: 3; }
.xsec.unset .xsec-svg { outline: 2px dashed var(--todo-line); outline-offset: 3px; }
.shot-title { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.need-tag, .opt-tag { display: inline-flex; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.need-tag { background: var(--todo-soft); color: var(--todo-ink); border: 1px solid var(--todo-line); }
.opt-tag { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.todo-box { display: grid; gap: 10px; padding: 14px 16px; border-radius: 14px; background: var(--todo-soft); border: 1.5px solid var(--todo-line); }
.todo-box > b { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.todo-box > b .icon { width: 22px; height: 22px; padding: 3px; border-radius: 50%; background: var(--todo); color: var(--todo-ink); stroke-width: 3; flex: none; }
.todo-box ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.todo-box li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; font-size: 14.5px; line-height: 1.35; }
.todo-box li .link-btn { justify-self: start; font-weight: 800; }
.todo-box.flash { animation: flash 1s ease 2; }
@keyframes flash { 50% { box-shadow: 0 0 0 6px color-mix(in oklab, var(--todo) 45%, transparent); } }
.done-box { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--good-soft); border: 1px solid var(--good-line); font-size: 15px; }
.done-box > .icon { width: 26px; height: 26px; padding: 4px; border-radius: 50%; background: var(--good); color: #fff; stroke-width: 3; flex: none; }
.doc-todo { display: inline-flex; padding: 1px 8px; border-radius: 6px; background: var(--todo-soft); color: var(--todo-text); border: 1px solid var(--todo-line); font-weight: 700; font-size: .92em; }
.doc-todo-pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 6px; border-radius: 999px; background: var(--todo-soft); color: var(--todo-text); border: 1px solid var(--todo-line); font-weight: 800; font-size: 13px; }
.doc-todo-pill .icon { width: 15px; height: 15px; padding: 2px; border-radius: 50%; background: var(--todo); color: var(--todo-ink); stroke-width: 3; }

/* round badges hold an SVG so the text is centred by its ink */
.avatar { overflow: hidden; }
.avatar .ink { display: block; width: 100%; height: 100%; }
.setup-step .n .ink { display: block; width: 100%; height: 100%; }
.setup-step .n .icon { width: 22px; height: 22px; stroke-width: 3; }
.seg button .n .icon { width: 13px; height: 13px; stroke-width: 3.4; }

/* ---------- Location: address search and the work-area pin ---------- */
.or { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; color: var(--muted); font-weight: 800; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.or::before, .or::after { content: ""; height: 1px; background: var(--line); }
.search-in { position: relative; }
.search-in > .icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search-in .in { padding-left: 42px; }
.addr-results { display: grid; gap: 6px; }
.addr-hit { appearance: none; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: center; padding: 11px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: inherit; font: inherit; text-align: left; cursor: pointer; }
.addr-hit:hover { border-color: var(--hv); }
.addr-hit > .icon { width: 20px; height: 20px; color: var(--hv); }
.addr-hit b { display: block; font-size: 16px; line-height: 1.2; }
.addr-hit small { display: block; font-size: 13px; color: var(--muted); line-height: 1.3; margin-top: 2px; }
.addr-try { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.addr-try > span { width: 100%; font-size: 12.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.addr-try .chip .icon { width: 15px; height: 15px; color: var(--hv); }
.addr-none { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ink-2); padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.addr-none .icon { width: 18px; height: 18px; flex: none; color: var(--info); margin-top: 1px; }
.gps-map svg { cursor: crosshair; }
.map-pin { position: absolute; width: 38px; height: 50px; padding: 0; margin: 0; border: 0; background: none; transform: translate(-50%, -96%); touch-action: none; cursor: grab; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .35)); transition: transform .12s ease; z-index: 2; }
.map-pin svg { display: block; width: 100%; height: 100%; cursor: inherit; }
.map-pin.drag { cursor: grabbing; transform: translate(-50%, -104%) scale(1.12); transition: none; }
.map-pin.ask svg path { animation: pinpulse 1.6s ease-in-out infinite; }
@keyframes pinpulse { 50% { fill: #FF8A3D; } }
.map-pin:focus-visible { outline: 3px solid var(--hv); outline-offset: 2px; border-radius: 8px; }
/* live street map (real tiles) */
.gps-map.live { background: #F2EFE9; }
.live-map { position: relative; height: clamp(250px, 64vw, 340px); overflow: hidden; cursor: crosshair; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.lm-tiles { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.lm-tiles .tile { position: absolute; width: 256px; height: 256px; max-width: none; pointer-events: none; -webkit-user-drag: none; }
.lm-addr { position: absolute; display: grid; place-items: center; width: 26px; height: 26px; transform: translate(-50%, -50%); border-radius: 50%; background: #1B2330; color: #fff; box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0, 0, 0, .35); z-index: 1; pointer-events: none; }
.lm-addr .icon { width: 15px; height: 15px; }
.lm-line { position: absolute; height: 0; border-top: 2.5px dashed #1B2330; transform-origin: 0 50%; z-index: 1; pointer-events: none; }
.lm-zoom { position: absolute; right: 10px; top: 10px; display: grid; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0, 0, 0, .3); z-index: 3; }
.lm-zoom button { appearance: none; width: 42px; height: 42px; border: 0; background: #fff; color: #1B2330; font: 800 24px/1 var(--font-ui); cursor: pointer; }
.lm-zoom button + button { border-top: 1px solid #D6DAE0; }
.lm-zoom button:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
.lm-attrib { position: absolute; right: 0; bottom: 0; padding: 2px 6px; font-size: 10.5px; line-height: 1.4; background: rgba(255, 255, 255, .82); border-top-left-radius: 6px; z-index: 3; }
.lm-attrib a { color: #333; text-decoration: none; }
.gps-map.live .tag { left: 10px; top: 10px; right: auto; bottom: auto; z-index: 3; }
.addr-wait { display: flex; align-items: center; gap: 10px; margin: 0; padding: 10px 12px; font-size: 14.5px; color: var(--ink-2); }
.spinner.sm { width: 18px; height: 18px; border-width: 2.5px; }
.state-note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 14px; background: var(--todo-soft); border: 1.5px solid var(--todo-line); font-size: 14.5px; line-height: 1.4; }

.pin-bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); }

.pin-bar .pb-ico { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; }
.pin-bar .pb-ico .icon { width: 18px; height: 18px; stroke-width: 2.6; }

@media (max-width: 460px) { .pin-bar { grid-template-columns: auto minmax(0, 1fr); } .pin-bar .btn { grid-column: 1 / -1; justify-self: stretch; } }

/* ---------- Crew picker ---------- */

.crew-pick .pick-tick { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-strong); }

.role-tag { display: inline-flex; margin-left: 4px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; background: var(--hv-soft); color: var(--hv-ink); vertical-align: 2px; }

/* ---------- Header: Company moves to an icon on phones ---------- */

.crew-row b { display: block; font-size: 16px; line-height: 1.2; }

.crew-row small.why-bad { color: var(--bad); font-weight: 700; }
.crew-row.bad { border-color: var(--bad-line); background: color-mix(in oklab, var(--bad-soft) 45%, var(--surface)); }
.crew-act { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
.signed { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; color: var(--good); }

@media (max-width: 520px) { .crew-row { grid-template-columns: 44px minmax(0, 1fr); } .crew-act { grid-column: 1 / -1; justify-content: flex-start; } }
.tchips { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 99px; font-size: 14px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); }
.tchip .icon { width: 15px; height: 15px; stroke-width: 3; }
.tchip.on .icon { color: var(--good); }
.tchip.ask { background: var(--todo-soft); border-color: var(--todo-line); }
.tchip.ask .icon { color: var(--todo-ink); }
.emerg { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 8px; }
.emerg > div { display: grid; gap: 3px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.emerg .label { font-size: 11px; }
.emerg b { font-size: 16px; line-height: 1.2; }

.emerg > div:first-child { background: var(--bad-soft); border-color: var(--bad-line); }

.task-group { display: grid; gap: 6px; }
.task-group h4 { margin: 6px 0 2px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.task { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.task > summary { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; }
.task > summary::-webkit-details-marker { display: none; }

.changes { display: grid; gap: 8px; }
.change { display: grid; gap: 3px; padding: 10px 12px; border-radius: 12px; border-left: 4px solid var(--todo); background: var(--surface-2); }

.ticket-mini { display: flex; flex-wrap: wrap; gap: 6px; }
.ticket-mini span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13.5px; font-weight: 700; }
.ticket-mini .icon { width: 16px; height: 16px; color: var(--hv); }
.qr-big { display: grid; place-items: center; padding: 14px; border-radius: 16px; background: #fff; }
.qr-big svg { width: min(100%, 260px); height: auto; display: block; }
.qr-none { display: grid; place-items: center; gap: 6px; width: 200px; height: 200px; color: #5E6A79; font-weight: 800; border: 2px dashed #C9D0D7; border-radius: 12px; }

.dalert { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border-radius: 12px; background: var(--todo-soft); border: 1px solid var(--todo-line); }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dalert .icon { color: var(--todo); } }

.doc-logo .icon { width: 22px; height: 22px; color: #F05A00; }

.doc-h { font-family: var(--font-display); font-size: 22px; font-weight: 900; margin: 10px 0 2px; color: #111; }
.dlead { margin: 0; font-size: 13px; font-style: italic; color: #3A4552; padding: 8px 10px; border-left: 3px solid #C9D0D7; background: #F6F7F8; }
.dh1 { margin: 14px 0 2px; font-family: var(--font-display); font-size: 16.5px; font-weight: 900; color: #fff; background: #1D2733; padding: 6px 10px; border-radius: 4px; }

.dp { margin: 0; color: #1D2733; }

.dfill-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #1F5FBF; }

.doc-page .doc-todo { background: #FFF1DE; color: #7A3E00; border-color: #F5B45C; }

.doc-page .dalert p { color: #3D2400; font-size: 13px; }
.dtable-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

const ATP = 'Approved Training Provider (Statement of Attainment)';
const SKILL = {
  TC1: ['tc', 1, 'Traffic Controller, Urban Streets and Low Volume Rural Roads', 'RIISS00058'],

const workTypes = (d) => (d.work.types?.length ? d.work.types : d.work.type ? [d.work.type] : []);
const hasType = (d, ...ids) => workTypes(d).some((t) => ids.includes(t));
const workTypeName = (t) => (String(t).startsWith('own:') ? String(t).slice(4) : WORK_TYPES[t] || 'Works');
const andList = (xs) => (xs.length > 1 ? `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}` : xs[0] || '');
const workTypesName = (d) => andList(workTypes(d).map(workTypeName)) || 'Works';
const layoutName = (l) => ({ '2L2W': 'Two-way, one lane each way', '4L2W': 'Two-way, two lanes each way', DIV: 'Divided road', '1W': 'One-way street' }[l]);

/* ---------- Which way is inbound ----------
   Crews name the two directions inbound (towards the city) and outbound (away from it). The city is the state's
   capital; the compass heading of each direction is kept for the drawing's north arrow and shown as a hint. The
   crew can swap the two where the capital isn't the right reference (a regional town, a road across the city). */
const CITY = { VIC: [-37.8136, 144.9631], NSW: [-33.8688, 151.2093], QLD: [-27.4698, 153.0251], WA: [-31.9523, 115.8613], SA: [-34.9285, 138.6007], TAS: [-42.8821, 147.3272], ACT: [-35.2809, 149.13], NT: [-12.4634, 130.8456] };
const HEADING = { northbound: 0, eastbound: 90, southbound: 180, westbound: 270 };
const TOWARD = { inbound: 'towards the city', outbound: 'away from the city' };
const CITY_NAME = { VIC: 'Melbourne', NSW: 'Sydney', QLD: 'Brisbane', WA: 'Perth', SA: 'Adelaide', TAS: 'Hobart', ACT: 'Canberra', NT: 'Darwin' };
/* DTP's Temporary Traffic Management Road Category Map (the TTM categories DTP assigns under AGTTM Part 8; research/08).
   Its terms ask for DTP's written permission before linking to it from a product, so this link is for the mockup. */
const CAT_MAP = 'https://experience.arcgis.com/experience/2ba210aa8cdc4319aabe3595bf4e6610';
function bearingTo(lat1, lng1, lat2, lng2) {
  const r = Math.PI / 180, y = Math.sin((lng2 - lng1) * r) * Math.cos(lat2 * r);
  const x = Math.cos(lat1 * r) * Math.sin(lat2 * r) - Math.sin(lat1 * r) * Math.cos(lat2 * r) * Math.cos((lng2 - lng1) * r);
  return (Math.atan2(y, x) / r + 360) % 360;
}
function setTravelNames(site) {
  if (HEADING[site.dirA] !== undefined && !site.headA) { site.headA = site.dirA; site.headB = site.dirB; } // saved before inbound and outbound
  if (!HEADING.hasOwnProperty(site.headA)) { site.headA = 'northbound'; site.headB = 'southbound'; }
  const [clat, clng] = CITY[site.state] || CITY.VIC;
  const toCity = bearingTo(site.lat, site.lng, clat, clng);
  const aIn = Math.cos(((HEADING[site.headA] - toCity) * Math.PI) / 180) >= 0;
  const inA = site.swapDirs ? !aIn : aIn;
  site.dirA = inA ? 'inbound' : 'outbound'; site.dirB = inA ? 'outbound' : 'inbound';
  return site;
}
const headingWord = (h) => ({ northbound: 'north', southbound: 'south', eastbound: 'east', westbound: 'west' }[h] || '');

/* Dates as YYYY-MM-DD in local time (toISOString would give yesterday's date before 10 am in Melbourne) */
const localISO = (dt = new Date()) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
function isoDay(offset) { const d = new Date(); d.setDate(d.getDate() + offset); return localISO(d); }

/* number and confidence code for a speed-keyed table */
function ruleAt(table, speed) {
  const keys = Object.keys(table).map(Number).sort((a, b) => a - b);
  const k = keys.find((x) => x >= speed) ?? keys[keys.length - 1];
  const v = table[k];
  return Array.isArray(v) ? { v: v[0], c: v[1] } : { v, c: 'A' };
}

function speedSteps(from, to) {
  if (!to || to >= from) return [];
  return RULES.steps[`${from}-${to}`] || [to];
}
function shuttleMax(vph) {
  const row = RULES.shuttle.find(([lim]) => vph <= lim);
  return row ? row[1] : null;
}

  sev: [
    ['A', 'Catastrophic', 'Fatality, or multiple fatalities'],
    ['B', 'Major', 'Permanent loss of body function, amputation or hospitalisation'],
    ['C', 'Moderate', 'Significant injury resulting in greater than 1 day from work, including stress'],
    ['D', 'Minor', 'Medical treatment, not hospitalised and less than one shift away from work'],
    ['E', 'Insignificant', 'First aid or insignificant injury only'],
  ],
  lik: ['Almost certain', 'Very likely', 'Possible', 'Unlikely', 'Rare'],
  bands: ['Low', 'Medium', 'High', 'Extreme'],
  // GRID[severity A..E][likelihood 1..5] = band 0..3
  GRID: [
    [3, 3, 2, 2, 2],
    [3, 2, 2, 2, 1],
    [2, 2, 2, 1, 1],
    [2, 1, 1, 1, 0],
    [1, 1, 0, 0, 0],
  ],
  // what each band means: who acts, what they do, how it's communicated
  action: [
    ['Workers', 'Worker to adhere to WHS methods in SWMS and monitoring by supervisor', 'Toolbox / pre-start briefing'],
    ['Site supervisor', 'Job may continue under constant site supervision and regular monitoring', 'Toolbox / pre-start briefing'],
    ['Project manager', 'Manager authorisation required for work to proceed', 'Site safety meeting and toolbox'],
    ['All', 'Shut down the job until a process is in place to lower the risk score', 'Site safety meeting and toolbox'],
  ],
  note: 'Your company matrix, from the Hazard & Risk Assessment template. Ratings are drafted by My TGS for the designer to check.',
};
const riskSev = (C) => RISK.sev[5 - C][0];
const riskLik = (L) => 6 - L;
const riskCode = (L, C) => riskSev(C) + riskLik(L);
function riskBand(L, C) { return RISK.GRID[5 - C][5 - L]; }
/* The six control codes used in the company's SWMS and risk register, most effective first */
const LEVELS = { eliminate: 'Elimination', substitute: 'Substitution', isolate: 'Isolation', engineer: 'Engineering', admin: 'Administrative', ppe: 'PPE' };
const CODES = { eliminate: 'ELIM', substitute: 'SUB', isolate: 'ISOL', engineer: 'ENG', admin: 'ADM', ppe: 'PPE' };
const HIER6 = [
  ['eliminate', 'Remove the hazard entirely: close the road, divert traffic, work off-road.'],
  ['substitute', 'Replace with something less hazardous: safety barriers instead of cones, off-peak works.'],
  ['isolate', 'Separate people from the hazard: barriers, exclusion zones, protected work areas.'],
  ['engineer', 'Change the physical arrangement: TMA, delineation, speed reduction, lighting, VMS.'],
  ['admin', 'Change the way people work: procedures, briefings, monitoring, licences, signage.'],
  ['ppe', 'Last line only: high-visibility clothing, hard hat, boots, hearing and sun protection.'],

const LVL_ORDER = Object.keys(CODES);
// AGTTM Part 2: controls are considered from the top down, and a reason is recorded when a higher one is not practicable
const HIER = [
  { key: 'elim', name: 'Eliminate or substitute', lv: ['eliminate', 'substitute'] },
  { key: 'iso', name: 'Isolate or engineer', lv: ['isolate', 'engineer'] },

];

/* Part 10 Figure 2.3 site risk rating for planning: speed x TTM category x closest worker to traffic */
function siteRiskRating(v, cat, gap) {
  const c2 = cat >= 2;
  if (gap === '9+') return 'Low';
  if (gap === '6-9') return v <= 70 ? 'Low' : v <= 90 ? (c2 ? 'Medium' : 'Low') : 'Medium';
  if (gap === '3-6') return v <= 50 ? 'Low' : v <= 70 ? (c2 ? 'Medium' : 'Low') : v <= 90 ? (c2 ? 'High' : 'Medium') : 'High';
  if (gap === '1.2-3') return v <= 40 ? 'Low' : v <= 50 ? (c2 ? 'Medium' : 'Low') : v <= 70 ? (c2 ? 'High' : 'Medium') : 'High';
  return v <= 40 ? 'Medium' : v <= 50 ? (c2 ? 'High' : 'Medium') : 'High';
}
