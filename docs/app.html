}
function initLiveMap() {
  const map = $('#liveMap'), pin = $('#mapPin');
  if (!map || !pin || !state.draft) return;
  const d = state.draft, s = d.site, z = +map.dataset.z;
  const [cx, cy] = lngLatToPx(s.viewLng ?? s.addrLng, s.viewLat ?? s.addrLat, z);
  // tiles blocked (the published artifact) or offline: fall back to the sketch map
  const centre = map.querySelector('img.tile.centre');
  const failed = () => { if (!state.tilesFailed) { state.tilesFailed = true; s.pinA = 0; s.pinC = null; setPinLatLng(d); repaintLocation(); } };
  if (centre) { centre.addEventListener('error', failed); if (centre.complete && centre.naturalWidth === 0 && centre.src) setTimeout(() => { if (centre.naturalWidth === 0) failed(); }, 50); }
  const line = $('#pinLine');
  const drawLine = () => {
    if (!line || s.via === 'gps') { if (line) line.style.display = 'none'; return; }
    const [ax, ay] = lngLatToPx(s.addrLng, s.addrLat, z), [px, py] = lngLatToPx(s.pinLng, s.pinLat, z);
    const len = Math.hypot(px - ax, py - ay);
    line.style.display = len < 6 ? 'none' : 'block';

    const dy = Math.max(-(r.height / 2 - 52), Math.min(r.height / 2 - 6, clientY - (r.top + r.height / 2)));
    const [lng, lat] = pxToLngLat(cx + dx, cy + dy, z);

  pin.addEventListener('pointerup', (e) => { if (!drag) return; drag = false; pin.classList.remove('drag'); commit(place(e.clientX, e.clientY)); });

    const k = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];

    s.pinOk = true; s.pinMoved = true; refreshSteps();
  });

}

    if (j.input && !j.input.uid) j.input.uid = 'j' + String(j.id || Date.now().toString(36));
    if (j.setup && Object.keys(j.setup).some((k) => /^[ir]\d+$/.test(k))) try {
      const so = buildScheme(j.input, j).setout, fresh = ['ts-start', 'moa', 'moa-off', 'ts-end'];
      const oldI = so.install.filter((st) => !fresh.includes(st.key)), oldR = so.remove.filter((st) => !fresh.includes(st.key));
      const next = {};
      Object.entries(j.setup).forEach(([k, on]) => {
        if (!on) return;
        const m = k.match(/^([ir])(\d+)$/); if (!m) { next[k] = on; return; }
        const st = (m[1] === 'i' ? oldI : oldR)[+m[2]]; if (st) next[`${m[1]}:${st.key}`] = true;
      });
      if (['live', 'closed'].includes(j.status)) { next['i:ts-start'] = true; next['i:moa'] = true; }
      if (j.status === 'closed') so.remove.forEach((st) => { next['r:' + st.key] = true; });
      j.setup = next;
    } catch (e) { j.setup = {}; }
  });
  if (saved?.company) state.company = saved.company;
  if (saved?.theme) state.theme = saved.theme;
  if (saved?.prefs) state.prefs = { ...state.prefs, ...saved.prefs };
  if (!STORAGE[state.prefs.storage]) state.prefs.storage = 'onedrive'; // Google Drive was an option before Dropbox replaced it
  state.ts = saved?.ts || seedTimesheets(state.jobs);
  // tickets added in the demo go back into each person's wallet
  state.tickets = saved?.tickets || {};
  Object.entries(state.tickets).forEach(([pid, qs]) => { const p = TEAM.find((x) => x.id === pid); if (p) qs.forEach((q) => { if (!p.quals.some((x) => x.short === q.short && x.number === q.number)) p.quals.push(q); }); });
}

/* In the phone-frame preview claude.ai puts the viewer's light or dark choice on the page around the app */
function frameTheme() {
  try { return window.parent !== window ? window.parent.document.documentElement.getAttribute('data-theme') : null; } catch (e) { return null; }
}
function applyTheme() {
  const root = document.documentElement;
  const theme = state.theme === 'auto' ? frameTheme() : state.theme;
  if (theme === 'light' || theme === 'dark') root.setAttribute('data-theme', theme); else root.removeAttribute('data-theme');
  $('#themeBtn').setAttribute('aria-label', `Theme: ${state.theme === 'auto' ? 'matches your phone' : state.theme}. Tap to change.`);
}
function cycleTheme() {
  const order = ['auto', 'light', 'dark'];
  state.theme = order[(order.indexOf(state.theme) + 1) % order.length];
  applyTheme(); save();
  toast(state.theme === 'auto' ? 'Theme follows your phone' : state.theme === 'light' ? 'Light theme (best in bright sun)' : 'Dark theme');

function go(view, opts = {}) {

const STEPS = [

  { key: 'photos', name: 'Photos', title: 'Show us the site', blurb: 'Photos from both directions are kept with the job as the record of the site, for the office and for whoever approves the TGS.' },
  { key: 'road', name: 'Road', title: 'Check the road', blurb: 'Tick what you can see on site. Anything marked FROM MAP came from the address lookup: check it.' },

    state.revisit = !!d.seen[state.step]; state.lastStep = state.step; state.lastDraft = d;

/* What each step still needs. A step only goes green when nothing is missing. A step you've
   been to (or skipped past) with something missing shows an orange "?", and the TGS can't
   be drafted until every step is green. Pages My TGS fills in for you (Road, Traffic) count
   once you've opened them and checked them. */
function stepMissing(d, i) {
  const miss = [];
  const seen = d.seen || {};
  if (i === 0) {
    if (!d.site.located) miss.push('Set the location: use your phone\'s location or search the address');
    else if (d.site.via === 'address' && !d.site.pinOk) miss.push('Put the pin on the work area');
    if (!String(d.client || '').trim()) miss.push('Who the work is for');
    if (!String(d.desc || '').trim()) miss.push('What the work is');
    if (!d.work.date) miss.push('The date');
    if (!d.work.start || !d.work.end) miss.push('Start and finish times');
    else if (d.work.end <= d.work.start && !d.work.night && !d.work.multiDay) miss.push('A finish time after the start');
    if (d.road.privateProp && !String(d.road.privateAuth || '').trim()) miss.push('Who the authority is for the private road (on the Road page)');
  } else if (i === 1) {
    photoSlots(d).filter((sl) => sl.need && !d.media.photos[sl.key]).forEach((sl) => miss.push(`Photo: ${sl.title.toLowerCase()}`));
  } else if (i === 2) {
    if (!seen[2]) miss.push('Open the page and check the road details');
  } else if (i === 3) {
    const blocked = workBlocked(d);
    if (!workTypes(d).length) miss.push('The type of work');
    if (!selectedIds(d).length) miss.push('Where the work is on the road');
    else if (blocked?.both) miss.push('The work takes both lanes, which closes the road. Leave a lane open');
    else if (blocked?.dir) miss.push('The work takes every lane in one direction. Leave a lane open for that traffic');
    if (!d.work.workers) miss.push('How many workers');
  } else if (i === 4) {
    if (!selectedIds(d).length) miss.push('Where the work is (on the Work page) so My TGS can suggest a method');
    else if (workBlocked(d)) miss.push('A work area that leaves traffic a way past (on the Work page)');
    else if (!seen[4]) miss.push('Open the page and check the traffic control method');
  } else if (i === 5) {
    if (!seen[5] && state.step !== 5) miss.push('Check the details and choose who approves it');
    else if (selectedIds(d).length && d.site.located) {
      const cat = ttmCategory(d).cat;
      if (!holdsFor(TEAM.find((x) => x.id === d.people.designer), 'design', cat)) miss.push(`Someone holding a current TMD${cat} to approve it`);
    }
  }
  return miss;
}
function stepState(d, i) {
  if (!stepMissing(d, i).length) return 'done';
  return (d.seen || {})[i] || i < state.step ? 'todo' : 'new';
}
function stepChips(d) {
  return STEPS.map((s, i) => {
    const cur = i === state.step;
    // the page you're on shows its number until it's complete; pages you've left show a tick or an orange ?
    const st = stepState(d, i) === 'done' ? 'done' : cur ? 'new' : stepState(d, i);
    const mark = st === 'done' ? ic('check', 'icon sm') : st === 'todo' ? ic('question', 'icon sm') : inkBadge(i + 1, 0.54);
    return `<button class="step st-${st}" type="button" data-step="${i}" ${cur ? 'aria-current="step"' : ''} aria-label="${esc(s.name)}: ${st === 'done' ? 'done' : st === 'todo' ? 'something still to fill in' : 'not started'}"><b>${mark}</b>${s.name}</button>`;
  }).join('');
}

    const tag = `<span class="tag">${ic(s.via === 'address' ? 'search' : 'gps')}${s.via === 'address' ? 'From the address' : `GPS ±${s.acc} m`}</span>`;
    let mapHTML;

        <button class="map-pin ${ask ? 'ask' : ''}" id="mapPin" type="button" style="left:${(px / MAP.W * 100).toFixed(2)}%;top:${(py / MAP.H * 100).toFixed(2)}%" aria-label="Work area pin. Drag it to where the work is, or tap the map. Arrow keys move it one metre.">
          <svg viewBox="0 0 40 52" aria-hidden="true"><path d="M20 50 C20 50 4 31 4 19 A16 16 0 0 1 36 19 C36 31 20 50 20 50 Z" fill="#FF5A14" stroke="#fff" stroke-width="3"/><circle cx="20" cy="19" r="6" fill="#fff"/></svg>
        </button>

    }

    <div class="gps">

        <span class="pb-ico">${ic(ask ? 'pin' : 'check')}</span>
        <span><b>${ask ? 'Drag the pin to exactly where the work is' : s.pinMoved ? 'Work area pinned' : 'Work area at this spot'}</b><small id="pinNote">${esc(pinNote(d))}</small></span>
        ${ask ? `<button class="btn btn-sm btn-good" type="button" data-act="pinOk">${ic('check')}Pin is right</button>` : ''}
      </div>
      <div class="gps-body">
        <div><p class="gps-addr">${esc(addrLine(d))}, ${esc(s.suburb)} ${esc(s.state || 'VIC')} ${esc(s.postcode)}</p><p class="gps-coords" id="pinCoords">${s.lat.toFixed(5)}, ${s.lng.toFixed(5)}${s.via === 'gps' ? ` · fixed ${esc(s.fixedAt || '')}` : ' · work area pin'}</p></div>
        ${other ? `<div class="state-note">${ic('alert')}<span><b>This address is in ${esc(s.stateName || s.state)}.</b> The ${esc(pack.name)} rule pack isn't built yet (${esc(pack.doc)}), so this draft follows the Victorian pack. Check it against the ${esc(s.state)} requirements.</span></div>` : ''}

        <div class="facts">

          <div class="fact"><span class="label">Road authority${autoBadge()}</span><b>${esc(aTxt)}</b><small>${esc(s.roadClass)} · consent for works needed</small></div>
          <div class="fact"><span class="label">Traffic${autoBadge()}</span><b>${s.aadt ? `${s.aadt.toLocaleString('en-AU')} vehicles a day` : 'Not known'}</b><small>${esc(s.aadtSource)}</small></div>
          <div class="fact"><span class="label">Public transport${autoBadge()}</span><b>${s.tram ? 'Tram route' : 'No tram'} · ${s.bus ? 'bus route' : 'no bus'}</b><small>${esc(s.ptSource)}</small></div>
        </div>`}
        <div class="field-row">
          ${field('Speed zone (check the sign)', `<select class="in" id="fSpeed" data-bind="site.speed" data-num>${[40, 50, 60, 70, 80, 90, 100, 110].map((v) => `<option value="${v}" ${v === s.speed ? 'selected' : ''}>${v} km/h</option>`).join('')}</select>`)}
          ${field('Who looks after the road', `<select class="in" id="fAuth" data-bind="site.authority"><option value="council" ${s.authority === 'council' ? 'selected' : ''}>Council (${esc(s.lga)})</option><option value="dtp" ${s.authority === 'dtp' ? 'selected' : ''}>${other ? esc(s.stateRoads) : 'DTP'} (arterial road)</option></select>`)}
        </div>
        ${catField(d, other)}
        <div class="row"><button class="btn btn-sm btn-ghost" type="button" data-act="relocate">${ic('gps')}Use my location</button><button class="btn btn-sm btn-ghost" type="button" data-act="changeAddr">${ic('search')}Search another address</button></div>

  }

}

/* The road manager allocates each road a TTM category (AGTTM Part 8 s3); in Victoria it's on DTP's map. Until one is

function catField(d, other) {
  const s = d.site;

  const why = est.text.replace(/^Category \d: /, '');
  return `<div class="field cat-field"><span class="label">TTM category${s.publishedCat ? '' : autoBadge('Estimated')}</span>
    ${chipSet('site.publishedCat', s.publishedCat || 'none', [[1, 'Cat 1'], [2, 'Cat 2'], [3, 'Cat 3'], ['none', 'Not sure']])}
    <p class="hint">${s.publishedCat ? `Category ${s.publishedCat}, picked from the road manager's map.${est.cat !== s.publishedCat ? ` My TGS's own estimate from the road is Category ${est.cat} (${esc(why)}).` : ''}` : `My TGS estimates Category ${est.cat}: ${esc(why)}.`} ${other ? 'Confirm the category with the road manager.' : `Check the road on DTP's <a href="${CAT_MAP}" target="_blank" rel="noopener">TTM road category map</a> and pick it here.`} It sets the tickets the crew needs, the designer's TMD level and the gear My TGS suggests.</p>
  </div>`;

/* ---------- Address search (sample address list; the real app searches Vicmap Address) ---------- */
const lotOf = (n) => Math.floor((n - 1) / 2);
function addrSearch(q) {
  const norm = (t) => String(t).toLowerCase().replace(/[,.]/g, ' ').replace(/\brd\b/g, 'road').replace(/\bst\b/g, 'street').replace(/\s+/g, ' ').trim();
  const m = norm(q).match(/^(\d+)\s*[a-z]?\b\s*(.*)$/);
  const num = m ? parseInt(m[1], 10) : null;
  const words = (m ? m[2] : norm(q)).split(' ').filter(Boolean);
  return STREETS.map((st, i) => ({ st, i })).filter(({ st }) => {
    const hay = norm(`${st.street} ${st.suburb} ${st.postcode} vic`).split(' ');
    return words.every((w) => hay.some((h) => h.startsWith(w)));
  }).map(({ st, i }) => ({ st, i, num, n: num && num >= st.nums[0] && num <= st.nums[1] ? num : st.ref }));
}
function addrResults(q) {
  if (!String(q).trim()) return `<div class="addr-try"><span>Or try a demo address</span>${STREETS.map((st, i) => `<button class="chip" type="button" data-addr-pick="${i}:${st.ref}">${ic('pin')}${st.ref} ${esc(st.street)}, ${esc(st.suburb)}</button>`).join('')}</div>`;
  const list = addrSearch(q);
  if (!list.length) return `<p class="addr-none">${ic('info')}<span>No match in the demo streets. Try Surrey Road, Laburnum Street, Central Road or Whitehorse Road.</span></p>`;
  return list.map(({ st, i, n, num }) => `<button class="addr-hit" type="button" role="listitem" data-addr-pick="${i}:${n}">${ic('pin')}<span><b>${n} ${esc(st.street)}</b><small>${esc(st.suburb)} VIC ${esc(st.postcode)}${num && num !== n ? ` · no. ${num} isn't in the demo list, so this starts at no. ${n}` : num ? '' : ' · type the house number, or pick this and move the pin'}</small></span></button>`).join('');
}
/* Metres to latitude and longitude, near enough for a site pin */
function offsetLatLng(lat, lng, north, east) { return [lat + north / 111320, lng + east / (111320 * Math.cos(lat * Math.PI / 180))]; }
function applyAddress(i, n) {
  const d = state.draft, st = STREETS[i];
  const along = (lotOf(n) - lotOf(st.ref)) * MAP.lot;
  const [alat, alng] = offsetLatLng(st.lat, st.lng, st.axis === 'ns' ? along : 0, st.axis === 'ew' ? along : 0);
  Object.assign(d.site, {
    live: false, state: 'VIC', stateName: 'Victoria',
    number: String(n), street: st.street, suburb: st.suburb, postcode: st.postcode, lga: st.lga, axis: st.axis,
    authority: st.authority, roadClass: st.roadClass, speed: st.speed, speedSource: st.speedSource, aadt: st.aadt, aadtSource: st.aadtSource,
    tram: st.tram, bus: st.bus, ptSource: 'Public transport timetable data', dirA: st.dirA, dirB: st.dirB, crossA: '', crossB: '',
    addrLat: alat, addrLng: alng, lat: alat, lng: alng, acc: null, located: true, via: 'address', pinOk: false, pinMoved: false, pinA: 0, pinC: null, viewA: st.axis === 'ns' ? -20 : 0, fixedAt: null,
  });
  Object.entries(st.road).forEach(([k, v]) => { if (!d.touched?.[k]) d.road[k] = v; });
  d.road.bus = st.bus; d.road.tram = st.tram;
  setPinLatLng(d);
  state.addrQ = ''; state.locErr = false;
  render(); window.scrollTo(0, 0);
  toast('Address found: now put the pin on the work area', 'pin');
}
/* The work-area pin: along the street from the address (m, + is north or east) and across it (m from the centreline) */
function pinXY(d) { const G = mapGeom(d); return mapXY(d.site.axis || 'ns', (d.site.pinA || 0) * MAP.k, (d.site.pinC ?? G.laneC) * MAP.k, (d.site.viewA || 0) * MAP.k); }
function setPinLatLng(d) {
  const s = d.site, G = mapGeom(d);
  const a = s.pinA || 0, c = s.pinC ?? G.laneC;
  const north = s.axis === 'ew' ? -c : a, east = s.axis === 'ew' ? a : c;
  [s.lat, s.lng] = offsetLatLng(s.addrLat ?? s.lat, s.addrLng ?? s.lng, north, east);
}
function pinNote(d) {
  if (d.site.live) return livePinNote(d);
  const s = d.site, G = mapGeom(d);
  const a = s.pinA || 0, c = s.pinC ?? G.laneC;
  const y = c + G.tot / 2;
  const z = G.zs.find((q) => y >= q.y0 - 0.01 && y <= q.y1 + 0.01) || G.zs[0];
  const where = z.kind === 'foot' ? 'on the footpath' : z.kind === 'park' ? 'in the parking lane' : z.kind === 'bike' ? 'in the bike lane' : z.kind === 'median' ? 'on the median' : `in the ${(z.dir === 'B' ? s.dirB : s.dirA) || ''} lane`.replace('  ', ' ');
  const pinSide = c < 0 ? 'A' : 'B';
  const base = parseInt(s.number, 10) || 1;
  const nearLot = Math.max(0, lotOf(base) + Math.round(a / MAP.lot));
  const near = pinSide === 'A' ? nearLot * 2 + 1 : nearLot * 2 + 2; // odd numbers on side A
  const dist = Math.round(Math.abs(a));
  const dir = s.axis === 'ew' ? (a >= 0 ? 'east' : 'west') : (a >= 0 ? 'north' : 'south');
  const opp = pinSide !== G.side;
  if (dist < 8) return `At the address, ${where}${opp ? `, across the road from no. ${s.number}` : ''}.`;
  return `${dist} m ${dir} of the address, ${where}, ${opp ? 'across from' : 'outside'} about no. ${near}.`;
}
function initPinDrag() {
  const map = $('#siteMap'), pin = $('#mapPin');
  if (!map || !pin || !state.draft) return;
  const d = state.draft;
  const toMap = (e) => { const r = map.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * MAP.W, ((e.clientY - r.top) / r.height) * MAP.H]; };
  const moveTo = (a, c) => {
    const G = mapGeom(d), axis = d.site.axis || 'ns', v = d.site.viewA || 0;
    // keep the whole pin on the map: it stands 50 px above its tip
    const lo = axis === 'ns' ? v - (MAP.H / 2 - 10) / MAP.k : v - (MAP.W / 2 - 22) / MAP.k;
    const hi = axis === 'ns' ? v + (MAP.H / 2 - 96) / MAP.k : v + (MAP.W / 2 - 22) / MAP.k;
    d.site.pinA = Math.round(Math.max(lo, Math.min(hi, a)));
    d.site.pinC = Math.round(Math.max(-G.edge + 0.3, Math.min(G.edge - 0.3, c)) * 10) / 10;
    setPinLatLng(d);
    const [x, y] = pinXY(d);
    pin.style.left = (x / MAP.W * 100).toFixed(2) + '%'; pin.style.top = (y / MAP.H * 100).toFixed(2) + '%';
    const ln = $('#pinLine'); if (ln) { ln.setAttribute('x2', x.toFixed(1)); ln.setAttribute('y2', y.toFixed(1)); }
    const nt = $('#pinNote'); if (nt) nt.textContent = pinNote(d);
    const co = $('#pinCoords'); if (co) co.textContent = `${d.site.lat.toFixed(5)}, ${d.site.lng.toFixed(5)} · work area pin`;
  };
  const fromXY = ([x, y]) => { const axis = d.site.axis || 'ns', v = d.site.viewA || 0; return axis === 'ns' ? [(MAP.H / 2 - y) / MAP.k + v, (x - MAP.W / 2) / MAP.k] : [(x - MAP.W / 2) / MAP.k + v, (y - MAP.H / 2) / MAP.k]; };
  const commit = () => {
    d.site.pinOk = true; d.site.pinMoved = true;
    // bring the pin back towards the middle so it can be dragged further along the street
    const span = ((d.site.axis || 'ns') === 'ns' ? MAP.H : MAP.W) / MAP.k;
    if (Math.abs(d.site.pinA - (d.site.viewA || 0)) > span * 0.2) d.site.viewA = d.site.pinA - ((d.site.axis || 'ns') === 'ns' ? 20 : 0);
    render(); toast('Work area pinned', 'pin');
  };
  let drag = false;
  pin.addEventListener('pointerdown', (e) => { drag = true; pin.setPointerCapture(e.pointerId); pin.classList.add('drag'); e.preventDefault(); });
  pin.addEventListener('pointermove', (e) => { if (drag) moveTo(...fromXY(toMap(e))); });
  pin.addEventListener('pointerup', (e) => { if (!drag) return; drag = false; pin.classList.remove('drag'); moveTo(...fromXY(toMap(e))); commit(); });
  pin.addEventListener('pointercancel', () => { drag = false; pin.classList.remove('drag'); });
  pin.addEventListener('keydown', (e) => {
    const k = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
    if (!k) return;
    e.preventDefault();
    const [x, y] = pinXY(d);
    moveTo(...fromXY([x + k[0] * MAP.k, y + k[1] * MAP.k]));
    d.site.pinOk = true; d.site.pinMoved = true; refreshSteps();
  });
  map.querySelector('svg').addEventListener('click', (e) => { moveTo(...fromXY(toMap(e))); commit(); });
}

/* Step 2: Photos */
function stepPhotos(d) {

      <div class="field"><span class="label">Footpaths${f.footpath ? autoBadge('From the map') : ''}</span>${chipSet('road.footpath', r.footpath, [['both', 'Both sides', 'walk'], ['one', 'One side'], ['none', 'None']])}</div>
      <div class="field"><span class="label">Driveways in the site</span>${chipSet('road.driveways', r.driveways, [[0, 'None'], [1, '1'], [2, '2'], [3, '3'], [4, '4+']])}</div>
    </div>
    <div class="field"><span class="label">Heavy vehicles in every 100 vehicles</span>${chipSet('road.heavy', r.heavy, [['low', 'Fewer than 5'], ['med', '5 to 10'], ['high', 'More than 10']])}
      <p class="hint">Trucks and buses as a share of traffic, the measure the risk assessment uses: AGTTM Part 3 counts a lane as carrying 20% less traffic when more than 10 in 100 are heavy vehicles.</p></div>
  </fieldset>`;
}

/* Step 4: Work */
function stepWork(d) {
  const w = d.work;
  const types = [['pit', 'Service pit', 'pipe'], ['dig', 'Excavation', 'dig'], ['tree', 'Tree work', 'tree'], ['asphalt', 'Asphalt patch', 'road'], ['lines', 'Line marking', 'brush'], ['lift', 'Crane or EWP lift', 'crane'], ['survey', 'Survey or inspection', 'eye'], ['delivery', 'Delivery or loading', 'truck']];
  const plant = [['ute', 'Ute'], ['tipper', 'Tip truck'], ['vac', 'Vacuum truck'], ['exc', 'Excavator'], ['ewp', 'EWP'], ['crane', 'Crane truck']];
  const span = workSpan(d);
  const blocks = workBlocks(d), blocked = workBlocked(d);
  const picked = blocks.length > 0;
  if (!w.types) w.types = workTypes(d);
  const picked0 = w.types;
  const ppe = ppeNeeds(d), hat = ppe.find((x) => x.key === 'hat');
  const width = blocks.length === 1 ? blocks[0].filter((z) => z.kind !== 'median').reduce((a, z) => a + z.w, 0) : 0;
  const cl = picked && !blocked ? workClearance(d) : null;
  if (cl && !d.touched?.['work.gap']) w.gap = cl.band;
  const gi = (g) => GAPS.findIndex((x) => x[0] === g);
  const wider = cl && gi(w.gap || '0-1.2') > gi(cl.band);
  const gapMin = { '0-1.2': 0, '1.2-3': 1.2, '3-6': 3, '6-9': 6, '9+': 9 }[w.gap || '0-1.2'];
  let alert = '';
  if (blocked?.both) alert = `<div class="state-note bad">${ic('alert')}<span><b>This closes the road.</b> The work takes both lanes, which needs a road closure with a detour. My TGS doesn't draw those yet: split the work into stages and do one side at a time.</span></div>`;
  else if (blocked?.dir) alert = `<div class="state-note bad">${ic('alert')}<span><b>No lane left for ${esc(d.site[blocked.dir === 'A' ? 'dirA' : 'dirB'] || 'this')} traffic.</b> The work takes every lane in that direction, which needs a detour. Leave a lane open, or split the work into stages.</span></div>`;
  else if (blocks.length > 1) alert = `<div class="state-note">${ic('info')}<span><b>${blocks.length} separate work areas.</b> Each gets its own cones or fencing on the TGS, and one set of signs covers each direction of traffic.</span></div>`;
  else if (w.midLane) alert = `<div class="state-note">${ic('info')}<span><b>The lanes between it and the kerb close too.</b> A middle lane can't close on its own, so traffic merges out of one lane at a time, starting at the kerb (AGTTM Part 3 Figure 5.16).</span></div>`;
  else if (span.twoLanes) alert = `<div class="state-note">${ic('info')}<span><b>${cap(numWord(span.lanes.length))} lanes close.</b> Traffic merges out of one lane at a time, with a taper for each lane the Table 5.8 distance apart.</span></div>`;
  const gapChips = `<div class="chips">${GAPS.map(([v, l]) => {
    const isAuto = cl && v === cl.band;
    const further = cl && gi(v) > gi(cl.band);
    return `<button class="chip ${further ? 'chip-far' : ''}" type="button" data-set="work.gap" data-val="${v}" aria-pressed="${(w.gap || '0-1.2') === v}">${l}${isAuto ? '<small>measured</small>' : ''}</button>`;
  }).join('')}</div>`;
  return `
  <fieldset class="fieldset"><legend>Type of work${picked0.length ? '' : '<span class="need">Needed</span>'}</legend>
    <p class="hint">Pick every type that applies.</p>
    <div class="chips">${[...types, ...(state.prefs.workTypes || []).map((n) => ['own:' + n, n, 'edit'])].map(([v, l, i]) => `<button class="chip" type="button" data-multi="work.types" data-val="${esc(v)}" aria-pressed="${picked0.includes(v)}">${i ? ic(i) : ''}${esc(l)}</button>`).join('')}<button class="chip chip-add" type="button" data-act="addWorkType">${ic('plus')}Add your own</button></div>
  </fieldset>
  <fieldset class="fieldset"><legend>Where is the work?${picked ? '' : '<span class="need">Needed</span>'}</legend>
    <p class="hint">Tap every part of the road the crew, plant and materials will take up, on either side. Parts next to each other make one work area; parts apart make separate work areas. Tap a part again to take it off.</p>
    <div class="xsec ${picked ? '' : 'unset'}">${xsecSVG(d)}
      <div class="xsec-legend">${picked ? `<span><b style="color:var(--ink)">${blocks.length > 1 ? 'Work areas' : 'Work area'}:</b> ${esc(workLabel(d))}${width ? ` · about ${width.toFixed(1)} m wide` : ''}</span>` : `<span class="need-inline">${ic('question')}Tap the road above to choose</span>`}<span>Looking ${esc(d.site.dirA || 'along the road')}${TOWARD[d.site.dirA] ? `, ${TOWARD[d.site.dirA]}` : ''}</span></div>
      ${picked && selectedIds(d).length > 0 ? `<div class="row"><button class="link-btn" type="button" data-act="clearZones">${ic('x')}Clear the selection</button></div>` : ''}
    </div>
    ${alert}
    <div class="range">
      <div class="range-top"><span class="label">Length of the work area</span><b><span id="wlOut">${w.length}</span> m</b></div>
      <input type="range" id="fWorkLen" min="5" max="120" step="5" value="${w.length}" data-bind="work.length" data-num data-out="wlOut">
    </div>
  </fieldset>
  <fieldset class="fieldset"><legend>People and plant</legend>
    <div class="field"><span class="label">Workers on site${w.workers ? '' : '<span class="need">Needed</span>'}</span>${chipSet('work.workers', w.workers, [[1, '1'], [2, '2'], [3, '3'], [4, '4'], [6, '5 to 8'], [10, 'More']])}</div>
    <div class="field"><span class="label">Plant and vehicles (leave blank if none)</span><div class="chips">${plant.map(([v, l]) => `<button class="chip" type="button" data-multi="work.plant" data-val="${v}" aria-pressed="${w.plant.includes(v)}">${l}</button>`).join('')}</div></div>
    ${hat.alert ? `<div class="state-note ppe-alert">${ic('hat')}<span><b>Hard hat needed.</b> Anyone within 3 m of plant or equipment wears a hard hat.</span></div>` : ''}
    <div class="field"><span class="label">PPE for this job</span><ul class="ppe-list">${ppe.filter((x) => x.on).map((x) => `<li>${ic('check')}<span><b>${esc(x.label)}</b><small>${esc(x.why)}</small></span></li>`).join('')}</ul></div>
  </fieldset>
  <fieldset class="fieldset"><legend>Clearance to moving traffic</legend>
    ${cl ? `<div class="clear-fig"><span class="cf-num"><b>${cl.m >= 99 ? '9+' : cl.m.toFixed(1)}</b><small>m</small></span><span><b>${cl.to ? (cl.adjacent ? `Right next to ${esc(cl.to)}` : `${cl.m.toFixed(1)} m to ${esc(cl.to)}`) : 'No moving traffic beside the work area'}</b><small>${cl.adjacent ? `Only the ${at(RULES.edgeClear, d.site.speed)} m cone clearance is between them.` : 'Measured from the edge of the work area.'}</small></span></div>` : `<p class="hint">Choose where the work is and My TGS measures this for you.</p>`}
    <div class="field"><span class="label">Design the TGS for a work area</span>${gapChips}</div>
    <p class="hint">Measured from the edge of the work area, including vehicles, plant and materials, to the nearest open traffic or bike lane (AGTTM Part 3 s5.1). Anyone in the work area can reach its edge, so the TGS is designed to it, not to where people usually stand. Choose a greater distance only if the work area will be marked at that distance with cones, fencing or barrier and the supervisor keeps everyone inside it. If in doubt, keep the measured distance: it gives the lower, safer speed.</p>
    ${wider ? `<div class="state-note">${ic('alert')}<span><b>The crew must stay at least ${gapMin} m from moving traffic.</b> The TGS records this, and the site check asks the supervisor to mark the work area at that distance before work starts.</span>${d.touched?.['work.gap'] ? `<button class="btn btn-sm btn-ghost" type="button" data-act="gapAuto">${ic('refresh')}Use the work area's edge</button>` : ''}</div>` : ''}
  </fieldset>`;
}

/* Step 5: Traffic control */
function stepControl(d) {
  const span = workSpan(d);
  const any = selectedIds(d).length > 0, blocked = workBlocked(d);
  if (!any || blocked) return `
  <div class="todo-box"><b>${ic('question')}${any ? 'The work area closes the road' : 'Choose where the work is first'}</b><span>${any ? 'Traffic needs a way past the work. Change the work area on the Work page so a lane stays open, or split the work into stages.' : 'My TGS picks the traffic control method from where the work sits on the road.'}</span><div class="row"><button class="btn btn-primary" type="button" data-step="3">${ic('left')}Go to the Work page</button></div></div>`;
  const footBlocks = workBlocks(d).filter((b) => b.some((z) => z.kind === 'foot'));
  const bothFoot = new Set(footBlocks.map((b) => b.find((z) => z.kind === 'foot').side)).size > 1;
  const recs = recommendMethods(d);
  const c = d.control;
  const best = recs.find((m) => m.ok && m.best) || recs[0];
  if (!d.touched?.['control.method'] || !recs.find((m) => m.id === c.method && m.ok)) c.method = best.ok ? best.id : recs.find((m) => m.ok)?.id || recs[0].id; // follow the suggestion until the user picks one
  const spd = speedAdvice(d);
  if (!d.touched?.['control.speedLimit']) c.speedLimit = spd.suggested ?? null; // follow the suggestion until the user picks one
  const adv = gearAdvice(d);
  ['tma', 'arrow', 'vms', 'barrier'].forEach((k) => { if (!d.touched?.['control.' + k]) c[k] = adv[k].on; });
  const gear = (k, base) => `${base}<span class="sugg ${adv[k].on ? 'on' : ''}">${adv[k].on ? `${ic('spark')}Suggested: ` : ''}${esc(adv[k].why)}${d.touched?.['control.' + k] && c[k] !== adv[k].on ? ' · you changed this' : ''}</span>`;
  return `
  <div class="why"><b>Why My TGS suggests ${esc(best.name.toLowerCase())}</b><ul class="why-list">${best.why.split(/(?<=[.!?])\s+(?=[A-Z])/).map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>
  <fieldset class="fieldset"><legend>Traffic control method</legend>
    <div class="methods">
      ${recs.map((m) => `<button class="method ${m.ok ? '' : 'not-suited'}" type="button" data-set="control.method" data-val="${m.id}" aria-pressed="${c.method === m.id}" ${m.ok ? '' : 'disabled'}>
        ${methodArt(m.id)}<span><b>${esc(m.name)}</b><small>${esc(m.ok ? m.short : m.whyNot)}</small>${m.best ? `<span class="rec pill pill-approved">${ic('spark')}Suggested</span>` : ''}</span></button>`).join('')}
    </div>
  </fieldset>
  <fieldset class="fieldset"><legend>Speed past the work</legend>
    <p class="hint">${esc(spd.text)}</p>
    <p class="hint" style="font-size:13px">Based on ${esc(spd.source)}. The designer confirms the limit, and it goes in the TMP.</p>
    ${chipSet('control.speedLimit', c.speedLimit ?? 'none', spd.options)}
  </fieldset>
  <fieldset class="fieldset"><legend>People walking</legend>
    ${bothFoot
      ? `<div class="state-note bad">${ic('alert')}<span><b>Both footpaths are closed.</b> People can't be sent to the other side, so they need a fenced route past the work (such as a path in the parking lane) or a detour to the nearest safe crossing. The designer adds it to the TGS.</span></div>`
      : footBlocks.length && (footBlocks.length > 1 || footBlocks[0].length > 1 || workBlocks(d).length > 1)
      ? `<div class="clear-fig"><span class="cf-num">${ic('walk')}</span><span><b>Sent to the other footpath</b><small>The footpath is part of the work, so it's fenced off and people cross at a safe point before the closure.</small></span></div>`
      : chipSet('control.peds', c.peds, [['open', 'Footpath stays open', 'walk'], ['divert', 'Send them to the other side'], ['path', 'Fenced path around the work']])}
  </fieldset>
  <fieldset class="fieldset"><legend>Gear you have for this job</legend>
    <p class="hint">Set from the earlier pages: the road's TTM category (Category ${ttmCategory(d).cat}), the speed and traffic, the method and the work. Change any that don't suit the job.</p>
    <div class="toggles">
      ${toggleBtn('control.tma', c.tma, 'Truck mounted attenuator', gear('tma', 'Crash cushion truck behind the work'), 'truck')}
      ${toggleBtn('control.arrow', c.arrow, 'Arrow board', gear('arrow', 'Flashing arrow for lane closures'), 'right')}
      ${toggleBtn('control.vms', c.vms, 'Message board (VMS)', gear('vms', 'Advance notice to drivers'), 'info')}
      ${toggleBtn('control.barrier', c.barrier, 'Water-filled barriers', gear('barrier', 'Solid protection for the work area'), 'shield')}
    </div>
  </fieldset>`;
}

/* Step 6: Review. Crews and their tickets live in the company's scheduling system (Traffio and the like), so the
   form only asks who approves the TGS: AGTTM Part 8 needs a designer holding the TMD skill set for the category. */
function stepReview(d) {
  const des = TEAM.filter((p) => p.roles.includes('design'));
  const tc = ttmCategory(d), cat = tc.cat;
  const drawable = selectedIds(d).length && d.site.located && !workSpan(d).bothDirs && !workSpan(d).closesDir;
  const s = drawable ? buildScheme(d) : null;
  const fits = (id) => !!holdsFor(TEAM.find((x) => x.id === id), 'design', cat);
  if (!fits(d.people.designer)) { const p = (fits(ME) ? TEAM.find((x) => x.id === ME) : des.find((x) => fits(x.id))); if (p) d.people.designer = p.id; }
  const todo = allMissing(d);
  const todoTxt = (v) => v ? esc(v) : '<span class="doc-todo">Not filled in yet</span>';
  const rows = [
    ['Site', d.site.located ? `${addrLine(d)}, ${d.site.suburb} · ${d.site.speed} km/h · ${authShort(d)}` : '', 0],
    ['Photos', photoCount(d) ? `${plural(photoCount(d), 'photo')}${d.media.photos.video ? ' and a video' : ''}` : '', 1],
    ['Road', `${layoutName(d.road.layout)}, lanes ${d.road.laneWidth.toFixed(1)} m${d.road.parking ? ', parking' : ''}${d.road.bus ? ', bus route' : ''}${d.road.tram ? ', trams' : ''}`, 2],
    ['Work', workTypes(d).length && selectedIds(d).length ? `${workTypesName(d)}, ${workLabel(d).toLowerCase()}, ${d.work.length} m` : '', 3],
    ['Traffic', s ? `${s.methodName}${s.tempSpeed ? `, ${s.tempSpeed} km/h past the work` : ''}` : '', 4],
    ['When', `${fmtDate(d.work.date)} · ${fmtTime(d.work.start)} to ${fmtTime(d.work.end)}${d.work.night ? ' · night works' : ''}${d.work.multiDay ? ' · aftercare' : ''}`, 0],
  ];
  return `
  ${todo.length ? `<div class="todo-box" id="todoBox"><b>${ic('question')}Still to do before it can be approved</b>
    <ul>${todo.map((x) => `<li><button class="link-btn" type="button" data-step="${x.i}">${esc(x.name)}</button><span>${esc(x.miss.join('; '))}</span></li>`).join('')}</ul></div>`
    : `<div class="done-box">${ic('check')}<span><b>Everything's filled in.</b> Approve the TGS when you're ready, or save it as a draft.</span></div>`}
  <div class="summary">${rows.map(([k, v, st]) => `<div class="summary-row"><span class="label">${k}</span><b>${todoTxt(v)}</b><button class="link-btn" type="button" data-step="${st}">Edit</button></div>`).join('')}</div>
  <fieldset class="fieldset"><legend>Approved by</legend>
    <div class="people">${des.map((p) => personBtn('people.designer', d.people.designer, p, 'design', cat)).join('')}</div>
    <p class="hint">This site is TTM Category ${cat} (${esc(tc.text.replace(/^Category \d: /, ''))}). AGTTM Part 8 needs the person who approves the TGS to hold a current TMD${cat}. Their name and skill set go in the title block.</p>
  </fieldset>
  <div class="why"><b>What you'll get</b><span>A site-specific TGS drawing with every sign, taper and distance, a sign and gear list for the truck, checks against the guide, the Traffic Management Plan, the Hazard & Risk Assessment, the SWMS, a letter for residents and businesses, and a step-by-step set-out order for the crew. Once it's approved it's ready for site; the crew reviews the SWMS and signs on before starting.</span></div>`;
}
function personBtn(path, cur, p, role, cat = 1) {
  const held = holdsFor(p, role, cat);
  const q = held || p.quals.filter((x) => x.role === role).sort((a2, b2) => (b2.level || 0) - (a2.level || 0))[0] || p.quals[0];
  const st = qualState(q);
  const low = !held && st !== 'exp';
  const disabled = !held;
  return `<button class="person" type="button" data-set="${path}" data-val="${p.id}" aria-pressed="${cur === p.id}" ${disabled ? 'disabled style="opacity:.55"' : ''}>
    <span class="avatar" style="background:${p.colour}">${inkBadge(p.initials, 0.4)}</span>
    <span><b>${esc(p.name)}</b><small>${esc(p.quals.filter((x) => x.role === role).map((x) => x.short).join(', ') || q.short)} · ${held ? `${esc(held.short)} valid to ${fmtDate(held.expires, { month: 'short', year: 'numeric' })}` : st === 'exp' ? `${esc(q.short)} expired` : `no ${role === 'design' ? 'TMD' : 'TMI'}${cat} skill set`}</small></span>
    <span class="qual ${held ? qualState(held) : 'exp'}">${held ? (qualState(held) === 'soon' ? 'Renew soon' : `Holds ${held.short}`) : low ? `Not Cat ${cat}` : 'Expired'}</span>
  </button>`;
}
function qualState(q) {
  if (!q || !q.expires) return 'ok'; // e.g. the construction induction card doesn't expire
  const days = (new Date(q.expires) - new Date()) / 864e5;
  return days < 0 ? 'exp' : days < 60 ? 'soon' : 'ok';
}

/* ---------- Photos to the office's OneDrive (the GitHub demo) ----------
   On the demo site each photo or video goes to a small relay (a Google Apps Script web app holding a Microsoft Graph
   app's login, see onedrive-relay/), which saves it in the demo's OneDrive folder for this job. Nothing reads the
   photos. With no relay set (the claude.ai artifact, a local preview) they stay on this device. */
const UPLOAD_URL = () => (window.MYTGS_CONFIG && window.MYTGS_CONFIG.uploadUrl) || '';
const UPLOAD = {}, FILES = {};
function photoFolder(d) {
  const where = d.site.located ? `${addrLine(d)} ${d.site.suburb}` : 'No address yet';
  return `${d.work.date || localISO()} ${where} ${d.uid || ''}`.replace(/[\\/:*?"<>|#%]+/g, ' ').replace(/\s+/g, ' ').trim();
}
function shrinkImage(file, max = 2000, q = 0.85) {
  return new Promise((res) => {
    if (!/^image\/(jpeg|png|webp|heic|heif)/.test(file.type)) { res(file); return; }
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      cv.toBlob((b) => res(b && b.size < file.size ? b : file), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
const blobB64 = (b) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = () => rej(new Error('could not read the file')); fr.readAsDataURL(b); });
async function uploadPhoto(d, key) {
  const url = UPLOAD_URL(), file = FILES[`${d.uid}:${key}`];
  if (!url || !file) return;
  const st = (UPLOAD[`${d.uid}:${key}`] = { state: 'up' });
  const repaint = () => { if (state.view === 'new' && state.step === 1 && state.draft === d) render(); };
  repaint();
  try {
    const blob = await shrinkImage(file);
    if (blob.size > 30 * 1024 * 1024) throw new Error('too big for the demo, so it stays on this device');
    const type = blob.type || file.type || 'application/octet-stream';
    const ext = type === 'image/jpeg' ? 'jpg' : (file.name.split('.').pop() || 'bin').toLowerCase();
    const folder = photoFolder(d);
    const title = (photoSlots(d).find((x) => x.key === key)?.title || key).replace(/\s*\(.*\)$/, '');
    const name = `${title} ${hhmmNow().replace(':', '-')}.${ext}`;
    const r = await fetch(url, { method: 'POST', body: JSON.stringify({ fn: 'upload', folder, name, type, b64: await blobB64(blob) }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'the relay said no');
    st.state = 'ok';
    if (d.media.photos[key]) d.media.photos[key].saved = { folder: j.path ? j.path.split('/').slice(-2, -1)[0] : folder, path: j.path || '', at: nowStamp() };
    save();
  } catch (e) { st.state = 'fail'; st.err = String(e.message || e).replace(/^TypeError: /, ''); }
  repaint();
}

/* ---------- Drafts, approval and creating the TGS ---------- */
/* Anything worth keeping on a form that was left part-way */
function draftHasContent(d) { return !!(d && (d.site.located || String(d.client || '').trim() || String(d.desc || '').trim() || photoCount(d) || selectedIds(d).length)); }
function saveDraft() {
  const d = state.draft; if (!d || state.revising) return null;
  let job = state.editing && state.jobs.find((j) => j.id === state.editing);
  if (!job) {
    job = { id: 'j' + Date.now().toString(36), number: nextNumber(), rev: 'A', status: 'draft', created: new Date().toISOString(), createdBy: ME, history: [], confirm: {} };
    state.jobs.push(job); state.editing = job.id;
  }
  if (job.status !== 'draft') return null;
  job.input = clone(d); job.step = state.step; job.savedAt = nowStamp(); job.savedIso = new Date().toISOString();
  Object.entries(d.media.photos).forEach(([k, ph]) => { if (ph?.url) job.input.media.photos[k].url = ph.url; }); // photo links live for this visit only
  job.history = [{ what: `Draft saved by ${personName(ME)}`, when: job.savedAt }];
  save();
  return job;
}
function leaveWizard() { state.draft = null; state.editing = null; state.revising = null; }
function openDraft(job) {
  state.draft = clone(job.input); state.editing = job.id; state.revising = null;
  const miss = allMissing(state.draft);
  state.step = Math.min(STEPS.length - 1, job.step ?? (miss.length ? miss[0].i : STEPS.length - 1));
  state.lastStep = null;
  go('new');
}
/* Edit an approved TGS: the form opens with its details and approving it again makes the next revision */
function reviseTGS(job) {
  state.draft = clone(job.input); state.editing = job.id; state.revising = job.id;
  state.draft.seen = { 0: true, 1: true, 2: true, 3: true, 4: true };
  state.step = 0; state.lastStep = null;
  go('new');
  toast(`Editing ${job.number}. Approving it again makes Rev ${String.fromCharCode(job.rev.charCodeAt(0) + 1)}.`, 'edit');
}
function approveTGS() {
  const d = state.draft;
  if (!d.site.located) { state.step = 0; state.locErr = true; render(); return; }
  const left = allMissing(d);
  if (left.length) {
    const box = $('#todoBox');
    if (box) { box.scrollIntoView({ behavior: 'smooth', block: 'center' }); box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash'); }
    toast(`Finish ${left.map((x) => x.name).join(', ')} first`, 'question');
    return;
  }
  openApprove();
}
function createTGS() {
  const d = state.draft;
  const s = buildScheme(d);
  const ov = $('#gen'); const list = $('#genList');
  const photos = photoCount(d);
  $('#genTitle').textContent = state.revising ? 'Updating your TGS' : 'Building your TGS';
  const lines = [
    `Keeping <b>${plural(photos, 'site photo')}</b>${d.media.photos.video ? ' and a <b>walk-through video</b>' : ''} with the job`,
    `Speed zone: <b>${s.speed} km/h</b>`,
    `Road authority: <b>${d.road.privateProp ? esc(d.road.privateAuth || 'private property') : d.site.authority === 'dtp' ? 'DTP, arterial road' : esc(d.site.lga)}</b>`,
    `Layout: <b>${esc(s.methodName)}</b>`,
    `Sign spacing for ${s.approachSpeed} km/h: <b>${s.D} m</b>`,
    s.taper ? `Taper <b>${s.taper} m</b>, safety buffer <b>${s.buffer} m</b>` : `Safety buffer <b>${s.buffer} m</b>`,
    `Lane past the work: <b>${s.laneLeft.toFixed(1)} m</b>`,
    `Hazard assessment: <b>${plural(s.hazards.length, 'hazard')}</b>, ${s.hazards.filter((h) => h.band >= 2).length} high or extreme before controls`,
    `TMP, risk assessment and SWMS: <b>filled in from your templates</b>`,
  ];
  list.innerHTML = lines.map((l) => `<li><span class="gi"></span><span>${l}</span></li>`).join('');
  ov.hidden = false;
  const items = $$('li', list);
  let i = 0;
  const tick = () => {
    if (i > 0) { items[i - 1].className = 'done'; items[i - 1].querySelector('.gi').innerHTML = ic('check'); }
    if (i < items.length) { items[i].className = 'doing'; i++; setTimeout(tick, 380); return; }
    setTimeout(() => {
      ov.hidden = true;
      const at = nowStamp(), approver = personName(d.people.designer);
      const day = fmtDate(localISO(), { day: 'numeric', month: 'short', year: 'numeric' });
      const what = state.revNote || (state.revising ? 'Changed and approved again' : 'First issue'); state.revNote = '';
      let job = state.editing && state.jobs.find((j) => j.id === state.editing);
      const input = clone(d);
      Object.entries(d.media.photos).forEach(([k, ph]) => { if (ph?.url) input.media.photos[k].url = ph.url; });
      if (job && state.revising) {
        job.revs = revisionsOf(job);
        job.rev = String.fromCharCode(job.rev.charCodeAt(0) + 1);
        job.revs = [...job.revs, { rev: job.rev, date: day, what, by: approver }];
        job.input = input; job.approvedBy = approver; job.approvedAt = at; job.confirm = {}; job.setup = {};
        job.history.push({ what: `Changed and approved as Rev ${job.rev} by ${approver}`, when: at });
        if (job.swms) { job.swms.version = (job.swms.version || 1) + 1; swmsLog(job, `TGS changed to Rev ${job.rev}: now version ${job.swms.version}`); }
      } else if (job) {
        Object.assign(job, { input, status: 'approved', approvedBy: approver, approvedAt: at, confirm: {}, revs: [{ rev: job.rev, date: day, what, by: approver }] });
        job.history = [{ what: `Created by ${personName(ME)}`, when: job.savedAt || at }, { what: `Approved Rev ${job.rev} by ${approver}`, when: at }];
      } else {
        job = { id: 'j' + Date.now().toString(36), number: nextNumber(), rev: 'A', status: 'approved', created: new Date().toISOString(), createdBy: ME, input, approvedBy: approver, approvedAt: at, confirm: {}, revs: [{ rev: 'A', date: day, what, by: approver }],
          history: [{ what: `Created by ${personName(ME)}`, when: at }, { what: `Approved Rev A by ${approver}`, when: at }] };
        state.jobs.push(job);
      }
      const revised = !!state.revising;
      leaveWizard(); save();
      go('tgs', { id: job.id });
      toast(revised ? `Rev ${job.rev} approved. The crew signs on to the new SWMS version.` : 'TGS approved. Review the SWMS on site before starting.', 'shield');
    }, 400);
  };
  tick();
}
function nextNumber() {
  const max = state.jobs.reduce((m, j) => Math.max(m, parseInt(String(j.number).replace(/\D/g, ''), 10) || 0), 140);
  return 'TGS-' + String(max + 1).padStart(4, '0');
}
const personName = (id) => TEAM.find((p) => p.id === id)?.name || 'Unknown';
/* Each revision of the TGS for the sheet's revision box: letter, date, what changed and who approved it */
function revisionsOf(job) {
  if (job.revs?.length) return job.revs;
  return [{ rev: job.rev, date: job.approvedAt || '', what: job.rev === 'A' ? 'First issue' : 'Changed and approved again', by: job.approvedBy || personName(job.input.people.designer) }];
}

/* ============================================================
   TGS view
   ============================================================ */
function renderTGS() {
  const job = currentJob();
  if (!job) { state.view = 'jobs'; return renderJobs(); }
  const inp = job.input, s = buildScheme(inp, job);
  const attention = s.checks.filter((c) => c.status !== 'pass' && !job.confirm?.[c.id]).length;
  const high = s.hazards.filter((h) => h.rBand >= 3).length;
  const sw = swmsState(job, s);
  const tabs = [
    ['plan', 'Plan', 'layers', ''],
    ['signs', 'Signs & gear', 'warn-sign', `<span class="n">${s.schedule.total}</span>`],
    ['checks', 'Checks', 'checks', attention ? `<span class="n warn">${attention}</span>` : `<span class="n">${ic('check')}</span>`],
    ['hazards', 'Hazards', 'alert', `<span class="n ${high ? 'bad' : ''}">${s.hazards.length}</span>`],
    ['swms', 'SWMS', 'shield', sw.ready ? `<span class="n">${ic('check')}</span>` : `<span class="n warn">${sw.signed}/${sw.able}</span>`],
    ['setup', 'Set-out', 'steps', ''],
    ['docs', 'Paperwork', 'file', ''],
  ];
  if (!tabs.some((t) => t[0] === state.tgsTab)) state.tgsTab = 'plan';
  const body = { plan: tabPlan, signs: tabSigns, checks: tabChecks, hazards: tabHazards, swms: tabSwms, setup: tabSetup, docs: tabDocs }[state.tgsTab](job, s);
  return `
  <div class="tgs-head">
    <button class="back-link" type="button" data-go="jobs">${ic('left')}Jobs</button>
    <div class="tgs-title">${speedBadge(s.speed, "lg")}
      <div><h1>${esc(addrLine(inp))}, ${esc(inp.site.suburb)}</h1><p class="sub">${esc(inp.desc)} · ${esc(inp.client)}</p></div>
    </div>
    <div class="tgs-meta">${statusPill(job.status)}<span class="pill pill-plain mono">${esc(job.number)} Rev ${esc(job.rev)}</span></div>
    <p class="tgs-facts">${[`${fmtDate(inp.work.date)}, ${fmtTime(inp.work.start)}–${fmtTime(inp.work.end)}`, s.methodName, `TTM Category ${s.category.cat}`, authShort(inp)].map((x) => `<span>${esc(x)}</span>`).join('')}</p>
    ${statusBar(job, s)}
  </div>
  <div class="seg" role="tablist" aria-label="TGS sections">${tabs.map(([k, l, i, n]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${state.tgsTab === k}">${ic(i)}${l}${n}</button>`).join('')}</div>
  <div role="tabpanel">${body}</div>`;
}
function statusBar(job, s) {
  const M = {
    draft: ['s-draft', 'edit', 'Draft', 'Finish the form to approve it. Nothing is ready for site until then.', `<button class="btn btn-primary" type="button" data-act="finishDraft">${ic('edit')}Finish the form</button>`],
    approved: (() => {
      const sw = swmsState(job, s);
      return sw.ready
        ? ['s-approved', 'shield', `Approved by ${esc(job.approvedBy || personName(job.input.people.designer))}`, `Signed ${esc(job.approvedAt || '')}. SWMS reviewed and the crew signed on, so you can start.`, `<button class="btn btn-good" type="button" data-act="startSite">${ic('flag')}Start on site</button>`]
        : ['s-approved', 'shield', `Approved by ${esc(job.approvedBy || personName(job.input.people.designer))}`, `Before starting: ${esc(sw.blockers.join('; '))}.`, `<button class="btn btn-todo" type="button" data-tab="swms">${ic('question')}Finish the SWMS first</button>`];
    })(),
    live: ['s-live', 'cone', 'Set out and running', `Started ${esc(job.startedAt || '')}. ${plural((job.inspections || []).length, 'inspection')} logged${job.inspections?.length ? `, last at ${esc(job.inspections[job.inspections.length - 1])}` : ''}. Inspect again when anything changes.`, `<button class="btn" type="button" data-act="logInspection">${ic('eye')}Log inspection</button><button class="btn" type="button" data-act="closeSite">${ic('check')}Close the site</button>`],
    closed: ['s-closed', 'check', 'Closed', `Packed up ${esc(job.closedAt || '')}. Kept on record with photos, sign-off and checks.`, ''],
  }[job.status] || ['s-draft', 'info', STATUS[job.status]?.label || '', '', ''];
  return `<div class="status-bar ${M[0]}"><span class="sb-ico">${ic(M[1])}</span><span><b>${M[2]}</b><small>${M[3]}</small></span><div class="sb-actions">${M[4]}</div></div>`;
}

    [`${s.speed}<small>km/h</small>`, 'Speed zone', s.speedSrc],
    [s.tempSpeed ? `${s.tempSpeed}<small>km/h</small>` : 'None', 'Past the work', s.tempSpeed ? 'Temporary limit' : ''],
    [`${s.D}<small>m</small>`, 'Between signs', s.refD],
    s.taper ? [`${s.taper}<small>m</small>`, s.taperLabel, s.refTaper] : [`${s.work.length}<small>m</small>`, 'Work area', ''],

    [`${s.laneLeft.toFixed(1)}<small>m</small>`, 'Lane left open', s.laneLeftOK ? 'OK for traffic' : 'Tight: check'],
  ];
  if (s.queue) kf.push([`${s.queue}<small>m</small>`, 'Expected queue', `${s.vals.queue.T} min stop, AGTTM Table 4.3`], [`${s.shuttle}<small>m</small>`, 'Single lane', s.shuttleLimit ? `max ${s.shuttleLimit} m at ${s.vph} veh/h` : 'over the table']);
  if (s.cones) kf.push([`${s.cones}`, 'Cones on the plan', `take ${Math.ceil(s.cones * 1.1)} with spares`], [`${s.coneT}<small>m</small> · ${s.coneW}<small>m</small>`, 'Cone gaps', 'in tapers · along the work']);

    <section class="diagram panel">

    </section>

      <div class="panel panel-pad stack"><h3>Key numbers</h3><div class="keyfacts">${kf.map(([v, l, src]) => `<div class="keyfact"><b>${v}</b><span>${l}</span>${src ? `<span class="src">${esc(src)}</span>` : ''}</div>`).join('')}</div></div>
      <div class="panel panel-pad stack"><h3>Notes for the crew</h3><ul class="notes">${s.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul></div>
      <div class="panel panel-pad stack"><h3>History</h3><ul class="notes">${(job.history || []).map((h) => `<li><span><b>${esc(h.what)}</b> · ${esc(h.when)}</span></li>`).join('')}</ul></div>
    </aside>
  </div>`;
}
function legendHTML(s) {
  const items = [
    [`<svg viewBox="0 0 30 20"><rect x="2" y="3" width="26" height="14" rx="2" fill="url(#pWork)"/></svg>`, 'Work area'],
    [`<svg viewBox="0 0 30 20"><rect x="2" y="3" width="26" height="14" rx="2" fill="url(#pBuffer)"/></svg>`, 'Safety buffer'],
    [`<svg viewBox="0 0 30 20"><path d="M9 16l4-11h4l4 11z" fill="#FF6A13"/><path d="M11.2 11h7.6" stroke="#fff" stroke-width="1.6"/></svg>`, 'Cone or bollard'],
    [`<svg viewBox="0 0 30 20"><rect x="7" y="2" width="16" height="12" rx="1.5" fill="#FFD200" stroke="#111" stroke-width="1.2"/><path d="M15 14v5" stroke="#6B7580" stroke-width="2"/></svg>`, 'Sign (see list)'],
  ];
  if (s.method === 'stopslow') items.push([`<svg viewBox="0 0 30 20">${tcGlyph(15, 10, 0.72)}</svg>`, 'Traffic controller']);
  if (s.items.some((i) => i.t === 'queue')) items.push([`<svg viewBox="0 0 30 20"><circle cx="15" cy="10" r="7" fill="none" stroke="#3B8FD9" stroke-width="1.4" stroke-dasharray="2 2"/>${coneGlyph(15, 10, 1)}</svg>`, 'End-of-queue cone']);
  if (s.method === 'pts') items.push([`<svg viewBox="0 0 30 20"><rect x="11" y="2" width="8" height="16" rx="2" fill="#111"/><circle cx="15" cy="6.5" r="2" fill="#E3262B"/><circle cx="15" cy="13" r="2" fill="#555"/></svg>`, 'Portable signals']);
  if (s.hasArrow) items.push([`<svg viewBox="0 0 30 20"><rect x="4" y="3" width="22" height="14" rx="2" fill="#111"/><path d="M9 10h11M16 6l4 4-4 4" stroke="#FFC400" stroke-width="2" fill="none"/></svg>`, 'Arrow board']);
  if (s.pedRoute) items.push([`<svg viewBox="0 0 30 20"><rect x="2" y="5" width="26" height="10" rx="2" fill="url(#pPed)"/></svg>`, 'Pedestrian route']);
  items.push([`<svg viewBox="0 0 30 20"><path d="M4 10h19M18 5l5 5-5 5" stroke="#1F6FEB" stroke-width="2.4" fill="none"/></svg>`, 'Traffic direction']);
  return items.map(([g, l]) => `<span class="legend-item">${g}${l}</span>`).join('');
}

  const conePanel = s.coneSections.length ? `
    <section class="panel panel-pad stack cone-panel">

      <p class="muted" style="font-size:14.5px">Gaps are the most a guide allows at ${s.tempSpeed || s.speed} km/h; closer is fine, wider is not. Count them out before you leave the depot.</p>
      <div class="cone-rows">${s.coneSections.map((c) => `
        <div class="cone-row">
          <div class="cr-top"><b>${esc(c.name)}</b><span>${c.length} m long</span></div>
          <div class="cr-strip">${coneStripSVG(c.count, c.gap)}</div>
          <div class="cr-nums"><span><b>${c.count}</b> cones</span><span><b>${c.gap} m</b> apart</span><span class="muted">guide max ${c.max} m</span></div>
        </div>`).join('')}</div>
    </section>` : '';
  return `
  <div class="stack-lg">
    ${conePanel}
    ${groups.map((g) => `
      <section class="sched-group"><h3>${ic(g.icon)}${esc(g.title)}</h3>
        <div class="sched-list">${g.items.map((it) => `
          <div class="sched-item">${signFaceSVG(it.key, 64, 48)}

            <span class="dist">${it.dist != null ? `${it.dist} m` : `×${it.qty}`}<small>${it.dist != null ? esc(it.distLabel || 'before the work') : ''}</small></span>

      </section>`).join('')}
    <section class="panel panel-pad stack"><h3>Load the truck</h3><p class="muted">Everything this TGS uses, with 10% spare cones.</p>
      <div class="loadlist">${s.load.map((l) => `<div class="load">${l.glyph}<span><b>${l.qty}</b><span>${esc(l.name)}</span></span></div>`).join('')}</div>
    </section>
  </div>`;
}

function tabChecks(job, s) {
  const conf = job.confirm || {};
  const list = s.checks.map((c) => ({ ...c, status: conf[c.id] ? 'pass' : c.status }));
  const n = (st) => list.filter((c) => c.status === st).length;
  return `
  <div class="check-sum">
    <div class="s-pass"><b>${n('pass')}</b><span>Passed</span></div>
    <div class="s-todo"><b>${n('todo')}</b><span>Confirm on site</span></div>
    <div class="s-warn"><b>${n('warn')}</b><span>Needs action</span></div>
    <div class="s-fail"><b>${n('fail')}</b><span>Fails</span></div>
  </div>
  <div class="checks">${list.map((c) => `
    <div class="check-item ${c.status}"><span class="ci">${ic(c.status === 'pass' ? 'check' : c.status === 'todo' ? 'eye' : c.status === 'fail' ? 'x' : 'alert')}</span>
      <div><b>${esc(c.title)}</b><p>${esc(c.text)}</p>${c.ref ? `<span class="ref">${esc(c.ref)}</span>` : ''}
      ${c.confirmable && !conf[c.id] ? `<div class="confirm"><button class="btn btn-sm" type="button" data-confirm="${c.id}">${ic('check')}${esc(c.confirmLabel || 'I have checked this on site')}</button></div>` : ''}
      ${conf[c.id] && c.confirmable ? `<p style="color:var(--good);font-weight:700;font-size:13.5px;margin-top:6px">Confirmed on site</p>` : ''}</div>
    </div>`).join('')}</div>`;
}

const riskChip = (L, C, title = '') => { const b = riskBand(L, C); return `<span class="rchip r${b}" ${title ? `title="${esc(title)}"` : ''}>${riskCode(L, C)} ${RISK.bands[b]}</span>`; };
const riskWords = (L, C) => `${RISK.sev[5 - C][1]} (${riskSev(C)}) × ${RISK.lik[5 - L].toLowerCase()} (${riskLik(L)}) = ${riskCode(L, C)} ${RISK.bands[riskBand(L, C)]}`;
/* Controls listed most effective first, each starting with its code (ELIM, SUB, ISOL, ENG, ADM, PPE) */
function ctlList(controls, np = []) {
  return `<ul class="ctl-list">${[...controls].sort((a, b) => LVL_ORDER.indexOf(a.lvl) - LVL_ORDER.indexOf(b.lvl)).map((c) => `<li><span class="code c-${c.lvl}" title="${esc(LEVELS[c.lvl])}">${CODES[c.lvl]}</span><span>${esc(c.text)}</span></li>`).join('')}${np.map((n) => `<li class="np"><span class="code c-${n.lvl}">${CODES[n.lvl]}</span><span>Considered, not practicable: ${esc(n.why)}</span></li>`).join('')}</ul>`;
}
function tabHazards(job, s) {
  const hz = s.hazards;
  const count = (key) => [0, 1, 2, 3].map((b) => hz.filter((h) => h[key] === b).length);
  const before = count('band'), after = count('rBand');
  const cur = state.riskView === 'after' ? after : before;
  const names = RISK.bands;
  const gap = job.input.work.gap || '0-1.2';
  const gapTxt = GAPS.find((g) => g[0] === gap)[1].toLowerCase();
  return `
  <div class="stack-lg">
    <section class="panel panel-pad stack">
      <div class="site-rating r-${s.siteRisk}"><span class="big">${s.siteRisk}</span>
        <div><h3 style="font-size:18px">Site risk rating</h3><p>${s.speed} km/h, TTM Category ${s.category.cat}, work area ${esc(gapTxt)} from moving traffic. ${s.siteRiskWhy ? esc(s.siteRiskWhy) + '. ' : ''}${s.siteRisk === 'High' ? 'A site-specific TGS must be developed (this is one), checked on site by the designer.' : 'A generic TGS could suit a site like this if a TMI confirms it site-suitable; the site-specific draft is still checked by the designer.'}</p></div></div>
      <p class="muted" style="font-size:13px">AGTTM Part 10 Figure 2.3, Table 2.1 and s2.4.4: any risk rated Medium or above before controls raises the site to High.</p>
    </section>
    <div class="risk-top">
      <section class="panel panel-pad stack">
        <div class="row"><h3 style="margin-right:auto">Risk matrix</h3>
          <div class="chips">${[['before', 'Before controls'], ['after', 'After controls']].map(([k, l]) => `<button class="chip" type="button" data-risk="${k}" aria-pressed="${state.riskView === k}">${l}</button>`).join('')}</div></div>
        <div class="matrix">${riskMatrixSVG(hz, state.riskView)}</div>
        <p class="muted" style="font-size:13px">${esc(RISK.note)}</p>
      </section>
      <section class="panel panel-pad stack">
        <h3>${plural(hz.length, 'hazard')} for this site</h3>
        <div class="risk-bands">${[0, 1, 2, 3].map((b) => `<div class="risk-band rb-${b}"><b>${cur[b]}</b>${names[b]}</div>`).join('')}</div>

const tsCrewIds = (job) => { const c = job.input.people.crew || []; return c.length ? c : [ME]; };

function startTimesheets(job) {
  const iso = localISO(), t = hhmmNow(), who = [];
  tsCrewIds(job).forEach((id) => { const days = tsOf(id).days, r = days[iso]; if (!r?.start) { days[iso] = { start: t, finish: '', brk: r?.brk ?? 0, job: job.id }; who.push(id); } });

function endTimesheets(job) {
  const iso = localISO(), t = hhmmNow(), who = [];
  tsCrewIds(job).forEach((id) => { const r = tsOf(id).days[iso]; if (r?.start && !r.finish) { r.finish = t; who.push(id); } });

function swmsState(job, s) {
  const d = job.input, sw = job.swms || {};
  const v = sw.version || 1;
  const crew = crewStatus(d, s);
  const able = crew.filter((x) => x.ok);
  const signedIds = able.filter((x) => sw.signOn?.[x.p.id]?.v === v).map((x) => x.p.id);
  const tcNeed = s.items.filter((it) => it.t === 'tc').length;
  const tcSigned = able.filter((x) => signedIds.includes(x.p.id) && holdsFor(x.p, 'tc', s.category.cat)).length;
  const blockers = [];
  if (!sw.reviewed) blockers.push('review the SWMS on site');
  const left = able.filter((x) => !signedIds.includes(x.p.id));
  if (left.length) blockers.push(`${left.map((x) => x.p.name.split(' ')[0]).join(', ')} to sign on`);
  const cant = crew.filter((x) => !x.ok);
  if (cant.length) blockers.push(`take ${cant.map((x) => x.p.name.split(' ')[0]).join(', ')} off the crew (tickets don't cover this site)`);
  if (tcNeed && tcSigned < tcNeed) blockers.push(`${tcNeed} traffic controllers signed on (${tcSigned} so far)`);
  return { v, crew, able, signed: signedIds.length, total: crew.length, able: able.length, blocked: crew.filter((x) => !x.ok), reviewed: sw.reviewed, ready: !blockers.length, blockers, tcNeed, tcSigned };
}

let padInk = {};
function initPad(id, onInk) {
  const cv = $('#' + id); if (!cv) return;
  padInk[id] = false;
  const ctx = cv.getContext('2d');
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#111';
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ink;
  let drawing = false;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * (cv.width / r.width), (e.clientY - r.top) * (cv.height / r.height)]; };
  cv.onpointerdown = (e) => { drawing = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); };
  cv.onpointermove = (e) => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); if (!padInk[id]) { padInk[id] = true; onInk && onInk(); } };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
}

/* QR codes come from the qrcode-generator library on cdnjs; without it a placeholder shows */
function qrSVG(text) {
  try {
    if (typeof qrcode !== 'function') throw new Error('no qr library');
    const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
    return qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
  } catch (e) {
    return `<div class="qr-none">${ic('qr')}<span>QR code</span></div>`;
  }
}

let sigDrawn = false;
function initSigPad() {
  sigDrawn = false;
  const cv = $('#sigPad'); const ctx = cv.getContext('2d');
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#111';
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = ink;
  let drawing = false;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * (cv.width / r.width), (e.clientY - r.top) * (cv.height / r.height)]; };
  cv.onpointerdown = (e) => { drawing = true; cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); };
  cv.onpointermove = (e) => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); if (!sigDrawn) { sigDrawn = true; updateApprove(); } };
  cv.onpointerup = cv.onpointercancel = () => { drawing = false; };
}
function updateApprove() {
  const ok = $$('.sgn-box').every((b) => b.checked) && sigDrawn;
  const b = $('#btnApprove'); if (b) b.disabled = !ok;
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-open], [data-zone], label.check-item');
  if (!t) return;
  const ds = t.dataset;
  if (ds.go) { if (ds.go === 'new') go('new', { fresh: state.view !== 'new' }); else go(ds.go); return; }
  if (ds.open) { const j = state.jobs.find((x) => x.id === ds.open); if (j?.status === 'draft') openDraft(j); else go('tgs', { id: ds.open }); return; }
  if (ds.filter) { state.filter = ds.filter; render(); return; }
  if (ds.step != null && state.view === 'new') {
    const to = +ds.step;
    if (to > 0 && !state.draft.site.located) { state.step = 0; state.locErr = true; render(); window.scrollTo(0, 0); toast('Set the location first', 'gps'); return; }
    state.step = to; render(); window.scrollTo(0, 0); return;
  }
  if (ds.addrPick) { const [i, n] = ds.addrPick.split(':').map(Number); applyAddress(i, n); return; }
  if (ds.geoPick !== undefined) { const h = state.geo?.hits?.[+ds.geoPick]; if (h) applyLiveAddress(h, state.geo.parsed); return; }
  if (ds.doc) { openDoc(ds.doc); return; }
  if (ds.docEdit) { openEditor(ds.docEdit); return; }
  if (ds.docPdf) { savePdf(ds.docPdf); return; }
  if (ds.openTab) { const [id, tab] = ds.openTab.split(':'); go('tgs', { id, tab }); return; }
  if (state.view === 'timesheet' && tsClick(ds)) return;
  if (ds.signOn) { signOnForm(currentJob(), ds.signOn); return; }
  if (ds.crewOff) {
    const job = currentJob(); const c = job.input.people.crew; const i = c.indexOf(ds.crewOff);
    if (i >= 0) c.splice(i, 1);
    job.history.push({ what: `${personName(ds.crewOff)} taken off the crew (tickets don't cover this site)`, when: nowStamp() });
    save(); render(); toast(`${personName(ds.crewOff).split(' ')[0]} is off the crew for this job`, 'users'); return;
  }
  if (ds.crewAdd) {
    // check their tickets first: someone who can't work this site isn't added to the crew
    const job = currentJob(); job.input.people.crew = job.input.people.crew || [];
    const trial = { ...job.input, people: { ...job.input.people, crew: [...job.input.people.crew, ds.crewAdd] } };
    const x = crewStatus(trial, buildScheme(job.input, job)).find((c) => c.p.id === ds.crewAdd);
    if (!x?.ok) { toast(`${personName(ds.crewAdd).split(' ')[0]} can't work this site: ${x ? x.problems[0] : 'no tickets on record'}`, 'alert'); return; }
    if (!job.input.people.crew.includes(ds.crewAdd)) job.input.people.crew.push(ds.crewAdd);
    save(); render(); signOnForm(job, ds.crewAdd);
    return;
  }
  if (ds.ticket) { const [pid, i] = ds.ticket.split(':'); showTicket(pid, +i); return; }
  if (ds.ticketPerson) { state.ticketPerson = ds.ticketPerson; render(); return; }
  if (ds.prefShuttle) { state.prefs.shuttle = ds.prefShuttle; save(); render(); toast(ds.prefShuttle === 'pts' ? 'New TGSs suggest portable signals where they suit' : ds.prefShuttle === 'stopslow' ? 'New TGSs suggest Stop/Slow controllers' : 'New TGSs follow each state\'s usual practice'); return; }
  if (ds.chgLvl) { $$('button', t.parentElement).forEach((b) => b.setAttribute('aria-pressed', String(b === t))); return; }
  // chip choices inside a form: one per name (data-pick), or several (data-pickm)
  if (ds.pick) {
    $$(`#dlgFormBody [data-pick="${ds.pick}"]`).forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
    if (ds.pick === 'irKind') $('#irHurt').hidden = ds.val !== 'injury';

    updateFormBtn(); return;
  }
  if (ds.pickm) { t.setAttribute('aria-pressed', String(t.getAttribute('aria-pressed') !== 'true')); return; }
  if (ds.irSign) {
    const job = currentJob(); const [id, who] = ds.irSign.split(':'); const r = (job.incidentReports || []).find((x) => x.id === id); if (!r) return;
    if (who === 'manager') signForm('Manager reviews the report', COMPANY_MANAGER.name, (sg) => { r.manager = { name: sg.name, position: COMPANY_MANAGER.position, at: sg.at, signed: true }; save(); render(); toast('Report reviewed and signed', 'sign'); }, 'Your name, position and the time go on the report.');
    else signForm('Injured person signs', r.person?.name || '', (sg) => { r.personSig = { name: sg.name, at: sg.at }; save(); render(); toast('Signed', 'sign'); });
    return;
  }
  if (ds.prefStorage) { state.prefs.storage = ds.prefStorage; save(); render(); toast(`Files go to ${STORAGE[ds.prefStorage]} (demo)`, 'cloud'); return; }
  if (ds.tab) { state.tgsTab = ds.tab; render(); window.scrollTo({ top: 0 }); return; }
  if (ds.risk) { state.riskView = ds.risk; render(); return; }
  if (ds.toggle) { const v = !getPath(state.draft, ds.toggle); setPath(state.draft, ds.toggle, v); touch(ds.toggle); if (ds.toggle.startsWith('road.')) normaliseZone(state.draft); render(); return; }
  if (ds.set) {

    let v = ds.val; if (/^-?\d+(\.\d+)?$/.test(v)) v = Number(v); if (v === 'none') v = null;

    render(); return;
  }
  if (ds.multi) { const arr = getPath(state.draft, ds.multi); const i = arr.indexOf(ds.val); if (i >= 0) arr.splice(i, 1); else arr.push(ds.val); render(); return; }
  if (ds.zone) { toggleZone(state.draft, ds.zone); render(); return; }

  if (ds.setup) {

    if (on && st?.act) {
      const who = st.act === 'tsStart' ? startTimesheets(job) : endTimesheets(job);
      const note = who.length ? `${st.act === 'tsStart' ? 'Started' : 'Ended'} at ${timeNow()} for ${firstNames(who)}` : `Already ${st.act === 'tsStart' ? 'started' : 'ended'} for everyone on the crew`;
      job.setupNotes = { ...(job.setupNotes || {}), [key]: note };

  }

    case 'locate': case 'relocate': locate(); break;
    case 'changeAddr': state.draft.site.located = false; state.addrQ = ''; render(); setTimeout(() => $('#fAddr')?.focus(), 30); break;
    case 'mapZoom': { const s = state.draft.site; s.mapZ = Math.max(15, Math.min(19, (s.mapZ || 18) + Number(ds.dz))); s.viewLat = s.lat; s.viewLng = s.lng; repaintLocation(); break; }

    case 'approve': $('#dlgSign').close(); createTGS(); break;
    case 'finishDraft': openDraft(job); break;
    case 'reviseTGS': reviseTGS(job); break;
    case 'clearZones': state.draft.work.zones = []; state.draft.work.zone = null; normaliseZone(state.draft); render(); break;
    case 'gapAuto': delete state.draft.touched['work.gap']; normaliseZone(state.draft); render(); toast('Back to the edge of the work area'); break;
    case 'startSite': {
      const sw = swmsState(job, buildScheme(job.input, job));
      if (!sw.ready) { state.tgsTab = 'swms'; render(); toast(`Before starting: ${sw.blockers[0]}`, 'lock'); break; }
      job.status = 'live'; job.startedAt = nowStamp(); job.history.push({ what: 'Set out on site', when: job.startedAt });

    case 'newIncident': incidentReportForm(job); break;
    case 'swapDirs': { const st = state.draft.site; st.swapDirs = !st.swapDirs; setTravelNames(st); render(); toast(`${cap(st.dirA)} is now heading ${headingWord(st.headA)} here`, 'refresh'); break; }
    case 'addWorkType': openForm('Add a type of work', `${field('Type of work', `<input class="in" id="fOwnType" data-req-text placeholder="e.g. Kerb and channel repair">`)}<p class="muted" style="font-size:14px">It's added to your company's list for every new TGS.</p>`, 'Add it', () => { const n = $('#fOwnType').value.trim(); state.prefs.workTypes = [...new Set([...(state.prefs.workTypes || []), n])]; const d = state.draft; d.work.types = [...new Set([...workTypes(d), 'own:' + n])]; save(); render(); toast(`${n} added to your types of work`, 'plus'); }, { needAll: true }); break;
    case 'swmsReview': swmsReviewForm(job); break;
    case 'swmsChange': swmsChangeForm(job); break;
    case 'swmsQR': swmsQR(job); break;
    case 'formSubmit': { const f = formSubmit; formSubmit = null; $('#dlgForm').close(); if (f) f(); break; }
    case 'formSigClear': { const cv = $('#formSig'); cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); padInk.formSig = false; updateFormBtn(); break; }
    case 'edClose': edClose(); break;
    case 'edDiscard': edClose(true); break;
    case 'edSave': edSave(); break;
    case 'edReset': edReset(); break;
    case 'addTicket': addTicketForm(state.ticketPerson || ME); break;
    case 'billing': toast('In the real app this opens the Stripe billing page', 'card'); break;
    case 'invite': toast('In the real app this sends an invite by text or email', 'users'); break;
    case 'uploadTemplate': toast('In the real app you pick the Word file and My TGS maps its fields', 'file'); break;
    case 'reset': {
      Object.entries(state.tickets || {}).forEach(([pid, qs]) => { const pp = TEAM.find((x) => x.id === pid); if (pp) pp.quals = pp.quals.filter((q) => !qs.includes(q)); });
      state.jobs = seedJobs(); state.ts = seedTimesheets(state.jobs); state.tickets = {}; state.company = 'Demo Traffic Co'; save(); go('jobs'); toast('Sample jobs restored'); break;
    }
  }
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-open][role="button"]')) { e.preventDefault(); const j = state.jobs.find((x) => x.id === e.target.dataset.open); if (j?.status === 'draft') openDraft(j); else go('tgs', { id: e.target.dataset.open }); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-zone]')) { e.preventDefault(); toggleZone(state.draft, e.target.dataset.zone); render(); const again = $(`[data-zone="${e.target.dataset.zone}"]`); again?.focus(); }
  if (e.key === 'Enter' && e.target.matches('[data-addr]')) {
    e.preventDefault();
    const g = state.geo;
    if (g?.hits?.length && !g.offline) { applyLiveAddress(g.hits[0], g.parsed); return; }
    const hit = addrSearch(e.target.value)[0]; if (hit && (!g || g.offline)) applyAddress(hit.i, hit.n);
  }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.revNote !== undefined) { state.revNote = el.value.trim(); return; }
  if (el.dataset.jobPermit !== undefined) { const job = currentJob(); if (job) { job.input.permit = el.value.trim(); save(); } return; }
  if (el.dataset.company !== undefined) { state.company = el.value || 'Your company'; $('#brandCo').textContent = state.company; save(); return; }
  if (el.dataset.addr !== undefined) { state.addrQ = el.value; geoQuery(el.value); return; }
  if (el.dataset.reqText !== undefined) { updateFormBtn(); return; }
  if (state.view === 'timesheet' && tsInput(el)) return;
  if (el.dataset.bind && state.draft) {
    let v = el.value; if (el.dataset.num !== undefined) v = Number(v);
    setPath(state.draft, el.dataset.bind, v); touch(el.dataset.bind);
    if (el.dataset.out) $('#' + el.dataset.out).textContent = el.dataset.fix ? Number(v).toFixed(+el.dataset.fix) : v;
    if (el.tagName === 'SELECT') render(); else refreshSteps();
  }
});
document.addEventListener('change', (e) => {
  if (state.view === 'timesheet' && e.target.closest('.ts')) setTimeout(() => { if (!document.activeElement?.matches('input, textarea, select')) render(); }, 0);
  if (e.target.dataset.photo) onPhoto(e.target);
  if (e.target.classList.contains('sgn-box')) updateApprove();
  if (e.target.classList.contains('req-box')) updateFormBtn();
  if (e.target.dataset.bind && e.target.type === 'range') render();
});
function touch(path) { const d = state.draft; if (!d) return; d.touched = d.touched || {}; d.touched[path.replace(/^road\./, '')] = true; }

$('#wizBack').addEventListener('click', () => {
  if (state.step === 0) { const was = state.editing; leaveWizard(); go(was ? 'jobs' : 'jobs', { discard: true }); return; }
  state.step--; render(); window.scrollTo(0, 0);
});
$('#wizSave').addEventListener('click', () => {
  if (!draftHasContent(state.draft)) { toast('Nothing to save yet: set the location or fill something in first', 'edit'); return; }
  const job = saveDraft(); leaveWizard(); go('jobs', { discard: true });
  if (job) toast(`${job.number} saved in Drafts`, 'edit');
});
$('#wizNext').addEventListener('click', () => {
  if (state.step === 0 && !state.draft.site.located) { state.locErr = true; render(); toast('Set the location first', 'gps'); return; }
  if (state.step < STEPS.length - 1) { state.step++; render(); window.scrollTo(0, 0); } else approveTGS();
});
$('#themeBtn').addEventListener('click', cycleTheme);
$$('dialog').forEach((d) => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));
$('#dlgTicket').addEventListener('close', () => clearInterval(ticketTimer));

let resizeT = 0;
function pickOrient() { return window.matchMedia('(min-width: 760px)').matches ? 'h' : 'v'; }
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { const o = pickOrient(); if (o !== state.orient) { state.orient = o; if (state.view === 'tgs') render(); } }, 150); });

/* ---------- Start ---------- */
try {
  document.fonts?.load('900 16px Overpass').then(() => {
    const busy = document.activeElement && document.activeElement.matches('input, textarea, select');
    if (!busy && !document.querySelector('dialog[open]')) render();
  });
} catch (e) { /* no font loading API: the default metrics are close enough */ }
load();
initEditor();
state.orient = pickOrient();
applyTheme();
const startHash = (location.hash || '').replace('#', '');
if (startHash === 'new') go('new', { fresh: true });
else if (startHash === 'company') go('company');
else if (startHash === 'tickets') go('tickets');
else if (startHash === 'timesheet') go('timesheet');
else render();
</script>

</body>
</html>
