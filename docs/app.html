        const ang = Math.atan2(y1 - y0, x1 - x0);
        const hx = x1 - 6 * Math.cos(ang), hy = y1 - 6 * Math.sin(ang);
        out.push(`<g stroke="#8FB8FF" stroke-width="2.6" fill="none" stroke-linecap="round" opacity=".95"><line x1="${r1(x0)}" y1="${r1(y0)}" x2="${r1(hx)}" y2="${r1(hy)}"/><path d="M${r1(hx + 5 * Math.cos(ang + 2.4))} ${r1(hy + 5 * Math.sin(ang + 2.4))} L${r1(x1)} ${r1(y1)} L${r1(hx + 5 * Math.cos(ang - 2.4))} ${r1(hy + 5 * Math.sin(ang - 2.4))}"/></g>`);
      });
    });
  }
  // devices
  s.items.filter((it) => it.t === 'arrowboard').forEach((a) => {
    const [x, y] = P(a.s, a.y);
    const rot = V ? -90 : 0;
    const flip = a.dir === 'B' ? 180 : 0;
    out.push(compact ? `<rect x="${r1(x - 3)}" y="${r1(y - 2)}" width="6" height="4" fill="#111"/>` : `<g transform="translate(${r1(x)} ${r1(y)})"><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#111" stroke="#FFC400" stroke-width="1"/><path d="M-6 0 H5 M1 -4 L5 0 L1 4" stroke="#FFC400" stroke-width="2" fill="none" transform="rotate(${rot + flip})"/></g>`);
  });
  s.items.filter((it) => it.t === 'hm').forEach((m) => {
    if (m.s < minS - 2 || m.s > maxS + 2) return;
    const [x, y] = P(m.s, m.y), [x2, y2] = P(m.s, m.y + (m.pt || 1));
    const rot = Math.round(Math.atan2(y2 - y, x2 - x) * 180 / Math.PI); // chevrons point the way traffic is pushed
    out.push(compact ? `<rect x="${r1(x - 1.2)}" y="${r1(y - 1.8)}" width="2.4" height="3.6" fill="#FFD200" stroke="#111" stroke-width=".4"/>` : `<g transform="translate(${r1(x)} ${r1(y)}) rotate(${rot})"><rect x="-4" y="-6.5" width="8" height="13" rx="1" fill="#FFD200" stroke="#111" stroke-width="1"/><path d="M-1.6 -5 L1.6 -2.2 L-1.6 0.6 M-1.6 0.4 L1.6 3.2 L-1.6 6" fill="none" stroke="#111" stroke-width="1.4" transform="translate(0 -0.5)"/></g>`);
  });
  s.items.filter((it) => it.t === 'pts').forEach((a) => { const [x, y] = P(a.s, a.y); out.push(compact ? `<rect x="${r1(x - 2)}" y="${r1(y - 3)}" width="4" height="6" fill="#111"/>` : `<g transform="translate(${r1(x)} ${r1(y)})"><rect x="-6" y="-11" width="12" height="22" rx="3" fill="#111" stroke="#fff" stroke-width="1"/><circle cy="-5" r="3.2" fill="#E3262B"/><circle cy="4" r="3.2" fill="#4A4A4A"/></g>`); });
  s.items.filter((it) => it.t === 'tma').forEach((a) => { const [x, y] = P(a.s, a.y); if (!compact) out.push(truckGlyph(x, y, 28, 16, V, '#FFD200')); });
  s.items.filter((it) => it.t === 'queue').forEach((q) => { if (q.s < minS || q.s > maxS) return; const [x, y] = P(q.s, q.y); out.push(compact ? `<circle cx="${r1(x)}" cy="${r1(y)}" r="1.6" fill="#3B8FD9"/>` : `<circle cx="${r1(x)}" cy="${r1(y)}" r="7" fill="none" stroke="#3B8FD9" stroke-width="1.6" stroke-dasharray="2 2"/>${coneGlyph(x, y, 1.1)}`); });
  s.items.filter((it) => it.t === 'tc').forEach((t) => { const [x, y] = P(t.s, t.y); out.push(compact ? `<circle cx="${r1(x)}" cy="${r1(y)}" r="3.2" fill="#FF6A13" stroke="#fff" stroke-width="1"/>` : tcGlyph(x, y, hero ? 0.8 : 0.95)); });

  // signs and labels
  const signs = s.items.filter((it) => it.t === 'sign' && it.s >= minS - 1 && it.s <= maxS + 1);
  if (compact) {
    signs.forEach((sg) => {
      const [x, y] = P(sg.s, sg.y);
      if (highlight === sg.id) out.push(`<circle class="pulse" cx="${r1(x)}" cy="${r1(y)}" r="9" fill="none" stroke="#FF5A14" stroke-width="2.4"/><circle cx="${r1(x)}" cy="${r1(y)}" r="4.5" fill="#FF5A14"/>`);
      out.push(`<rect x="${r1(x - 2.6)}" y="${r1(y - 2.6)}" width="5.2" height="5.2" transform="rotate(45 ${r1(x)} ${r1(y)})" fill="#FFD200" stroke="#111" stroke-width=".7"/>`);
    });
    const hc = s.items.find((it) => it.t === 'cones' && it.id === highlight);
    if (hc) { const m = hc.pts[Math.floor(hc.pts.length / 2)]; const [x, y] = P(m[0], m[1]); out.push(`<circle class="pulse" cx="${r1(x)}" cy="${r1(y)}" r="11" fill="none" stroke="#FF5A14" stroke-width="2.4"/>`); }
  } else if (hero) {
    signs.forEach((sg) => { const [x, y] = P(sg.s, sg.y); const fm = faceMarkup(sg.code); const w = fm.wide ? 34 : 26, h = w * fm.h / 64; out.push(`<g transform="translate(${r1(x - w / 2)} ${r1(y - h / 2)}) scale(${r1(w / 64 * 1000) / 1000})">${fm.svg}</g>`); });
    s.items.filter((it) => it.t === 'area' && it.label && it.kind === 'work').forEach((a) => {
      const [cx, cy] = P((a.s0 + a.s1) / 2, (a.y0 + a.y1) / 2);
      const tw = a.label.length * 5.9 + 12;
      out.push(`<g transform="translate(${r1(cx)} ${r1(cy)})"><rect x="${r1(-tw / 2)}" y="-8.5" width="${r1(tw)}" height="17" rx="5" fill="var(--d-label-bg)" stroke="${areaStroke(a.kind)}" stroke-width="1"/><text y="3.8" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--d-ink)">${esc(a.label)}</text></g>`);
    });
  } else {
    out.push(...callouts(s, L, signs, highlight));
  }
  if (!compact && !hero) { if (!V) out.push(...rulerSVG(s, L)); out.push(northArrow(s, L)); }
  const title = `${s.methodName} at ${s.speed} km/h`;
  return `<svg class="dg ${idPrefix}" viewBox="0 0 ${r1(W)} ${r1(H)}" width="${r1(W)}" height="${r1(H)}" style="max-width:100%;height:auto" role="img" aria-label="${esc(title)}">${out.join('')}</svg>`;
}

/* Callouts: sign faces with their distance and code, and the work area and
   buffer names, set out in the columns (or bands) beside the road so they
   never cover a lane. */
function callouts(s, L, signs, highlight) {
  const { V, W, P, road0, roadPx } = L;
  const out = [];
  const faceW = V ? 40 : 46, faceH = V ? 30 : 34;
  const tot = L.G.total;
  const list = [];
  signs.forEach((sg) => list.push({ kind: 'sign', side: sg.side, pt: P(sg.s, sg.y), sg }));
  s.items.filter((it) => it.t === 'area' && it.label).forEach((a) => {
    const side = (a.y0 + a.y1) / 2 < tot / 2 ? 'A' : 'B';
    const mid = (a.s0 + a.s1) / 2;
    list.push({ kind: 'area', side, pt: P(mid, side === 'A' ? a.y0 : a.y1), a });
  });
  // end-of-queue marker cones
  s.items.filter((it) => it.t === 'queue').forEach((q) => list.push({ kind: 'area', side: q.side, pt: P(q.s, q.y), a: { kind: 'queue', label: `QUEUE ${q.len} m`, sub: 'marker cone' } }));
  // tapers get a callout too, so their cone count and gap sit clear of the cones
  s.items.filter((it) => it.t === 'cones' && it.label).forEach((c) => {
    const mid = c.pts[Math.floor(c.pts.length / 2)];
    const side = mid[1] < tot / 2 ? 'A' : 'B';
    list.push({ kind: 'area', side, pt: P(mid[0], mid[1]), a: { kind: 'taper', label: c.label, sub: c.sub } });
  });
  ['A', 'B'].forEach((side) => {
    const mine = list.filter((o) => o.side === side);
    if (V) {
      mine.sort((a, b) => a.pt[1] - b.pt[1]);
      let lastBottom = -1e9;
      mine.forEach((o) => {
        const fm = o.kind === 'sign' ? faceMarkup(o.sg.code) : null;
        const h = o.kind === 'sign' ? (fm.wide ? 30 : faceH) + 30 : o.a.sub ? 46 : 34;
        o.ly = Math.max(o.pt[1], lastBottom + h / 2 + 6);
        lastBottom = o.ly + h / 2;
      });
    } else {
      // name labels sit in two rows next to the road, sign faces in two rows beyond them;
      // a label that fits in neither row slides along with a leader line
      mine.sort((a, b) => a.pt[0] - b.pt[0]);
      const ends = { sign: [-1e9, -1e9], area: [-1e9, -1e9] };
      mine.forEach((o) => {
        const txt = o.kind === 'sign' ? '' : `${o.a.label}${o.a.sub ? ' · ' + o.a.sub : ''}`;
        const fwide = o.kind === 'sign' && faceMarkup(o.sg.code).wide;
        // a sign's width includes its distance and code text beside the face
        const textW = o.kind === 'sign' ? Math.max(46, `${o.sg.dist ?? ''} m`.length * 7.4, (SIGNS[o.sg.code]?.code || '').length * 5.3) + 8 : 0;
        o.w = o.kind === 'sign' ? (fwide ? 64 : faceW) + textW : txt.length * 6.1 + 12;
        const start = o.kind === 'sign' ? o.pt[0] - (fwide ? 32 : faceW / 2) : o.pt[0] - o.w / 2;
        const e = ends[o.kind === 'sign' ? 'sign' : 'area'];
        let row = e.findIndex((x) => start >= x + 8);
        if (row < 0) row = e.indexOf(Math.min(...e));
        o.row = row;
        o.x0 = Math.max(start, e[row] + 8);
        e[row] = o.x0 + o.w;
      });
    }
    mine.forEach((o) => {
      const colX = side === 'A' ? road0 / 2 : road0 + roadPx + (W - road0 - roadPx) / 2;
      const hl = o.kind === 'sign' && highlight === o.sg.id ? ' class="hl"' : '';
      if (o.kind === 'sign') {
        const fm = faceMarkup(o.sg.code);
        const fw = fm.wide ? (V ? 60 : 64) : faceW, fh = fm.wide ? fw * fm.h / fm.w : faceH;
        const code = esc(SIGNS[o.sg.code]?.code || '');
        const dist = o.sg.dist != null ? `${o.sg.dist} m` : '';
        const sc = `scale(${r1(fw / 64 * 1000) / 1000} ${r1(fh / fm.h * 1000) / 1000})`;
        // a sign duplicated on the other side of the road (AGTTM Part 3 s2.5.3.2) carries a x2 badge
        const dupB = (bx, by) => (o.sg.dup ? `<g aria-label="Both sides"><circle cx="${r1(bx)}" cy="${r1(by)}" r="8" fill="#1F6FEB" stroke="#fff" stroke-width="1.6"/>${inkText('×2', bx, by, 8.4, 'fill="#fff"')}</g>` : '');
        if (V) {
          const cy = o.ly - 8;
          const edgeX = side === 'A' ? colX + fw / 2 : colX - fw / 2;
          out.push(`<g${hl}><path d="M${r1(o.pt[0])} ${r1(o.pt[1])} L${r1(edgeX)} ${r1(cy)}" stroke="var(--d-dimline)" stroke-width="1.1" stroke-dasharray="3 2" fill="none"/><circle cx="${r1(o.pt[0])}" cy="${r1(o.pt[1])}" r="3.2" fill="#111" stroke="#FFD200" stroke-width="1.6"/>
            <g transform="translate(${r1(colX - fw / 2)} ${r1(cy - fh / 2)}) ${sc}">${fm.svg}</g>${dupB(colX + fw / 2 - 1, cy - fh / 2 + 1)}
            <text x="${r1(colX)}" y="${r1(cy + fh / 2 + 13)}" text-anchor="middle" class="t-dist" font-size="13" fill="var(--d-ink)">${dist}</text>
            ${code ? `<text x="${r1(colX)}" y="${r1(cy + fh / 2 + 24)}" text-anchor="middle" class="t-code" font-size="9" fill="var(--d-dim)">${code}</text>` : ''}</g>`);
        } else {
          const up = side === 'A';
          const rowOff = 36 + o.row * (faceH + 6);
          const fy = up ? road0 - 10 - fh - rowOff : road0 + roadPx + 10 + rowOff;
          const cx = o.x0 + fw / 2;
          out.push(`<g${hl}><path d="M${r1(o.pt[0])} ${r1(o.pt[1])} L${r1(cx)} ${r1(up ? fy + fh : fy)}" stroke="var(--d-dimline)" stroke-width="1.1" stroke-dasharray="3 2"/><circle cx="${r1(o.pt[0])}" cy="${r1(o.pt[1])}" r="3.2" fill="#111" stroke="#FFD200" stroke-width="1.6"/>
            <g transform="translate(${r1(cx - fw / 2)} ${r1(fy)}) ${sc}">${fm.svg}</g>${dupB(cx + fw / 2 - 1, fy + 1)}
            <text x="${r1(cx + fw / 2 + 5)}" y="${r1(fy + fh / 2 + 2)}" class="t-dist" font-size="13" fill="var(--d-ink)">${dist}</text>
            ${code ? `<text x="${r1(cx + fw / 2 + 5)}" y="${r1(fy + fh / 2 + 14)}" class="t-code" font-size="9" fill="var(--d-dim)">${code}</text>` : ''}</g>`);
        }
      } else {
        const a = o.a;
        const [name, len] = a.label.split(/ (?=\d)/);
        const col = a.kind === 'work' ? 'var(--hv-ink)' : a.kind === 'buffer' ? 'var(--warn)' : a.kind === 'taper' ? '#E0520A' : a.kind === 'queue' ? '#3B8FD9' : 'var(--info)';
        if (V) {
          const edgeX = side === 'A' ? colX + 26 : colX - 26;
          out.push(`<path d="M${r1(o.pt[0])} ${r1(o.pt[1])} L${r1(edgeX)} ${r1(o.ly)}" stroke="${col}" stroke-width="1.2" fill="none"/><circle cx="${r1(o.pt[0])}" cy="${r1(o.pt[1])}" r="2.4" fill="${col}"/>
            <text x="${r1(colX)}" y="${r1(o.ly - 2)}" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing=".4" fill="${col}">${esc(name)}</text>
            <text x="${r1(colX)}" y="${r1(o.ly + 12)}" text-anchor="middle" class="t-dist" font-size="13" fill="var(--d-ink)">${esc(len || '')}</text>
            ${a.sub ? `<text x="${r1(colX)}" y="${r1(o.ly + 24)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#E0520A">${esc(a.sub)}</text>` : ''}`);
        } else {
          const up = side === 'A';
          const rowOff = o.row * 17;
          const ty = up ? road0 - 12 - rowOff : road0 + roadPx + 22 + rowOff;
          const tx = o.x0 + o.w / 2;
          out.push(`<path d="M${r1(o.pt[0])} ${r1(o.pt[1])} L${r1(tx)} ${r1(up ? ty + 4 : ty - 11)}" stroke="${col}" stroke-width="1.2" fill="none"/><circle cx="${r1(o.pt[0])}" cy="${r1(o.pt[1])}" r="2.4" fill="${col}"/>
            <text x="${r1(tx)}" y="${r1(ty)}" text-anchor="middle" font-size="11" font-weight="800" letter-spacing=".4" fill="${col}" paint-order="stroke" stroke="var(--d-bg)" stroke-width="3">${esc(name)} <tspan class="t-dist" fill="var(--d-ink)" font-size="12.5">${esc(len || '')}</tspan>${a.sub ? `<tspan font-size="10" fill="#E0520A"> · ${esc(a.sub)}</tspan>` : ''}</text>`);
        }
      }
    });
  });
  return out;
}

function rulerSVG(s, L) {
  const { W, H, P } = L;
  const out = [];
  const step = L.span > 700 ? 100 : 50;
  const first = Math.ceil(L.ext.min / step) * step;
  for (let sv = first; sv <= L.ext.max; sv += step) {
    const [x] = P(sv, 0);
    out.push(`<line x1="${r1(x)}" y1="${H - 12}" x2="${r1(x)}" y2="${H - 4}" stroke="var(--d-dimline)" stroke-width="1"/><text x="${r1(x)}" y="${H - 16}" text-anchor="middle" font-size="9" class="t-code" fill="var(--d-dim)">${sv}</text>`);
  }
  out.push(`<text x="${W - 40}" y="${H - 26}" text-anchor="end" font-size="9.5" font-weight="700" fill="var(--d-dim)">metres from the start of the work area</text>`);
  return out;
}
function northArrow(s, L) {
  const { V, W } = L;
  const rot = s.geo.northRot || 0; // direction A's heading in degrees clockwise from north
  const x = W - 22, y = 24;
  return `<g transform="translate(${x} ${y})"><circle r="13" fill="var(--d-label-bg)" stroke="var(--d-dimline)" stroke-width="1"/><g transform="rotate(${V ? -rot : 90 - rot})"><path d="M0 -9 L5 5 L0 2 L-5 5 Z" fill="var(--d-ink)"/></g></g><text x="${x}" y="${y + 25}" text-anchor="middle" font-size="9.5" font-weight="800" fill="var(--d-dim)">N</text>`;
}

function thumbSVG(s, opts = {}) {
  const svg = schemeSVG(s, { orient: 'h', mode: opts.big ? 'hero' : 'compact', idPrefix: 'th' });
  return svg;
}

/* A row of cones for the gear list: one per cone (up to 26), with the gap marked */
function coneStripSVG(n, gap) {
  const show = Math.min(n, 18), step = 17, W = show * step + (n > show ? 34 : 6), H = 42;
  let g = '';
  for (let i = 0; i < show; i++) g += coneGlyph(10 + i * step, 15, 1.75);
  if (n > show) g += `<text x="${show * step + 8}" y="20" font-size="12" font-weight="800" fill="var(--muted)">+${n - show}</text>`;
  if (show > 1) g += `<path d="M10 31 V37 M${10 + step} 31 V37 M10 34 H${10 + step}" stroke="#E0520A" stroke-width="1.4"/><text x="${10 + step + 6}" y="38" font-size="10.5" font-weight="800" fill="#E0520A">${gap} m</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;height:auto" aria-hidden="true">${g}</svg>`;
}

/* ---------- Small illustrations for the form ---------- */
function layoutArt(v) {
  const lanes = { '2L2W': ['A', 'B'], '4L2W': ['A', 'A', 'B', 'B'], DIV: ['A', 'A', 'M', 'B', 'B'], '1W': ['A', 'A'] }[v];
  const W = 150, H = 64, lw = v === '2L2W' || v === '1W' ? 34 : 24;
  const tot = lanes.reduce((a, l) => a + (l === 'M' ? 12 : lw), 0);
  let x = (W - tot) / 2;
  const parts = [`<rect width="${W}" height="${H}" fill="var(--d-bg)"/><rect x="${(W - tot) / 2 - 12}" y="0" width="12" height="${H}" fill="var(--d-foot)"/><rect x="${(W + tot) / 2}" y="0" width="12" height="${H}" fill="var(--d-foot)"/>`];
  lanes.forEach((l, i) => {
    const w = l === 'M' ? 12 : lw;
    parts.push(`<rect x="${x}" y="0" width="${w}" height="${H}" fill="${l === 'M' ? 'var(--d-nature)' : 'var(--d-asphalt)'}"/>`);
    if (l !== 'M') {
      const cx = x + w / 2, up = l === 'A';
      parts.push(`<path d="M${cx} ${up ? 44 : 20} L${cx} ${up ? 22 : 42} M${cx - 5} ${up ? 28 : 36} L${cx} ${up ? 21 : 43} L${cx + 5} ${up ? 28 : 36}" stroke="#8FB8FF" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`);
    }
    const nx = lanes[i + 1];
    if (nx && l !== 'M' && nx !== 'M') parts.push(`<line x1="${x + w}" y1="0" x2="${x + w}" y2="${H}" stroke="#fff" stroke-width="1.5" stroke-dasharray="${l === nx ? '6 5' : '10 4'}"/>`);
    x += w;
  });
  return `<svg class="pick-art" viewBox="0 0 ${W} ${H}" aria-hidden="true">${parts.join('')}</svg>`;
}
function methodArt(id) {
  const W = 92, H = 60;
  const road = `<rect width="${W}" height="${H}" fill="var(--d-bg)"/><rect x="0" y="12" width="${W}" height="36" fill="var(--d-asphalt)"/><line x1="0" y1="30" x2="${W}" y2="30" stroke="#fff" stroke-width="1.4" stroke-dasharray="7 5"/>`;
  const cone = (x, y) => `<circle cx="${x}" cy="${y}" r="2" fill="#FF6A13"/>`;
  const work = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="url(#pWork)" stroke="#B83A00"/>`;
  let body = '';
  if (id === 'stopslow' || id === 'pts') {
    body = work(48, 31, 22, 16) + [0, 1, 2, 3, 4].map((i) => cone(28 + i * 5, 46 - i * 3.6)).join('') + [0, 1, 2, 3].map((i) => cone(48 + i * 7, 30.5)).join('');
    body += id === 'stopslow' ? `${tcGlyph(18, 52, 0.42)}${tcGlyph(80, 8, 0.42)}` : `<rect x="15" y="44" width="6" height="12" rx="1.5" fill="#111"/><circle cx="18" cy="48" r="1.8" fill="#E3262B"/><rect x="77" y="4" width="6" height="12" rx="1.5" fill="#111"/><circle cx="80" cy="8" r="1.8" fill="#E3262B"/>`;
  } else if (id === 'merge') {
    body = `<line x1="0" y1="21" x2="${W}" y2="21" stroke="#fff" stroke-width="1" stroke-dasharray="4 4"/><line x1="0" y1="39" x2="${W}" y2="39" stroke="#fff" stroke-width="1" stroke-dasharray="4 4"/>` + work(52, 40, 26, 8) + [0, 1, 2, 3, 4, 5].map((i) => cone(20 + i * 6, 47.5 - i * 1.4)).join('') + `<rect x="12" y="41" width="9" height="6" rx="1" fill="#111"/><path d="M14 44h5M17 42l2 2-2 2" stroke="#FFC400" stroke-width="1.1" fill="none"/>`;
  } else if (id === 'shoulder') {
    body = `<rect x="0" y="40" width="${W}" height="8" fill="rgba(255,255,255,.08)"/><line x1="0" y1="40" x2="${W}" y2="40" stroke="#fff" stroke-width="1"/>` + work(46, 41, 26, 6) + [0, 1, 2, 3].map((i) => cone(26 + i * 5, 47 - i * 1.6)).join('') + [0, 1, 2, 3, 4].map((i) => cone(46 + i * 6.5, 40)).join('');
  } else if (id === 'footpath') {
    body = `<rect x="0" y="48" width="${W}" height="12" fill="var(--d-foot)"/><rect x="0" y="0" width="${W}" height="12" fill="var(--d-foot)"/>` + work(34, 49, 26, 10) + `<line x1="30" y1="48.5" x2="64" y2="48.5" stroke="#1F6FEB" stroke-width="2"/><path d="M20 54 C 24 40, 26 26, 30 8" stroke="#1F6FEB" stroke-width="1.6" fill="none" stroke-dasharray="3 2"/>`;
  } else if (id === 'closure') {
    body = `<rect x="38" y="12" width="4" height="36" fill="url(#pBarrier)"/><path d="M30 20 C 18 20, 14 10, 14 2" stroke="#1F6FEB" stroke-width="2" fill="none"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${road}${body}</svg>`;
}

/* Cross-section picker: tap the part of the road the work takes up */
function xsecSVG(d) {
  const zones = crossSection(d);
  const W = 380, H = 150, top = 30, bot = 112;
  const px = { foot: 40, park: 42, bike: 26, lane: zones.filter((z) => z.kind === 'lane').length > 2 ? 50 : 70, median: 22 };
  const tot = zones.reduce((a, z) => a + px[z.kind], 0);
  const k = Math.min(1, (W - 12) / tot);
  let x = (W - tot * k) / 2;
  const parts = [`<rect width="${W}" height="${H}" fill="var(--d-bg)"/>`];
  const blocks = workBlocks(d), blocked = !!workBlocked(d);
  const selIds = new Set(blocks.flat().map((z) => z.id));
  const zx = {};
  zones.forEach((z) => {
    const w = px[z.kind] * k;
    const sel = selIds.has(z.id);
    zx[z.id] = [x, x + w];
    const base = z.kind === 'foot' ? 'var(--d-foot)' : z.kind === 'median' ? 'var(--d-nature)' : z.kind === 'bike' ? '#2F6B4A' : 'var(--d-asphalt)';
    const hit = z.kind !== 'median';
    parts.push(`<g class="${hit ? 'zone' : ''}" ${hit ? `data-zone="${z.id}" role="button" tabindex="0" aria-label="${esc(z.label)}" aria-pressed="${sel}"` : ''}>
      <rect x="${r1(x)}" y="${top}" width="${r1(w)}" height="${bot - top}" fill="${base}"/>
      <rect class="zone-hit" x="${r1(x)}" y="${top}" width="${r1(w)}" height="${bot - top}" fill="transparent"/>
      ${z.kind === 'lane' && !sel ? `<path d="M${r1(x + w / 2)} ${z.dir === 'A' ? 88 : 54} L${r1(x + w / 2)} ${z.dir === 'A' ? 56 : 86} M${r1(x + w / 2 - 6)} ${z.dir === 'A' ? 63 : 79} L${r1(x + w / 2)} ${z.dir === 'A' ? 55 : 87} L${r1(x + w / 2 + 6)} ${z.dir === 'A' ? 63 : 79}" stroke="#8FB8FF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/>` : ''}
      ${z.kind === 'park' && !sel ? `<rect x="${r1(x + w / 2 - 8)}" y="58" width="16" height="26" rx="4" fill="#9AA6B2" pointer-events="none"/>` : ''}
      ${z.kind === 'foot' && !sel ? symbolSVG('ped', x + w / 2, 71, 'var(--d-dim)', 0.9).replace('<g ', '<g pointer-events="none" ') : ''}
      <text x="${r1(x + w / 2)}" y="${bot + 16}" text-anchor="middle" font-size="${w < 36 ? 9 : 11}" font-weight="700" fill="${sel ? 'var(--hv-ink)' : 'var(--d-dim)'}" pointer-events="none">${esc(z.short)}</text>
    </g>`);
    x += w;
  });
  // line marking between lanes
  x = (W - tot * k) / 2;
  zones.forEach((z, i) => {
    const w = px[z.kind] * k; x += w;
    const nx = zones[i + 1];
    if (nx && z.kind === 'lane' && nx.kind === 'lane') parts.push(`<line x1="${r1(x)}" y1="${top}" x2="${r1(x)}" y2="${bot}" stroke="#fff" stroke-width="2" stroke-dasharray="${z.dir === nx.dir ? '6 6' : '12 5'}" pointer-events="none"/>`);
    if (nx && ((z.kind === 'foot') !== (nx.kind === 'foot'))) parts.push(`<line x1="${r1(x)}" y1="${top}" x2="${r1(x)}" y2="${bot}" stroke="var(--d-kerb)" stroke-width="2.5" pointer-events="none"/>`);
  });
  // each work area as one block over the strips it takes (drawn on top, clicks pass through to the strips)
  blocks.forEach((b) => {
    const x0 = zx[b[0].id][0], x1 = zx[b[b.length - 1].id][1];
    parts.push(`<rect x="${r1(x0 + 2)}" y="${top + 2}" width="${r1(x1 - x0 - 4)}" height="${bot - top - 4}" rx="5" fill="url(#pWork)" stroke="${blocked ? '#C4271D' : '#B83A00'}" stroke-width="${blocked ? 2.5 : 1.5}" ${blocked ? 'stroke-dasharray="6 3"' : ''} pointer-events="none"/>`);
  });
  const A = d.site.dirA || 'northbound', B = d.site.dirB || 'southbound';
  parts.push(`<text x="10" y="18" font-size="11.5" font-weight="800" fill="var(--d-dim)">${esc(A.toUpperCase())} ↑</text><text x="${W - 10}" y="18" text-anchor="end" font-size="11.5" font-weight="800" fill="var(--d-dim)">↓ ${esc(B.toUpperCase())}</text>`);
  return `<svg class="xsec-svg" viewBox="0 0 ${W} ${H}" role="group" aria-label="Road cross-section. Tap where the work is.">${parts.join('')}</svg>`;
}

/* Street sketch around the site for the location step, 2 px to the metre, drawn from the
   road's cross-section. East-west streets run across with side A (the first direction's
   lanes) at the top; north-south streets run up the page with side A on the left. The
   address lot is marked; the work-area pin is an HTML element over the map so it can be
   dragged (app.js). The real app draws this on the Vicmap basemap and aerial photos. */
const MAP = { W: 640, H: 300, k: 2, lot: 15 };
/* a and c in map px: along the street (+ north or east of the address) and across it; v = where the map is centred along the street */
function mapXY(axis, a, c, v = 0) { return axis === 'ns' ? [MAP.W / 2 + c, MAP.H / 2 - (a - v)] : [MAP.W / 2 + (a - v), MAP.H / 2 + c]; }
function mapGeom(d) {
  const zs = crossSection(d);
  const tot = zs[zs.length - 1].y1;
  const lanes = zs.filter((z) => z.kind === 'lane');
  const num = parseInt(String(d.site.number || '').split('/').pop(), 10) || 0; // the street number of "1/7"
  const side = num % 2 ? 'A' : 'B';
  const lane = side === 'A' ? lanes[0] : lanes[lanes.length - 1];
  return { zs, tot, side, laneC: ((lane.y0 + lane.y1) / 2 - tot / 2), edge: tot / 2 };
}
function siteMapSVG(d) {
  const s = d.site, axis = s.axis || 'ns', k = MAP.k, W = MAP.W, H = MAP.H;
  const G = mapGeom(d);
  const C = (ym) => (ym - G.tot / 2) * k;
  const v = (s.viewA || 0) * k; // the map follows the pin along the street
  const halfA = (axis === 'ns' ? H : W) / 2 + 4, halfC = (axis === 'ns' ? W : H) / 2 + 4;
  const R = (a0, a1, c0, c1, attrs) => {
    const [x0, y0] = mapXY(axis, a0, c0, v), [x1, y1] = mapXY(axis, a1, c1, v);
    return `<rect x="${r1(Math.min(x0, x1))}" y="${r1(Math.min(y0, y1))}" width="${r1(Math.abs(x1 - x0))}" height="${r1(Math.abs(y1 - y0))}" ${attrs}/>`;
  };
  const Ln = (a0, c0, a1, c1, attrs) => { const [x0, y0] = mapXY(axis, a0, c0, v), [x1, y1] = mapXY(axis, a1, c1, v); return `<line x1="${r1(x0)}" y1="${r1(y0)}" x2="${r1(x1)}" y2="${r1(y1)}" ${attrs}/>`; };
  const A0 = v - halfA, A1 = v + halfA;
  const out = [`<rect width="${W}" height="${H}" fill="var(--d-bg)"/>`];
  const edge = G.edge * k, verge = 3 * k, lotDepth = 34 * k, lotW = MAP.lot * k;
  // house lots on both sides out to the edge of the map (back-to-back rows, then a parallel street); the address lot highlighted
  [-1, 1].forEach((sg) => {
    out.push(R(A0, A1, sg * edge, sg * (edge + verge), 'fill="var(--d-nature)" opacity=".75"'));
    let c = edge + verge, row = 0;
    while (c < halfC + 4) {
      if (row % 3 === 2) { out.push(R(A0, A1, sg * (c + 2), sg * (c + 2 + 11 * k), 'fill="var(--d-asphalt)" opacity=".7"')); c += 15 * k; row++; continue; }
      const front = row % 3 === 0 ? c : c + lotDepth; // back row faces the other way
      for (let i = Math.floor(A0 / lotW) - 1; i <= Math.ceil(A1 / lotW) + 1; i++) {
        const a0 = (i - 0.5) * lotW + (row % 3 === 1 ? lotW / 2 : 0), a1 = a0 + lotW;
        const mine = row === 0 && i === 0 && (sg < 0) === (G.side === 'A');
        out.push(R(a0 + 1.5, a1 - 1.5, sg * (c + 2), sg * (c + lotDepth), `fill="${mine ? 'var(--hv-soft)' : 'var(--map-lot)'}" ${mine ? 'stroke="var(--hv)" stroke-width="2"' : ''} rx="3"`));
        const h0 = row % 3 === 0 ? front + 12 : front - 34, h1 = h0 + 22;
        out.push(R(a0 + 7, a1 - 7, sg * h0, sg * h1, `fill="${mine ? 'var(--hv)' : 'var(--map-house)'}" ${mine ? 'opacity=".55"' : ''} rx="2"`));
      }
      c += lotDepth + 2; row++;
    }
  });
  // the road, strip by strip
  G.zs.forEach((z) => {
    const fill = z.kind === 'foot' ? 'var(--d-foot)' : z.kind === 'median' ? 'var(--d-nature)' : z.kind === 'bike' ? '#2F6B4A' : 'var(--d-asphalt)';
    out.push(R(A0, A1, C(z.y0), C(z.y1), `fill="${fill}"`));
  });
  G.zs.forEach((z, i) => {
    const nx = G.zs[i + 1];
    if (!nx) return;
    const c = C(z.y1);
    if (z.kind === 'lane' && nx.kind === 'lane') out.push(Ln(A0, c, A1, c, `stroke="#fff" stroke-width="${z.dir === nx.dir ? 1.4 : 2}" stroke-dasharray="${z.dir === nx.dir ? '8 8' : '14 9'}"`));
    else if ((z.kind === 'foot') !== (nx.kind === 'foot')) out.push(Ln(A0, c, A1, c, 'stroke="var(--d-kerb)" stroke-width="2"'));
  });
  if (s.bus) {
    const sg = G.side === 'A' ? -1 : 1, c = sg * (edge - 3);
    const [bx, by] = mapXY(axis, 70 * k / 2, sg * (edge + 8), v);
    out.push(Ln(A0, c, A1, c, 'stroke="#1F9D55" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"'));
    out.push(`<g transform="translate(${r1(bx)} ${r1(by)})"><rect x="-10" y="-10" width="20" height="20" rx="5" fill="#1F9D55"/><path d="M-5 -5h10v8h-10zM-5 0h10M-3 5v1M3 5v1" stroke="#fff" stroke-width="1.6" fill="none"/></g>`);
  }
  // street name along the road, on the far side of the road from the address
  {
    const cName = (G.side === 'A' ? 1 : -1) * (edge + verge + 14);
    const [tx, ty] = mapXY(axis, A0 + (axis === 'ns' ? 44 : 22), cName, v);
    out.push(axis === 'ns'
      ? `<text x="${r1(tx)}" y="${r1(ty)}" transform="rotate(-90 ${r1(tx)} ${r1(ty)})" font-size="15" font-weight="800" fill="var(--d-ink)" dominant-baseline="middle">${esc(s.street)}</text>`
      : `<text x="${r1(tx)}" y="${r1(ty)}" font-size="15" font-weight="800" fill="var(--d-ink)" dominant-baseline="middle">${esc(s.street)}</text>`);
  }
  // the address lot: house number
  if (s.number) {
    const sg = G.side === 'A' ? -1 : 1;
    const [hx, hy] = mapXY(axis, 0, sg * (edge + verge + 23 * k), v);
    const lbl = `No. ${s.number}`, w = Math.max(48, lbl.length * 8 + 14);
    out.push(`<g transform="translate(${r1(hx)} ${r1(hy)})"><rect x="${-w / 2}" y="-12" width="${w}" height="24" rx="12" fill="var(--surface)" stroke="var(--hv)" stroke-width="2"/><text y="1" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="900" fill="var(--hv-ink)">${esc(lbl)}</text></g>`);
  }
  // the line from the address to the pin (moved by the drag handler)
  {
    const sg = G.side === 'A' ? -1 : 1;
    const [ax, ay] = mapXY(axis, 0, sg * (edge + verge + 4), v);
    const [px, py] = mapXY(axis, (s.pinA || 0) * k, (s.pinC ?? G.laneC) * k, v);
    out.push(`<line id="pinLine" x1="${r1(ax)}" y1="${r1(ay)}" x2="${r1(px)}" y2="${r1(py)}" stroke="var(--hv)" stroke-width="2.5" stroke-dasharray="4 5" stroke-linecap="round"/><circle cx="${r1(ax)}" cy="${r1(ay)}" r="4.5" fill="var(--hv)"/>`);
  }
  // north arrow and scale bar
  out.push(`<g transform="translate(${W - 26} 26)"><circle r="18" fill="var(--surface)" stroke="var(--line-strong)"/><path d="M0 -3 L6 11 L0 7.5 L-6 11 Z" fill="var(--ink)"/>${inkText('N', 0, -7.5, 11, 'fill="var(--ink)"')}</g>`);
  out.push(`<g transform="translate(14 ${H - 16})"><rect x="-6" y="-16" width="${20 * k + 34}" height="26" rx="6" fill="var(--surface)" opacity=".92"/><path d="M0 -3 V3 H${20 * k} V-3" stroke="var(--ink)" stroke-width="2" fill="none"/><text x="${20 * k + 6}" y="1" font-size="11.5" font-weight="800" fill="var(--ink)" dominant-baseline="middle">20 m</text></g>`);
  return `<svg class="site-map-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of ${esc(s.street)} around number ${esc(s.number)}">${out.join('')}</svg>`;
}

/* Risk matrix laid out as AGTTM Part 10 Table 2.5: consequence rows (catastrophic at the top), likelihood columns */
function riskMatrixSVG(hz, view) {
  const cw = 58, ch = 50, lx = 104, ty = 30, W = lx + cw * 5 + 4, H = ty + ch * 5 + 34;
  const out = [];
  RISK.lik.forEach((l, j) => {
    const x = lx + j * cw + cw / 2;
    out.push(`<text x="${x}" y="${ty - 17}" text-anchor="middle" font-size="12" font-weight="900" fill="var(--ink)">${j + 1}</text><text x="${x}" y="${ty - 5}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--muted)">${esc(l === 'Almost certain' ? 'Almost cert.' : l)}</text>`);
  });
  RISK.sev.forEach(([k, name], i) => {
    const y = ty + i * ch + ch / 2;
    out.push(`<text x="${lx - 10}" y="${y - 2}" text-anchor="end" font-size="12" font-weight="900" fill="var(--ink)">${k}</text><text x="${lx - 10}" y="${y + 11}" text-anchor="end" font-size="9.5" font-weight="700" fill="var(--muted)">${esc(name)}</text>`);
    for (let j = 0; j < 5; j++) {
      const L = 5 - j, C = 5 - i, b = RISK.GRID[i][j];
      const x = lx + j * cw, yy = ty + i * ch;
      const n = hz.filter((h) => (view === 'after' ? h.rL === L && h.rC === C : h.L === L && h.C === C)).length;
      out.push(`<rect x="${x + 1.5}" y="${yy + 1.5}" width="${cw - 3}" height="${ch - 3}" rx="8" fill="var(--risk-${b})" opacity="${n ? 1 : 0.42}"/>`);
      out.push(`<text x="${x + 7}" y="${yy + 15}" font-size="10" font-weight="900" fill="var(--risk-ink-${b})" opacity=".9">${k}${j + 1}</text>`);
      if (n) out.push(`<circle cx="${x + cw / 2 + 6}" cy="${yy + ch / 2 + 5}" r="12" fill="var(--surface)" stroke="rgba(0,0,0,.25)"/>${inkText(n, x + cw / 2 + 6, yy + ch / 2 + 5, 13, 'fill="var(--ink)"')}`);
    }
  });
  out.push(`<text x="${lx + cw * 2.5}" y="${H - 6}" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="1.2" fill="var(--muted)">LIKELIHOOD</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Risk matrix ${view === 'after' ? 'after' : 'before'} controls">${out.join('')}</svg>`;
}

/* A3 landscape sheet: the drawing the designer signs */
function a3SheetSVG(job, s, company) {
  const W = 1190, H = 842;

  const wrap = (t, n) => { const w = t.split(' '); const lines = []; let cur = ''; w.forEach((x) => { if ((cur + ' ' + x).trim().length > n) { lines.push(cur.trim()); cur = x; } else cur += ' ' + x; }); if (cur.trim()) lines.push(cur.trim()); return lines; };

  let lx = 86;
  const legendSVG = legend.map(([kind, label]) => { const x = lx + 10; lx += 28 + label.length * 5.1 + 14; return `${sym(kind, x)}<text x="${x + 16}" y="${LY + 3.4}" font-size="9.4" fill="#111">${esc(label)}</text>`; }).join('');
  return `<svg class="a3" viewBox="0 0 ${W} ${H}" role="img" aria-label="A3 TGS sheet">

/* ============================================================
   Documents: Traffic Management Plan, Hazard & Risk Assessment, SWMS and the Daily
   Timesheet & Site Record. Each follows the company's own Word template section by
   section and is filled from the job. Anything My TGS can't know is left "to complete",
   shown in orange, so nothing is guessed.
   ============================================================ */
const TODO = (label) => ({ todo: label });
const TICK = (on) => ({ tick: on }); // true, false or 'check' (confirm on site)
const SIGN = (sig) => ({ sig }); // { name, at } once signed, or null
const CTL = (controls) => ({ ctl: controls });
const RC = (L, C) => ({ risk: [L, C] }); // a risk code such as B4, coloured by band

const personOf = (id) => TEAM.find((p) => p.id === id);
const qualFor = (p, role) => p?.quals.find((q) => q.role === role);
const accredOf = (p, role, cat) => { const q = (cat ? holdsFor(p, role, cat) : null) || qualFor(p, role); return q ? `${q.short} ${q.number}` : TODO('accreditation number'); };
const COMPANY_MANAGER = { name: 'Dana Clarke', position: 'Operations Manager' }; // demo person

/* Everything the documents share for one job */
function docCtx(job) {
  const d = job.input, s = buildScheme(d, job);
  const num = String(job.number).replace(/\D/g, '');
  const sup = personOf(d.people.supervisor), des = personOf(d.people.designer);
  const creator = personOf(job.createdBy) || sup; // who built the TGS in the app
  const through = s.method === 'stopslow' || s.method === 'pts';
  const plant = d.work.plant || [];
  const bigPlant = plant.some((p) => ['exc', 'tipper', 'vac', 'ewp', 'crane'].includes(p));
  const digs = hasType(d, 'dig', 'pit');
  const crew = crewStatus(d, s);
  const sw = job.swms || {};
  const approved = ['approved', 'live', 'closed'].includes(job.status);
  const hrs = shiftHours(d);
  return {
    job, d, s, num, sup, des, creator, through, plant, bigPlant, digs, crew, sw, approved,
    jobNo: 'TM-' + num, tmpNo: 'TMP-' + num, hraNo: 'HRA-' + num, swmsNo: 'SWMS-' + num, tsNo: 'DTS-' + num,
    tgsRef: `${job.number} Rev ${job.rev}`,
    addr: `${addrLine(d)}, ${d.site.suburb} ${d.site.state || 'VIC'} ${d.site.postcode}`,
    road: d.site.street + (d.road.intersection ? ' (and the side street within the site)' : ''),
    auth: d.road.privateProp ? (d.road.privateAuth || 'Private property') : d.site.authority === 'dtp' ? 'DTP' : d.site.lga,
    authLong: d.road.privateProp ? `Private property: ${d.road.privateAuth || 'owner to confirm'}` : d.site.authority === 'dtp' ? 'Department of Transport and Planning (arterial road)' : `${d.site.lga} (municipal road)`,
    gps: `${d.site.lat.toFixed(5)}, ${d.site.lng.toFixed(5)}`,
    speeds: `${s.speed} km/h posted / ${s.tempSpeed || s.speed} km/h worksite`,
    work: `${workTypesName(d)}: ${d.desc}`,
    dates: fmtDate(d.work.date, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
    hours: `${fmtTime(d.work.start)} to ${fmtTime(d.work.end)}`,
    duration: `${Math.round(hrs * 10) / 10} hours, one ${d.work.night ? 'night' : 'day'} shift${d.work.multiDay ? ', with aftercare' : ''}`,
    shift: d.work.night ? 'Night' : 'Day',
    permit: d.permit ? d.permit : TODO(d.site.authority === 'dtp' ? 'MOA number' : 'council permit number'),
    created: fmtDate((job.created || '').slice(0, 10) || d.work.date, { day: 'numeric', month: 'short', year: 'numeric' }),
    version: sw.version || 1,
  };
}
const staffLine = (p, role, cat) => { if (!p) return TODO('name'); const a = accredOf(p, role, cat); return `${p.name}, ${a.todo ? 'accreditation to confirm' : a}`; };

/* Heavy vehicles as a share of traffic, the measure AGTTM Part 3 uses (Table 2.4 note c: over 10% cuts a lane's capacity) */
const HEAVY_TEXT = { low: 'fewer than 5 in every 100 vehicles are heavy vehicles', med: '5 to 10 in every 100 vehicles are heavy vehicles', high: 'more than 10 in every 100 vehicles are heavy vehicles, so a lane carries 20% less traffic (AGTTM Part 3 Table 2.4)' };

      { lvl: 'isolate', text: `Lane past the work ${c.s.laneLeft.toFixed(1)} m wide, kept swept.` },
    ] },
  { src: 'Schools / community', ev: 'School, childcare or high pedestrian activity nearby', appl: (c) => c.d.road.school,
    cons: 'Children or crowds walk into the work area or the queue', r: [3, 4, 1, 4], owner: 'TMI',

      { lvl: 'eliminate', text: 'Work outside school drop-off and pick-up times where possible.' },

const REGISTER_EXTRA = ['H22', 'H28', 'H40', 'H41', 'H17', 'H33', 'H06', 'H07', 'H04', 'H35', 'H60', 'H61', 'H62', 'H63'];

function hraRegister(c) {
  const byId = Object.fromEntries(c.s.hazards.map((h) => [h.id, h]));
  const rows = REGISTER.map((row) => {
    const on = !!row.appl(c);
    const [L, C, rL, rC] = typeof row.r === 'function' ? row.r(c) : row.r;
    let controls = row.ctl ? row.ctl(c).filter(Boolean) : [];
    if (row.hz && byId[row.hz]) controls = [...byId[row.hz].controls, ...(row.extra || []), ...controls, ...byId[row.hz].np.map((n) => ({ lvl: n.lvl, text: `Considered, not practicable: ${n.why}` }))];
    const seen = new Set();
    controls = controls.filter((x) => (seen.has(x.text) ? false : seen.add(x.text)));
    return { src: row.src, ev: row.ev, on, cons: typeof row.cons === 'function' ? row.cons(c) : row.cons, L, C, rL, rC, controls, owner: row.owner };
  });
  REGISTER_EXTRA.forEach((id) => {
    const h = byId[id];
    if (h) rows.push({ src: 'Site-specific', ev: h.name, on: true, cons: h.why, L: h.L, C: h.C, rL: h.rL, rC: h.rC, controls: h.controls, owner: h.owner });
  });
  return rows;
}

function buildHRA(job) {
  const c = docCtx(job), d = c.d, s = c.s;
  const rows = hraRegister(c);
  const reviewed = c.sw.reviewed;
  return {
    kind: 'hra', title: 'Hazard & Risk Assessment', code: c.hraNo, version: c.version,
    blocks: [

      { t: 'h1', text: 'Job Details' },
      { t: 'kv', rows: [
        ['Job No', c.jobNo, 'Date', c.created],

    ],
  };
}

      { t: 'h2', text: '1.1 Purpose of this TMP' },
      { t: 'p', text: 'The purpose of this Traffic Management Plan (TMP) is to outline the temporary traffic management requirements for the works described in Section 2, and to detail the measures required to ensure the safety of road users, workers and the public while maintaining traffic flow for the duration of the activity.' },
      { t: 'fill', text: `${d.desc} for ${d.client}${d.jobRef ? ` (reference ${d.jobRef})` : ''} at ${c.addr}. The TMP covers about ${Math.round((s.extent.max - s.extent.min) / 10) * 10} m of ${d.site.street} from the first advance sign to the end of works sign, as shown on ${c.tgsRef}.` },
      { t: 'h2', text: '1.2 Traffic management objectives' },
      { t: 'p', text: 'The objectives of this TMP are to: provide a safe environment for the travelling public and construction personnel; cater for the needs of all traffic modes including pedestrians and cyclists (vulnerable road users); communicate the purpose of the proposed traffic events; and communicate the arrangements for, and impacts of, any events affecting traffic. To assist in meeting these objectives the TMP provides information on the scope of works, site conditions, procedures and responsibilities, and the Traffic Guidance Scheme (TGS).' },
      { t: 'fill', text: objectives.length ? `Project-specific objectives: ${objectives.join('; ')}.` : 'No project-specific objectives beyond the standard ones.' },
      { t: 'h2', text: '1.3 Statement of duty of care' },
      { t: 'p', text: `${state.company}, the Traffic Management Implementer, the contractor and the Traffic Management Designer have a duty to manage risks so far as is reasonably practicable and to provide a safe temporary traffic management arrangement for workers, road users and other persons affected by the works. This duty is exercised under the Road Management Act 2004 (Vic), the Road Safety Act 1986 (Vic), the Occupational Health and Safety Act 2004 (Vic) and the Code of Practice for Worksite Safety - Traffic Management.` },
      { t: 'h2', text: '1.4 Site inspection expectation' },
      { t: 'p', text: `The responsible ${state.company} representative undertakes a site visit and/or drive-through inspection before implementation to confirm road geometry, speed environment, sight distance, side roads and property access, pedestrian and cyclist considerations, signage placement, clearances, roadside hazards, parked vehicles, lighting and aftercare requirements. Constraints or changed conditions are communicated directly to the Traffic Management Designer by phone, email, photographs, marked-up plans and/or daily records. Where they affect staging, controls or implementation, the TMP and TGS are reviewed and amended.` },
      { t: 'fill', text: `Site visit by ${c.creator?.name || 'the site supervisor'} on ${c.created}, with ${plural(photoCount(d), 'photo')}${d.media.photos.video ? ' and a walk-through video' : ''} in My TGS. Drive-through inspection before implementation on ${fmtDate(d.work.date, { day: 'numeric', month: 'short', year: 'numeric' })}.` },
      { t: 'h2', text: '1.5 Site induction and training plan' },
      { t: 'p', text: `Traffic management is undertaken by trained and competent personnel operating under ${state.company} procedures. All personnel must hold relevant current competencies for the road category and role, and must attend a site-specific pre-start / toolbox briefing covering the TMP and TGS, roles, site hazards, communications, emergency and incident procedures, PPE, exclusion zones, plant movements, access requirements and inspection findings. Minimum competencies are recorded in Section 3.4.` },
      { t: 'fill', todo: 'Any client-specific induction (e.g. contractor site induction, rail induction)' },
      { t: 'h1', text: '2. Project Overview' },
      { t: 'h2', text: '2.1 Project location' },
      { t: 'fill', text: `${c.road}, ${d.site.suburb}. Work area pinned at ${c.gps}${d.site.pinMoved ? ` (${pinNoteFor(d)})` : ''}. Covered by ${c.tgsRef}.` },
      { t: 'h2', text: '2.2 Project details' },
      { t: 'fill', text: `${workTypesName(d)}: ${d.desc} for ${d.client}. ${plural(d.work.workers || 0, 'worker')}${c.plant.length ? `, plant: ${c.plant.map((p) => PLANT_NAMES[p].replace(/^an? /, '')).join(', ')}` : ''}. Programmed ${c.dates}, ${c.hours} (${c.duration}).` },
      { t: 'h2', text: '2.3 Traffic assessment' },
      { t: 'p', text: 'Traffic volumes have been assessed based on road classification, comparable roads within the region and observed traffic conditions.' },
      { t: 'fill', text: `About ${aadt.toLocaleString('en-AU')} vehicles a day (${d.site.aadtSource}); ${HEAVY_TEXT[d.road.heavy || 'low']}. About ${s.vph} vehicles an hour expected during the works.${through ? ` Expected queue about ${s.queue} m per approach; single lane ${s.shuttle} m${s.shuttleLimit ? `, within the ${s.shuttleLimit} m the guide allows at that volume` : ''}.` : ''}` },
      { t: 'h2', text: '2.4 Site constraints / impacts' },
      { t: 'fill', text: `${constraints}.` },
      { t: 'h2', text: '2.5 Facilities for pedestrians and cyclists' },
      { t: 'p', text: 'The worksite and surrounding areas will be maintained in a safe condition for pedestrians at all times. Where hazards cannot be removed, control measures will be implemented including barriers and exclusion zones, bollards and safety tape, and footpath closure or detour signage where required. Traffic controllers will monitor and assist pedestrians where necessary, including vulnerable road users. Cyclists are managed as road users through the traffic control arrangement with adequate clearance time before opposing traffic is released. Work areas will be maintained free of trip hazards and cleaned at the end of each shift, and adequate lighting will be provided where works extend into low-light conditions.' },
      { t: 'fill', text: s.method === 'footpath' ? `Footpath closed at the work area with a fenced pedestrian route${s.pathWidth ? ` ${s.pathWidth.toFixed(1)} m wide` : ''} and a kerb ramp.` : d.control.peds === 'divert' ? 'People walking are sent to the other footpath at the nearest safe crossing, with signs before the decision point.' : d.control.peds === 'path' ? 'Fenced path around the work for people walking.' : 'The footpath stays open; no crossing relocation or detour needed.' },
      { t: 'h1', text: '3. Project Administration' },
      { t: 'h2', text: '3.1 Pre-start meeting' },
      { t: 'p', text: 'A pre-start meeting is to be held before traffic management duties commence and is to be attended by all on-site traffic management personnel. Matters to be covered include: direct briefing of the traffic controller role; details of the TGS; contact numbers and details of relevant people; breaks; traffic monitoring instructions; and incident management procedures. A daily pre-start toolbox meeting is held to discuss site-specific conditions.' },
      { t: 'h2', text: '3.2 Communication of administrative procedures' },
      { t: 'p', text: 'Contact details for all parties are recorded in Section 3.4. Two-way radio or mobile communication is maintained between traffic controllers and the works crew at all times. Changed conditions, constraints and non-conformances are communicated to the TMI and TMD as they arise and recorded in daily paperwork.' },
      { t: 'h2', text: '3.3 Registers' },
      { t: 'p', text: `Daily site traffic management activity is recorded in ${state.company} daily paperwork, including the SWMS, pre-start record, implementation and signage checks, changes made on site, monitoring and inspection records, incident and defect records, aftercare checks and permit activation/deactivation details. Records are retained on the project file.` },
      { t: 'fill', todo: 'Client paperwork also in use (e.g. contractor SWMS, incident report register)' },
      { t: 'h2', text: '3.4 Responsibilities' },
      { t: 'p', text: 'See the contacts and responsibilities table below.' },
      { t: 'h2', text: '3.5 OH&S' },
      { t: 'p', text: `All work is undertaken in accordance with the Occupational Health and Safety Act 2004 (Vic) and the Occupational Health and Safety Regulations 2017 (Vic), the Code of Practice for Worksite Safety - Traffic Management, WorkSafe Victoria compliance codes and ${state.company} policies and procedures. A Safe Work Method Statement (${c.swmsNo}) is in place for traffic management activities and is signed by all personnel before work commences. PPE requirements, exclusion zones, safe escape paths and manual handling controls are addressed in the SWMS and reinforced at pre-start.` },
      { t: 'h2', text: '3.6 Incident procedures' },
      { t: 'p', text: 'Major incident (fatality or notifiable injury real or potential, significant property damage, or emergency services requiring access to or control of the site): the TMI must immediately stop all activity and traffic movement; secure the site to prevent further injury or damage; contact the appropriate emergency authorities; render first aid if competent and able; notify the road authority representative and/or engineer; under the direction of the officer in charge reduce the effects of temporary traffic management on the road or remove the activity if safe to do so; re-establish traffic management and traffic movements when advised by emergency authorities that it is safe; and comply with any obligation to notify WorkSafe. Where an accident involves serious harm, nothing including traffic management equipment is to be removed or disturbed except to save a life, prevent harm, make the site safe, maintain an essential service, prevent serious property loss, or at the direction of a constable or inspector.' },
      { t: 'h2', text: '3.7 Consultation' },
      { t: 'fill', text: [`${c.authLong}: consent for works${d.site.authority === 'dtp' ? ' and MOA' : ''}`, d.road.bus ? 'bus operator: dates and TGS sent' : null, d.road.tram ? 'Yarra Trams: TMP approval' : null, d.road.driveways ? 'residents with driveways in the site' : null, d.road.school ? 'the school' : null].filter(Boolean).join('; ') + '.', todoAfter: 'who, when and outcome' },
      { t: 'h1', text: '4. Risk Management' },
      { t: 'h2', text: '4.1 Risk management process' },
      { t: 'p', text: `A site-specific temporary traffic management risk assessment (${c.hraNo}) has been completed for this project and is attached at Appendix B. Hazards are assessed using the risk matrix in Section 1, controls are applied using the hierarchy of controls, and residual risk is recorded. The TMI reviews the assessment at pre-start before each attendance and where site conditions change.` },
      { t: 'fill', text: `${c.hraNo} attached at Appendix B; ${c.approved ? `signed by the TMD (${job.approvedBy || c.des?.name})` : 'to be signed by the TMD'}${c.sw.reviewed ? ` and reviewed on site by the TMI (${personName(c.sw.reviewed.by)})` : ''}. Client representative signature to be obtained.` },
      { t: 'h2', text: '4.2 Future risks' },
      { t: 'p', text: 'Foreseeable and emerging risks - including extended occupation duration, changed staging, unattended aftercare periods, low-light and night conditions, seasonal or tourist traffic, weather, and program or scope change - are recorded in the project-specific hazard section of the risk assessment and reviewed as the works progress.' },
      { t: 'fill', text: [d.work.multiDay ? 'Unattended aftercare overnight: reviewed each morning' : null, d.work.night ? 'Night works: lighting and visibility checked at each inspection' : null, 'Weather: forecast checked before each shift', 'Scope or program change: TMP and TGS reviewed before the change'].filter(Boolean).join('. ') + '.' },
      { t: 'h1', text: '5. Traffic Management Implementation' },
      { t: 'h2', text: '5.1 Staging of work' },
      { t: 'p', text: 'See the staging table below.' },
      { t: 'h2', text: '5.2 Night work provisions' },
      ...(d.work.night
        ? [{ t: 'p', text: 'Where works are undertaken at night or extend into low-light conditions, arrangements include portable traffic control devices where authorised, light towers positioned to minimise glare to motorists, additional delineation and hazard lighting, a maintained reduced speed environment where required, and compliant high-visibility night attire for all personnel. Night inspections are undertaken to confirm visibility and ongoing compliance of devices.' }]
        : [{ t: 'fill', text: 'All works will be completed during standard hours - no night works proposed.' }]),
      { t: 'h2', text: '5.3 Traffic guidance schemes' },
      { t: 'fill', text: `${c.tgsRef}: ${s.methodName}. Installed in the set-out order in My TGS (the works-side END ROADWORK first, then each direction from the sign its drivers see first) and removed work area first, then the signs in one loop with the traffic, in accordance with AGTTM Part 6 s6.4 and s8.4. Attached at Appendix A.` },
      { t: 'h1', text: '6. Emergency Arrangements and Contingencies' },
      { t: 'h2', text: '6.1 Emergency arrangements' },
      { t: 'p', text: 'Emergency vehicle access is to be maintained at all times. Traffic controllers must prioritise emergency vehicle movements through or around the site and clear the travel path where required. In an emergency, works cease immediately and the site is made safe. Emergency contacts are listed in Section 3.4.' },
      { t: 'h2', text: '6.2 Contingency planning' },
      { t: 'p', text: 'Where an incident occurs - excessive delays real or potential, a minor or non-injury accident with potential to affect traffic flow, or structural failure of the road - and it is necessary to implement a pre-planned detour, the TMI must notify the road authority and/or engineer when the detour is to be established, drive the detour in both directions to confirm it is stable and safe, remove the detour as soon as practicable once volumes have reduced and tailbacks cleared, and notify the road authority when the detour has been disestablished and normal traffic flows resumed. Works are to be modified, postponed or cancelled where traffic, weather, visibility or site conditions create unacceptable risk.' },
      { t: 'fill', text: [c.digs ? 'Steel plates on site to cover the excavation if the lane must reopen' : null, through ? 'If the queue passes the marker twice or stays past it, someone other than the controller moves PREPARE TO STOP back and extends the speed zone' : null, d.road.driveways ? 'An extra controller or spotter manages driveway movements if access is blocked' : null, 'Works stopped and the site made safe if conditions become unsafe'].filter(Boolean).join('. ') + '.' },
      { t: 'h1', text: '7. Variations' },
      { t: 'h2', text: '7.1 Innovation' },
      { t: 'fill', text: 'No innovative or non-standard treatments proposed - standard treatments from the approved TGS are used.' },
      { t: 'h2', text: '7.2 Evaluation of variations' },
      { t: 'p', text: 'Any variation made on site to optimise safety or visibility is recorded in daily paperwork by the TMI, communicated to the TMD, and evaluated for its effect on the approved arrangement. Where a variation is material, the TMP and/or TGS is updated and re-issued under the version control table in Section 15.' },
      { t: 'h2', text: '7.3 Variation from TMP' },
      { t: 'p', text: 'Where the approved TGS cannot be safely implemented due to site conditions, parked vehicles, visibility, road geometry, pedestrians, plant position or weather, works are to cease and the controls reviewed by the TMI. Where site conditions do not match the TGS assumptions, a site-specific TGS is to be prepared and approved before implementation. The TMI has a duty to postpone, cancel or modify operations due to adverse traffic, weather or other conditions that affect the safety of the site.' },
      { t: 'h1', text: '8. Notification Requirements' },
      { t: 'h2', text: '8.1 Public notification' },
      { t: 'fill', todo: 'Whether public notification is required, the method, lead time and who is responsible (or why it is not required)' },
      { t: 'h2', text: '8.2 Notification of other agencies' },
      { t: 'fill', text: [d.site.authority === 'dtp' ? 'DTP: consent for works and MOA activation/deactivation' : `${d.site.lga}: consent for works`, d.road.bus ? 'bus operator' : null, d.road.tram ? 'Yarra Trams' : null, d.road.school ? 'the school' : null, d.road.driveways ? 'adjoining residents and businesses' : null].filter(Boolean).join('; ') + '.', todoAfter: 'lead times' },
      { t: 'h2', text: '8.3 Notification of emergency services' },
      { t: 'p', text: 'Emergency services are notified where required by the permit or authorisation, and in all cases where a road closure, detour or extended lane closure is in place. Emergency contacts are listed in Section 3.4.' },
      { t: 'fill', text: 'No road closure or detour: notification only if the permit requires it.', todoAfter: 'who was notified, by whom and when, if required' },
      { t: 'h1', text: '9. Monitoring' },
      { t: 'h2', text: '9.1 Site inspections and record keeping' },
      { t: 'p', text: 'Site inspections and monitoring are undertaken during implementation, active works, aftercare or inactive periods and at pack-up, to confirm devices remain correctly positioned, visible, clean, serviceable and suitable for the prevailing conditions. Traffic controllers and PTCD operators actively monitor queue lengths and implement additional end-of-queue treatment where queues extend beyond anticipated limits. Changed conditions, non-conformances or safety concerns are recorded in daily paperwork and rectified as soon as practicable.' },
      { t: 'fill', text: (d.work.multiDay ? 'Attended during works; unattended overnight with after-hours aftercare inspections at the interval set here.' : 'Attended at all times while in place; removed at the end of the shift.') + ' Drive-through inspections every 2 hours while attended (signs, delineation, arrow boards), the first straight after set-up, plus before work starts, before close-down and after any change (AGTTM Part 6 s7). Inspections and controller breaks are recorded on the day sheet in My TGS.' },
      { t: 'h1', text: '10. Management Review' },
      { t: 'h2', text: '10.1 TMP review and improvement' },
      { t: 'p', text: 'This TMP is reviewed when site conditions change, when the road authority or client requests a change, following an incident or non-conformance, and at the intervals recorded in the version control table in Section 15. All revisions are recorded with the reason for change, the reviewer and the date.' },
      { t: 'h2', text: '10.2 Long term projects' },
      { t: 'fill', text: d.work.multiDay ? 'Reviewed at the start of each shift, with aftercare inspections between shifts.' : `Duration ${c.duration}: not applicable - short duration works.` },
      { t: 'h1', text: '11. Traffic Management Plan Auditing' },
      { t: 'h2', text: '11.1 Consideration for audits' },
      { t: 'p', text: 'This TMP, the associated TGS, risk assessment, permits and daily records form the compliance pack for this project and are retained for audit. Where a road category, control level or approval pathway is uncertain or inconsistent between documents, the more conservative control is applied and the basis is recorded as an audit clarification within this TMP.' },
      { t: 'fill', text: `Road category: TTM Category ${cat} (${s.category.text.replace(/^Category \d: /, '')}); competencies set at TC${Math.min(cat, 2)} / TMI${cat} / TMD${cat}.` },
      { t: 'h1', text: '12. Submission and Approval Process' },
      { t: 'h2', text: '12.1 Timeframes for review' },
      { t: 'p', text: 'Permit applications to the road authority and Victoria Police must be submitted at least 60 days before the event or works where an event permit is required. The TMP is to be submitted to the road authority and client in sufficient time to allow review, comment and re-issue before the programmed start date.' },
      { t: 'fill', todo: 'Submission date, the authority reviewing it and the required response date' },
      { t: 'h2', text: '12.2 Review requirements' },
      { t: 'p', text: 'Approval of this TMP authorises the use of any regulatory signs included in the TMP or attached traffic management diagrams. This TMP is approved on the following basis: (1) to the best of the approving engineer\'s / TMI\'s judgment this TMP conforms to the requirements of the Code of Practice and AGTTM; (2) the plan is approved on the basis that the activity, the location and the road environment have been correctly represented by the applicant, and any inaccuracy in the portrayal of this information is the responsibility of the applicant; (3) the TMP provides, so far as is reasonably practicable, a safe and fit-for-purpose temporary traffic management system; and (4) the TMI for the activity is reminded that it is the TMI\'s duty to postpone, cancel or modify operations due to adverse traffic, weather or other conditions that affect the safety of the site.' },
      { t: 'h1', text: 'Contacts and Responsibilities (Section 3.4)' },
      { t: 'table', head: ['Role', 'Name', 'Phone / email', 'Responsibility'], rows: [
        ['Client / Principal', d.client, d.clientContact || TODO('contact'), 'Owns the works; approves the TMP'],
        ['Client site contact', TODO('name'), TODO('phone'), 'Day-to-day contact on site'],
        ['Contractor supervisor', TODO('name'), TODO('phone'), 'Runs the works inside the work area'],
        ['Traffic Management Designer (TMD)', c.des?.name || TODO('name'), c.des?.phone || '', 'Designs and signs the TGS; approves variations'],
        ['Traffic Management Implementer (TMI)', c.sup?.name || TODO('name'), c.sup?.phone || '', 'Sets out, monitors and removes the TTM'],
        ['Site supervisor', c.sup?.name || TODO('name'), c.sup?.phone || '', 'Pre-start, SWMS, inspections, day sheet'],
        ['Traffic controllers', c.crew.filter((x) => x.p.id !== d.people.supervisor).map((x) => x.p.name).join(', ') || TODO('names'), '', 'Control traffic as the TGS shows'],
        ['Road authority (RIM)', c.authLong, TODO('contact'), 'Consent for works'],
        ['Council contact', d.site.authority === 'council' ? d.site.lga : 'Not needed (arterial road)', '', ''],
        ['Public transport operator', d.road.bus || d.road.tram ? TODO('operator contact') : 'Not affected', '', ''],
        ['Emergency services', '000', '', 'Police, fire, ambulance'],
        ['After-hours contact', state.company, COMPANY.phone, 'Call-outs and aftercare'],
      ] },
      { t: 'p', text: 'Minimum competencies - TC1 / TMI1 for low volume roads; TC2 / TMI2 for high volume; TMI3 / TMD3 for motorways and freeways. All personnel must operate within the scope of their accreditation.', small: true },
      { t: 'h1', text: 'Staging Table (Section 5.1)' },
      { t: 'table', head: ['Stage', 'Description of works', 'TGS reference', 'Traffic management controls', 'Dates / duration'], rows: [['1', d.desc, c.tgsRef, cap(controls), `${fmtDate(d.work.date, { day: 'numeric', month: 'short' })}, ${c.hours}`]] },
      { t: 'h1', text: 'Traffic Guidance Scheme Register (Section 5.3)' },
      { t: 'table', head: ['TGS number', 'Title / treatment', 'Notes'], rows: [[c.tgsRef, `${d.site.street}, ${d.site.suburb}: ${s.methodName}`, c.approved ? `Approved by ${job.approvedBy || c.des?.name}` : 'Draft: awaiting the designer\'s sign-off']] },
      { t: 'h1', text: 'Authorisations Register (Section 8.2)' },
      { t: 'table', head: ['Authorisation', 'Required?', 'Granted?', 'Reference No.', 'Notes / expiry'], rows: authRows.map(([a, req, ref]) => [a, req === 'check' ? TODO('check') : yn(req), req === true ? TODO('when granted') : req === 'check' ? '' : 'NA', ref, '']) },
      { t: 'h1', text: 'References (Section 14)' },
      { t: 'h2', text: 'Legislation and codes' },
      { t: 'list', items: ['Road Management Act 2004 (Vic) and Road Management (Works and Infrastructure) Regulations 2015 (Vic)', 'Road Safety Act 1986 (Vic) and Road Safety (Traffic Management) Regulations 2019 (Vic), including Regulation 35 - Traffic Management Plans', 'Road Safety Road Rules 2017 (Vic)', 'Occupational Health and Safety Act 2004 (Vic) and Occupational Health and Safety Regulations 2017 (Vic)', 'Code of Practice for Worksite Safety - Traffic Management (Victoria)'] },
      { t: 'h2', text: 'Austroads Guide to Temporary Traffic Management (AGTTM)' },
      { t: 'table', head: ['Part', 'Title', 'Edition', 'Applies?'], rows: [
        ['Part 1', 'Introduction', '1.2 (May 2026)'], ['Part 2', 'Traffic Management Planning', '1.2 (May 2026)'], ['Part 3', 'Static Worksites', '1.2 (May 2026)'], ['Part 4', 'Mobile Works', '1.2 (May 2026)'], ['Part 5', 'Short Term Low Impact Worksites', '1.2 (May 2026)'], ['Part 6', 'Field Staff - Implementation and Operation', '1.2 (May 2026)'], ['Part 7', 'Traffic Controllers', '1.2 (May 2026)'], ['Part 8', 'Temporary Traffic Management Categories and the National Training Framework', '2.0 (28 Feb 2025)'], ['Part 9', 'Sample Layouts', '1.2 (May 2026)'], ['Part 10', 'Supporting Guidance', '1.2 (May 2026)'],
      ].map((r, i) => [...r, partApplies[i + 1] ? 'Y' : 'N']) },
      { t: 'p', text: 'Note: Parts 1-7, 9 and 10 were reissued as Edition 1.2 in May 2026. Part 8 was reissued separately as Edition 2.0 in February 2025. Austroads report AP-R765-26 documents what changed.', small: true },
      { t: 'h2', text: 'Standards and other documents' },
      { t: 'list', items: ['AS 1742.3:2019 Manual of Uniform Traffic Control Devices - Part 3: Traffic control for works on roads', 'AS/NZS 1906.1 Retroreflective materials and devices for road traffic control purposes', 'Department of Transport and Planning Traffic Engineering Manual (TEM); MOA, RAPP and TOC requirements', 'Road Design Note 06-04 - Accepted Safety Barrier Products', 'Dial Before You Dig (DBYD) requirements', 'WorkSafe Victoria compliance codes and guidance material', `Company Hazard & Risk Assessment (${c.hraNo}) and Safe Work Method Statement (${c.swmsNo})`] },
      { t: 'h1', text: 'Version Control (Section 15)' },
      { t: 'table', head: ['Version', 'Date', 'Reason for change / reviewer comments', 'Revised by', 'Issued to'], rows: [['1', c.created, `First issue with ${c.tgsRef}`, c.des?.name || '', d.client]] },
      { t: 'p', text: 'The version number in this table, the document header and the file name must match.', small: true },
      { t: 'h1', text: 'Declaration and Approval (Section 16)' },
      { t: 'p', text: 'I certify that this Traffic Management Plan has been prepared using the information provided by the client and the available TGS, risk assessment and project documentation at the time of preparation. The traffic management approach is intended to maintain safe road user, worker and vulnerable road user movement for the proposed works. This TMP does not remove the responsibility of the contractor, traffic management implementer or works supervisor to confirm site conditions, implement the TGS safely, monitor the worksite and amend controls where required.' },
      { t: 'table', head: ['Role', 'Name', 'Accreditation / No.', 'Date', 'Signature'], rows: [
        ['Prepared by (TMD)', c.des?.name || TODO('name'), accredOf(c.des, 'design', s.category.cat), c.approved ? (job.approvedAt || '') : '', SIGN(c.approved ? { name: c.des?.name, at: job.approvedAt } : null)],
        ['Approved by (TMI)', c.sup?.name || TODO('name'), accredOf(c.sup, 'implement', s.category.cat), c.sw.reviewed ? c.sw.reviewed.at : '', SIGN(c.sw.reviewed ? { name: c.sup?.name, at: c.sw.reviewed.at } : null)],
        ['Client representative', TODO('name'), '', '', SIGN(null)],
      ] },
      { t: 'h1', text: 'Appendices' },
      { t: 'list', items: [`Appendix A - Traffic Guidance Schemes (${c.tgsRef})`, `Appendix B - Site-specific TTM Risk Assessment (${c.hraNo})`, 'Appendix C - Permits, MOA and authorisations', `Appendix D - Safe Work Method Statement (${c.swmsNo})`, 'Appendix E - Public notification plan (where required)'] },
    ],
  };
}
function pinNoteFor(d) { try { return pinNote({ site: d.site, road: d.road, work: d.work }).replace(/\.$/, ''); } catch (e) { return 'pinned by hand'; } }

/* ---------- Injury and incident report: one for each incident on the job ----------
   Covers what happened, the person hurt and the injury, witnesses, who completed it and the manager's review.
   My TGS fills in the job; everything else comes from the form the supervisor fills in on site. */
const INCIDENT_KINDS = [['injury', 'Injury or illness'], ['near', 'Near miss'], ['vehicle', 'Vehicle into the work area'], ['damage', 'Damage to property or equipment'], ['other', 'Other incident']];
const PERSON_KINDS = [['employee', 'Employee'], ['contractor', 'Contractor'], ['visitor', 'Visitor'], ['public', 'Member of the public']];
const BODY_PARTS = ['Head', 'Eyes', 'Face', 'Neck', 'Shoulder', 'Arm', 'Hand or fingers', 'Chest', 'Back', 'Hip', 'Leg', 'Knee', 'Foot or ankle'];
const TREATMENTS = [['none', 'None needed'], ['firstaid', 'First aid on site'], ['doctor', 'Sent to a doctor'], ['hospital', 'Taken to hospital'], ['ambulance', 'Ambulance called']];
const nameOf = (list, k) => (list.find(([x]) => x === k) || [0, ''])[1];
const incidentNo = (job, r) => `IR-${String(job.number).replace(/\D/g, '')}-${String((job.incidentReports || []).indexOf(r) + 1).padStart(2, '0')}`;
function buildIncident(job, id) {
  const c = docCtx(job), d = c.d;
  const r = (job.incidentReports || []).find((x) => x.id === id) || { id };
  const hurt = r.kind === 'injury';

/* ---------- Letter to residents and businesses: the letter drop before the works ---------- */

      { t: 'h2', text: 'What to expect' },

/* ---------- Weeks and hours, for the timesheet ---------- */

/* ============================================================
   Live location: address search anywhere in Australia, the road at the address, and a real
   street map for placing the work-area pin. Uses the public OpenStreetMap services: Photon for
   addresses (type-ahead), Overpass for the road's tags (speed limit, lanes, one-way, bus routes,
   signals, schools, council), and the OpenStreetMap map tiles. The real app would use the national address
   file (G-NAF) and road authority data. Where these services can't be reached (the published
   artifact blocks outside calls, or there's no signal) the demo street list and sketch map are used.
   ============================================================ */
const GEO = {
  photon: 'https://photon.komoot.io/api/',
  photonReverse: 'https://photon.komoot.io/reverse',
  overpass: ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'],
  bbox: '112.5,-44,154,-9', // Australia
  tile: (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`,
};
const STATE_CODES = { Victoria: 'VIC', 'New South Wales': 'NSW', Queensland: 'QLD', 'Western Australia': 'WA', 'South Australia': 'SA', Tasmania: 'TAS', 'Northern Territory': 'NT', 'Australian Capital Territory': 'ACT' };
const STATE_ROADS = { VIC: 'Department of Transport and Planning', NSW: 'Transport for NSW', QLD: 'Department of Transport and Main Roads', WA: 'Main Roads WA', SA: 'Department for Infrastructure and Transport', TAS: 'Department of State Growth', NT: 'NT Government roads agency', ACT: 'ACT Government roads agency' };

const fetchT = (url, opts = {}, ms = 8000) => { const c = new AbortController(); const t = setTimeout(() => c.abort(), ms); return fetch(url, { ...opts, signal: c.signal }).finally(() => clearTimeout(t)); };

/* "1/7 Lacey St", "Unit 3, 12 Smith St", "u2 5 High St": the unit is kept for the address but left out of the
   search, which works on the street number */
function parseAddr(q) {
  let s = String(q).trim().replace(/\s+/g, ' ');
  let unit = null, m;
  if ((m = s.match(/^(?:(?:unit|u|flat|apt|apartment|shop|suite|villa|townhouse|lot)\s*)?([0-9]+[a-z]?)\s*[\/\\]\s*([0-9]+[a-z]?(?:-[0-9]+[a-z]?)?)\b\s*,?\s*(.*)$/i))) { unit = m[1]; s = `${m[2]} ${m[3]}`.trim(); }
  else if ((m = s.match(/^(?:unit|u|flat|apt|apartment|shop|suite|villa|townhouse)\s*([0-9]+[a-z]?)\s*,?\s+([0-9]+[a-z]?)\s+(.*)$/i))) { unit = m[1]; s = `${m[2]} ${m[3]}`.trim(); }
  const nm = s.match(/^([0-9]+[a-z]?)(?:-[0-9]+[a-z]?)?\s+(.*)$/i);
  return { unit, number: nm ? nm[1] : null, query: s };
}

const geoCache = {};

function geoQuery(raw) {
  clearTimeout(geoTimer);
  const p = parseAddr(raw);
  if (p.query.length < 3) { state.geo = null; paintAddr(); return; }
  state.geo = { q: raw, loading: true, hits: state.geo?.hits || [], parsed: p };
  paintAddr();
  geoTimer = setTimeout(async () => {
    const seq = ++geoSeq;
    try {
      if (Date.now() < (GEO.offlineUntil || 0)) throw new Error('offline'); // don't retry a blocked service on every key
      const hits = await photonSearch(p);
      if (seq !== geoSeq) return;
      state.geo = { q: raw, hits, parsed: p };
    } catch (e) {
      if (seq !== geoSeq) return;
      if (e instanceof TypeError) GEO.offlineUntil = Date.now() + 30000;
      state.geo = { q: raw, offline: true, hits: [], parsed: p };
    }
    paintAddr();
  }, 320);
}
function photonHit(f) {
  const pr = f.properties, [lng, lat] = f.geometry.coordinates;
  const house = pr.type === 'house' || !!pr.housenumber;
  return {
    lat, lng, type: house ? 'house' : pr.type,
    street: house ? pr.street : pr.type === 'street' ? pr.name : pr.street,
    number: house ? pr.housenumber : null,
    suburb: pr.district || pr.locality || pr.city || '', city: pr.city || '', county: pr.county || '',
    stateName: pr.state || '', st: STATE_CODES[pr.state] || '', postcode: pr.postcode || '',
  };
}
async function photonSearch(p) {
  const key = p.query.toLowerCase();
  if (geoCache[key]) return geoCache[key];
  const r = await fetchT(`${GEO.photon}?q=${encodeURIComponent(p.query)}&limit=10&lang=en&bbox=${GEO.bbox}`, {}, 7000);
  if (!r.ok) throw new Error('address service ' + r.status);
  const j = await r.json();
  const seen = new Set();
  const hits = (j.features || []).filter((f) => f.properties?.countrycode === 'AU').map(photonHit)
    .filter((h) => h.street && (h.type === 'house' || h.type === 'street'))
    .filter((h) => { const k = `${h.number || ''}|${h.street}|${h.suburb}|${h.postcode}`; if (seen.has(k)) return false; seen.add(k); return true; });
  if (p.number) hits.sort((a, b) => (b.number === p.number) - (a.number === p.number));
  geoCache[key] = hits.slice(0, 6);
  return geoCache[key];
}
async function photonReverse(lat, lng) {
  const r = await fetchT(`${GEO.photonReverse}?lat=${lat}&lon=${lng}&limit=6&radius=0.2&lang=en`, {}, 7000);
  if (!r.ok) throw new Error('reverse ' + r.status);
  const j = await r.json();
  const au = (j.features || []).filter((x) => x.properties?.countrycode === 'AU');
  // the nearest address or street, not a shop or station name
  const f = au.find((x) => x.properties.type === 'house' && x.properties.street) || au.find((x) => x.properties.type === 'street') || au.find((x) => x.properties.street);
  if (!f) return null;
  const h = photonHit(f);
  h.lat = lat; h.lng = lng; // the phone's position, not the address point
  return h;
}

    addrLat: h.lat, addrLng: h.lng, lat: h.lat, lng: h.lng, pinLat: h.lat, pinLng: h.lng, viewLat: h.lat, viewLng: h.lng, mapZ: 18,

/* the road at the address, from OpenStreetMap: the nearest stretch of the named street, crossing streets, bus and
   tram routes, traffic signals, schools, and the council and state it sits in */
async function lookupRoad(lat, lng, name) {
  const q = `[out:json][timeout:20];way(around:60,${lat},${lng})[highway];out tags geom;rel(bw)[route~"^(bus|tram|trolleybus)$"];out tags;way(around:40,${lat},${lng})[railway=tram];out ids tags;node(around:120,${lat},${lng})[highway=traffic_signals];out ids;nwr(around:250,${lat},${lng})[amenity~"^(school|kindergarten|childcare)$"];out ids tags;is_in(${lat},${lng})->.a;area.a[boundary=administrative][admin_level~"^(4|6)$"];out tags;`;
  let j = null;
  for (const url of GEO.overpass) {
    try {
      const r = await fetchT(url, { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded' } }, 14000);
      const t = await r.text();

  const ways = els.filter((e) => e.type === 'way' && e.geometry && roadRe.test(e.tags?.highway || ''));
  const norm = (x) => String(x || '').toLowerCase().replace(/\bstreet\b/g, 'st').replace(/\broad\b/g, 'rd').replace(/\bavenue\b/g, 'ave').replace(/[^a-z0-9]/g, '');

  const near = (w) => nearestOnWay(w.geometry, lat, lng);
  const named = ways.filter((w) => norm(w.tags.name) === target);
  const pool = (named.length ? named : ways.filter((w) => w.tags.highway !== 'service')).map((w) => ({ w, ...near(w) })).sort((a, b) => a.d - b.d);
  const main = pool[0] || null;

    main: main?.w || null, bearing: main?.bearing ?? 0, snap: main && main.d < 80 ? { lat: main.lat, lng: main.lng } : null,
    crossing: [...new Set(ways.filter((w) => main && w !== main.w && w.tags.name && norm(w.tags.name) !== norm(main.w.tags.name) && near(w).d < 55).map((w) => w.tags.name))],
    routes: els.filter((e) => e.type === 'relation').map((e) => e.tags?.route).concat(els.some((e) => e.tags?.railway === 'tram') ? ['tram'] : []),
    signals: els.some((e) => e.type === 'node' && !e.tags),
    schools: els.filter((e) => e.tags?.amenity).length,

}
/* distance (m) from a point to a polyline and the bearing of the nearest segment (degrees from north) */
function nearestOnWay(geom, lat, lng) {
  const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
  const P = geom.map((g) => [(g.lon - lng) * kx, (g.lat - lat) * ky]);

  for (let i = 0; i < P.length - 1; i++) {
    const [x1, y1] = P[i], [x2, y2] = P[i + 1];
    const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy || 1e-9;
    const t = Math.max(0, Math.min(1, -(x1 * dx + y1 * dy) / L2));

    if (dd < best.d) best = { d: dd, bearing: (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360, lat: lat + py / ky, lng: lng + px / kx };

}

/* Use my location: the phone's GPS where the browser allows it, then the address and road there; the sample site otherwise */
function locateLive(demo) {
  if (!navigator.geolocation || !window.isSecureContext) { setTimeout(() => demo('gps'), 1300); return; }
  let done = false;
  const fail = (why) => { if (!done) { done = true; demo(why); } };
  const timer = setTimeout(() => fail('gps'), 9000);
  navigator.geolocation.getCurrentPosition(async (pos) => {
    if (done) return;
    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
    const h = await photonReverse(lat, lng).catch(() => null);
    if (done) return;
    done = true; clearTimeout(timer);
    if (!h) { demo('lookup'); return; }
    state.locating = false;
    applyLiveAddress(h, null, 'gps', Math.round(accuracy));
    toast('Location captured. Looking up the road…', 'gps');
  }, () => { clearTimeout(timer); fail('gps'); }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 });
}

/* ---------- A real street map with the work-area pin (Web Mercator tiles) ---------- */

  if (s.snapped && !s.pinMoved) return `On ${s.street}, outside the address.`;
  const m = distM(s.addrLat, s.addrLng, s.lat, s.lng);
  if (m < 8) return s.via === 'gps' ? 'Where you stood.' : 'At the address.';
  const dirs = ['north', 'north-east', 'east', 'south-east', 'south', 'south-west', 'west', 'north-west'];
  return `${Math.round(m)} m ${dirs[Math.round(bearingDeg(s.addrLat, s.addrLng, s.lat, s.lng) / 45) % 8]} of ${s.via === 'gps' ? 'where you stood' : 'the address'}.`;
}
function liveMapHTML(d, ask) {
  const s = d.site, z = s.mapZ || 18;
  const [cx, cy] = lngLatToPx(s.viewLng ?? s.addrLng, s.viewLat ?? s.addrLat, z);
  const tx0 = Math.floor(cx / 256) - 2, ty0 = Math.floor(cy / 256) - 1;
  const tiles = [];

    const x = tx0 + i, y = ty0 + j;
    tiles.push(`<img class="tile${i === 2 && j === 1 ? ' centre' : ''}" src="${GEO.tile(z, x, y)}" alt="" draggable="false" style="left:${(x * 256 - cx).toFixed(1)}px;top:${(y * 256 - cy).toFixed(1)}px">`);

    <span class="lm-line" id="pinLine" aria-hidden="true"></span>
    ${s.via === 'gps' ? '' : `<span class="lm-addr" id="lmAddr" style="left:calc(50% + ${(ax - cx).toFixed(1)}px);top:calc(50% + ${(ay - cy).toFixed(1)}px)" title="The address">${ic('building')}</span>`}
    <button class="map-pin ${ask ? 'ask' : ''}" id="mapPin" type="button" style="left:calc(50% + ${(px - cx).toFixed(1)}px);top:calc(50% + ${(py - cy).toFixed(1)}px)" aria-label="Work area pin. Drag it to where the work is, or tap the map.">
      <svg viewBox="0 0 40 52" aria-hidden="true"><path d="M20 50 C20 50 4 31 4 19 A16 16 0 0 1 36 19 C36 31 20 50 20 50 Z" fill="#FF5A14" stroke="#fff" stroke-width="3"/><circle cx="20" cy="19" r="6" fill="#fff"/></svg>
    </button>
    <div class="lm-zoom"><button type="button" data-act="mapZoom" data-dz="1" aria-label="Zoom in">+</button><button type="button" data-act="mapZoom" data-dz="-1" aria-label="Zoom out">−</button></div>
