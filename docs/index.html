<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<script>if (matchMedia('(pointer: coarse) and (max-width: 519px)').matches) location.replace('app.html' + location.hash);</script>
</head>
<body>
<meta charset="utf-8">
<title>My TGS</title>
<style>
  /* The app is built for the phone in a traffic controller's hand, so the preview always shows it as one:
     a phone-sized frame on a wide screen, the whole screen on a phone. */
  :root {
    color-scheme: light;
    --stage: #DCE1E6;
    --stage-glow: #EEF1F4;
    --bezel: #15191E;
    --bezel-edge: #3A424B;
    --screen: #ECEFF2;
    --shadow: rgba(17, 24, 32, .28);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --stage: #05070A; --stage-glow: #10151B; --bezel: #1B2027; --bezel-edge: #38414B; --screen: #0A0D11; --shadow: rgba(0, 0, 0, .6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --stage: #05070A; --stage-glow: #10151B; --bezel: #1B2027; --bezel-edge: #38414B; --screen: #0A0D11; --shadow: rgba(0, 0, 0, .6);
  }
  html, body { height: 100%; }
  body { margin: 0; background: radial-gradient(ellipse 70% 60% at 50% 45%, var(--stage-glow), var(--stage)); background-color: var(--stage); }
  .stage { box-sizing: border-box; min-height: 100%; display: grid; place-items: center; padding: 20px 16px; }
  .phone {
    box-sizing: border-box; width: 410px; max-width: 100%;
    height: calc(100vh - 40px); height: clamp(540px, calc(100dvh - 40px), 864px);
    padding: 10px; border-radius: 46px; background: var(--bezel);
    box-shadow: inset 0 0 0 1px var(--bezel-edge), 0 28px 70px -24px var(--shadow), 0 2px 6px var(--shadow);
  }
  .phone iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 36px; background: var(--screen); color-scheme: inherit; }
  /* on a phone the app is the whole screen */
  @media (max-width: 519px) {
    body { background: var(--screen); }
    .stage { min-height: 0; padding: 0; }
    .phone {
      position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0;
      width: auto; max-width: none; height: auto; padding: 0; border-radius: 0; background: none; box-shadow: none;
    }
    .phone iframe { border-radius: 0; }
  }
</style>
<main class="stage">
  <div class="phone">
    <iframe id="app" title="My TGS" allow="geolocation; clipboard-write; fullscreen" src="app.html"></iframe>
  </div>
</main>
<script>
  /* claude.ai sets the viewer's light or dark choice on this page; the app reads it when its own theme is on auto */
  (() => {
    const frame = document.getElementById('app');
    const sync = () => { try { frame.contentWindow.applyTheme?.(); } catch (e) { /* app not started yet */ } };
    new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', sync);
  })();
</script>

</body>
</html>
